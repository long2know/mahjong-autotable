<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahjong Claw - Autotable Client</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
        background: #1a1a1a;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: #ffffff;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.6;
        min-width: 200px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        z-index: 100;
      }
      #hud .label {
        color: #aaaaaa;
        font-size: 12px;
      }
      #hud .value {
        color: #ffffff;
        font-weight: 600;
      }
      #hud .separator {
        border-top: 1px solid #444444;
        margin: 8px 0;
      }
      #hud-actions-container {
        position: fixed;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="hud">
      <div class="label">Wall</div>
      <div class="value" id="hud-wall">--</div>
      <div class="separator"></div>
      <div class="label">Turn</div>
      <div class="value" id="hud-turn">--</div>
      <div class="separator"></div>
      <div class="label">You</div>
      <div class="value" id="hud-you">--</div>
    </div>
    <div id="hud-actions-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
