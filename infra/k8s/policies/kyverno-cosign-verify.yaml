# Phase K Wave 3 — Apone (DevOps).
#
# Kyverno ClusterPolicy that ENFORCES cosign-keyless signature
# verification for every container image pulled from
# `ghcr.io/long2know/mahjong-autotable:*`. Cluster-layer companion
# to:
#
#   * `.github/workflows/sign-image.yml` (Wave 1) — keyless cosign
#     signing of the multi-arch manifest list on every `main` /
#     `v*.*.*` build.
#   * `.github/workflows/verify-signature.yml` (Wave 2) — reusable
#     verify gate wired into `release.yml`.
#
# Wave 1 + Wave 2 enforce the signature contract IN CI; Wave 3
# extends the same contract DOWN to the cluster admission layer so
# a hand-rolled `kubectl apply` or an Argo CD sync that bypasses
# CI cannot land an unsigned image either. The three layers form
# a defense-in-depth shape: workflow → release-gate → admission.
#
# Apply via:
#
#   helm repo add kyverno https://kyverno.github.io/kyverno/
#   helm install kyverno kyverno/kyverno --namespace kyverno --create-namespace
#   kubectl apply -f infra/k8s/policies/kyverno-cosign-verify.yaml
#
# Verification + operator runbook: docs/admission-policy.md.
#
# ## Action mode by namespace
#
# Kyverno 1.10+ supports `validationFailureActionOverrides` so a
# single ClusterPolicy can be AUDIT-only in `mahjong-staging` (logs
# Policy Reports + allows the pod through) and ENFORCE-only in
# `mahjong-prod` (rejects the admission). Stephen's request:
# audit-mode in staging, enforce-mode in production. We default to
# Audit globally so any new namespace fails SAFE — operator must
# add it to the Enforce list once the SSM-prod cluster has been
# verified to consume signed images.
#
# ## Identity contract
#
# The expected-identity-regex MUST stay in lock-step with the
# canonical signer URL produced by `sign-image.yml`. If that
# workflow is ever renamed or relocated, update this file AND
# `.github/workflows/verify-signature.yml` (the default
# `expected-identity-pattern` input) together.
#
# Canonical signer (Wave 1 + Wave 2):
#   https://github.com/long2know/mahjong-autotable/.github/workflows/sign-image.yml@refs/heads/main
#   https://github.com/long2know/mahjong-autotable/.github/workflows/sign-image.yml@refs/tags/v*
#
# OIDC issuer: https://token.actions.githubusercontent.com
# Rekor URL:   https://rekor.sigstore.dev
# Fulcio CA:   https://fulcio.sigstore.dev

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-mahjong-images
  annotations:
    policies.kyverno.io/title: "Verify mahjong-autotable image signatures (cosign keyless)"
    policies.kyverno.io/category: "Supply-Chain Security"
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "Pod, Deployment, StatefulSet"
    policies.kyverno.io/description: >-
      Every container image pulled from
      `ghcr.io/long2know/mahjong-autotable:*` MUST carry a valid
      cosign keyless signature whose Fulcio cert was issued to
      this repo's `sign-image.yml` workflow on `main` or a
      `v*.*.*` tag, and whose Rekor entry verifies. Unsigned or
      foreign-signed images are rejected in `mahjong-prod` and
      flagged in `mahjong-staging`. See
      `docs/admission-policy.md` for the operator runbook.
spec:
  # Default action: Audit (PolicyReport, do NOT block). The
  # per-namespace overrides below flip prod to Enforce. Defaulting
  # to Audit means a brand-new namespace fails SAFE — operator
  # must explicitly opt into Enforce after verifying the namespace
  # consumes signed images cleanly.
  validationFailureAction: Audit
  validationFailureActionOverrides:
    - action: Enforce
      namespaces:
        - mahjong-prod
    - action: Audit
      namespaces:
        - mahjong-staging
  # `background: false` — verifyImages cannot run as a background
  # scan (Kyverno docs §verifyImages); it MUST run synchronously
  # on admission so the signing-cert presentation is part of the
  # admit/deny decision rather than a delayed PolicyReport.
  background: false
  webhookTimeoutSeconds: 30
  # `failurePolicy: Fail` — if Kyverno cannot reach Fulcio / Rekor,
  # treat as DENY in Enforce namespaces. This is the cosign-policy
  # canonical setting; an outage of the Sigstore stack blocks
  # NEW rollouts in prod (existing pods keep running). The
  # alternative (Ignore) would let unsigned images through during
  # a Sigstore outage — unacceptable for a supply-chain policy.
  failurePolicy: Fail
  rules:
    - name: verify-cosign-keyless-mahjong
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
      # Skip namespaces Kyverno itself runs in plus the kube-system
      # ring to avoid bootstrap chicken-and-egg (admission webhook
      # cannot self-admit while it's still coming up).
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
      verifyImages:
        - imageReferences:
            - "ghcr.io/long2know/mahjong-autotable:*"
            - "ghcr.io/long2know/mahjong-autotable@sha256:*"
          # `MutateDigest: true` rewrites `:tag` to `@sha256:...`
          # after a successful verify so the pod is pinned to the
          # exact bits we just attested. Without this, a tag could
          # be re-pushed between admit and pull — defeating the
          # signature check.
          mutateDigest: true
          # `VerifyDigest: false` — let Kyverno resolve the tag
          # to a digest at admission time. If callers already
          # supplied a digest-qualified reference, the verify
          # below still binds the signature to that digest.
          verifyDigest: false
          required: true
          # `imageRegistryCredentials` left unset — Kyverno uses
          # the in-cluster ImagePullSecrets (kyverno-controller's
          # SA) to fetch the registry manifest. For GHCR private
          # repos, bind a PullSecret to the kyverno SA via:
          #   kubectl -n kyverno create secret docker-registry ghcr-pull --docker-server=ghcr.io ...
          # For our public image (`mahjong-autotable` is public)
          # this is not required.
          attestors:
            - count: 1
              entries:
                - keyless:
                    # Issuer pinning — only signatures whose OIDC
                    # issuer claim matches GitHub Actions. Any
                    # other issuer (manual cosign-sign from a
                    # workstation, a fork's workflow, etc.) fails.
                    issuer: "https://token.actions.githubusercontent.com"
                    # Canonical signer subject pinning. Matches:
                    #   .../sign-image.yml@refs/heads/main
                    #   .../sign-image.yml@refs/tags/v*
                    # Renaming the workflow or moving the repo is
                    # a coordinated change with
                    # .github/workflows/verify-signature.yml.
                    subjectRegExp: "^https://github\\.com/long2know/mahjong-autotable/\\.github/workflows/sign-image\\.yml@refs/(heads/main|tags/v.*)$"
                    rekor:
                      url: "https://rekor.sigstore.dev"
                    ctlog:
                      ignoreSCT: false
          # ── Phase K Wave 5 ────────────────────────────────────
          # Require a SLSA-v1 provenance predicate alongside the
          # cosign signature above. The predicate is attached by
          # `.github/workflows/slsa-provenance.yml` (Wave 5)
          # via `cosign attest --type slsaprovenance1`. The
          # `attestations:` block below verifies BOTH that the
          # predicate exists for the digest under admission AND
          # that its contents match the conditions below.
          #
          # `conditions:` are CEL expressions evaluated against
          # the JSON-decoded predicate. We pin:
          #
          #   * `builder.id` regex — the predicate MUST have been
          #     produced by an `slsa-github-generator` workflow
          #     run owned by THIS repo. A predicate signed by a
          #     fork's workflow would carry that fork's URL in
          #     `builder.id` and fail this check.
          #
          # `attestors:` re-asserts the keyless-identity pin so
          # the DSSE envelope must ALSO have been signed by a
          # workflow run owned by this repo (`slsa-provenance.yml`).
          # Belt-AND-suspenders: subject pin in attestor + content
          # pin in conditions.
          #
          # Wave-4 attestations (single-subject, container generator)
          # will FAIL this check (they're signed by the container
          # generator's identity, not the generic generator's).
          # That's WHY this policy ships in the SAME wave as the
          # workflow refactor — old artefacts retain their Wave-4
          # signature but the Wave-5 policy demands the Wave-5
          # predicate shape. Apply both atomically on a single
          # release cut. See docs/admission-policy.md §6 for the
          # operator runbook + rollback procedure.
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        issuer: "https://token.actions.githubusercontent.com"
                        # Subject pin: predicate MUST be signed by
                        # the SLSA generator reusable workflow when
                        # invoked from THIS repo's
                        # slsa-provenance.yml on main or any v*
                        # tag. Matches the canonical reusable-call
                        # path the generator certificates encode.
                        subjectRegExp: "^https://github\\.com/slsa-framework/slsa-github-generator/\\.github/workflows/generator_generic_slsa3\\.yml@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+$"
                        rekor:
                          url: "https://rekor.sigstore.dev"
                        ctlog:
                          ignoreSCT: false
              conditions:
                - all:
                    # buildDefinition.externalParameters.workflow.repository
                    # must reference this repo. Defends against a
                    # predicate signed by the generator for a DIFFERENT
                    # repo being relayed onto our image (subject pin
                    # above already catches the cert; this re-asserts
                    # at predicate-content level).
                    - key: "{{ predicate.buildDefinition.externalParameters.workflow.repository }}"
                      operator: Equals
                      value: "https://github.com/long2know/mahjong-autotable"
                    # Path pin: the build that produced the
                    # predicate must have run our Wave-5 workflow
                    # (NOT the Wave-4 workflow with the same name,
                    # which used a different generator entrypoint
                    # and therefore a different `buildType`).
                    - key: "{{ predicate.buildDefinition.externalParameters.workflow.path }}"
                      operator: Equals
                      value: ".github/workflows/slsa-provenance.yml"
                    # builder.id pin: regex match on the SLSA
                    # generator URL. A future upstream rename or
                    # major-version bump is a coordinated change
                    # with the `subjectRegExp` above AND this
                    # condition.
                    - key: "{{ predicate.runDetails.builder.id }}"
                      operator: Matches
                      value: "^https://github\\.com/slsa-framework/slsa-github-generator/.+@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+$"
