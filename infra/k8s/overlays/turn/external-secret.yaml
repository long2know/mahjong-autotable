# Phase K Wave 2 — Apone (DevOps).
#
# Overlay-specific ExternalSecret that overrides the base stub.
# Repoints from `aws-secrets-manager-local` (does not exist) to the
# real `aws-secrets-manager-prod` store, and from `/mahjong/local/turn/*`
# to `/mahjong/prod/turn/*` (operator-provisioned).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: turn-server-secrets
  labels:
    app.kubernetes.io/name: turn-server
    app.kubernetes.io/part-of: mahjong-autotable
    app.kubernetes.io/component: turn
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-prod
  target:
    name: turn-server-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        users: "{{ .username }}:{{ .password }}"
        realm: "{{ .realm }}"
  data:
    - secretKey: realm
      remoteRef:
        key: /mahjong/prod/turn/realm
    - secretKey: username
      remoteRef:
        key: /mahjong/prod/turn/username
    - secretKey: password
      remoteRef:
        key: /mahjong/prod/turn/password
