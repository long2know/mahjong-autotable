# Phase J Wave 8 (Apone) — External Secrets template for production.
#
# *** OUT-OF-BAND TEMPLATE — NOT in any kustomization.yaml resources
# list. Apply manually with `kubectl apply -f`:
#
#   kubectl -n mahjong-prod apply -f \
#       infra/k8s/overlays/prod/secret-template.yaml
#
# Mirror of `../../staging/secret-template.yaml` but pointed at
# `mahjong/prod/app` + `aws-secrets-manager-prod`. Refresh cadence is
# the same 1 h — long enough to avoid pounding Secrets Manager, short
# enough that a rotation visibly lands within an hour.
#
# Pre-reqs:
#   * External Secrets Operator installed cluster-wide.
#   * A ClusterSecretStore named `aws-secrets-manager-prod` with an IAM
#     role allowed to GetSecretValue on `mahjong/prod/*`.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mahjong-autotable
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-prod
  target:
    name: mahjong-autotable
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ConnectionStrings__PostgreSql
      remoteRef:
        key: mahjong/prod/app
        property: connectionstrings__postgresql
    - secretKey: ConnectionStrings__SqlServer
      remoteRef:
        key: mahjong/prod/app
        property: connectionstrings__sqlserver
    - secretKey: Auth__JwtSigningKey
      remoteRef:
        key: mahjong/prod/app
        property: auth__jwtsigningkey
    - secretKey: Auth__CookieEncryptionKey
      remoteRef:
        key: mahjong/prod/app
        property: auth__cookieencryptionkey
    - secretKey: Auth__Google__ClientSecret
      remoteRef:
        key: mahjong/prod/app
        property: auth__google__clientsecret
    - secretKey: Auth__GitHub__ClientSecret
      remoteRef:
        key: mahjong/prod/app
        property: auth__github__clientsecret
    - secretKey: Sentry__Dsn
      remoteRef:
        key: mahjong/prod/app
        property: sentry__dsn
