# Phase J Wave 7 — Apone (DevOps).
#
# Production overlay. Postgres-backed by default — flip the configmap to
# Sqlite only for emergency single-pod rollback. HPA target stays at
# replicas=3 baseline (Hudson's recommended min for sticky-session
# resilience to a single pod evict).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase K Wave 12 — Apone (DevOps). Namespace pin moved from the
# top-level `namespace:` directive into a `NamespaceTransformer`
# with `unsetOnly: true` (see `namespace-transformer.yaml`). This
# preserves the W11 behaviour for in-base manifests AND keeps
# the cross-namespace W11 hand-offs
# (`argo-rollouts-ingress-auth.yaml`,
#  `argo-rollouts-network-policy.yaml`) pinned to their declared
# `argo-rollouts` namespace. The old `namespace: mahjong-prod`
# is preserved inside the transformer config above.
namePrefix: prod-

resources:
  - ../../base
  # Phase K Wave 18 — Apone (DevOps). Off-peak HPA `minReplicas`
  # override (cron-scheduled) lives at `infra/k8s/base/hpa-cron-
  # override.yaml` and is wired in via base/kustomization.yaml
  # (LoadRestrictor blocks overlay-side ../../base/<file> refs).
  # The prod overlay inherits the off-peak schedule unchanged
  # from base; the W18 design + operator runbook lives in
  # `docs/hpa-cron-override.md`. Prod-side relevance is the
  # primary driver — staging also benefits but the canonical
  # use-case is the prod off-peak window (US-night / Asia-pre-
  # dawn).
  # Phase K Wave 4 — Apone. Cluster-scoped supplemental policy.
  # Listed as a resource (rather than a patch) because Kyverno
  # ClusterPolicies are independent objects; multiple policies on
  # the same image set just compose (both must verify before
  # admission). See per-file header for rationale.
  - kyverno-enforce-patch.yaml
  # Phase K Wave 15 — Apone (DevOps). Kyverno enforce-mode
  # companion policy PRE-WIRE. The new manifest
  # (`kyverno-enforce-policies.yaml`) carries an Enforce-mode
  # default-action floor for all prod-scoped rules — the W15
  # seed rule asserts the non-root invariant the distroless
  # runtime already satisfies. This resources: entry is
  # PRE-WIRED but COMMENTED OUT — cutover-day enablement is a
  # one-line uncomment. See
  # `docs/kyverno-enforce-rollout.md §3` for the four pre-
  # conditions (30-day W3 audit window ZERO denies + Hudson
  # `kyverno-deny-events` panel green + Hudson
  # `pod-security-violations-prod` panel zero + staging
  # rehearsal) that MUST hold before uncommenting; cutover-day
  # operator procedure lives in `docs/kyverno-enforce-rollout.md
  # §4` and the §6.3 Gate-4 hardening-calendar slot is the
  # squad-level approval gate.
  #
  # Phase K Wave 16 — Apone (DevOps). Cutover-day enablement
  # landed: the W15 four pre-conditions (`docs/kyverno-enforce-
  # rollout.md §3`) are all GREEN after the 5-day observability
  # grace window. See `docs/kyverno-audit-findings-w16.md` for
  # the audit-window findings + `docs/kyverno-enforce-rollout.md
  # §10` for the cutover-day evidence. The `enforce-prod-default`
  # ClusterPolicy is now part of the rendered overlay; admission
  # decisions in `mahjong-prod` enforce the non-root invariant on
  # Pod creation. Rollback path: `git revert <merge-commit>` per
  # `docs/kyverno-enforce-rollout.md §6`.
  - kyverno-enforce-policies.yaml
  # Phase K Wave 12 — Apone (DevOps). Wire in the W11 hand-off
  # manifests previously documented as out-of-band. See
  # `docs/prod-cutover.md §2` for the wire-up rationale.
  # `redis-connection-string-secret.yaml` has no metadata.namespace —
  # picks up `mahjong-prod` from the NamespaceTransformer.
  - redis-connection-string-secret.yaml
  # `argo-rollouts-ingress-auth.yaml` + the W12
  # NetworkPolicy both pre-declare `namespace: argo-rollouts` —
  # the NamespaceTransformer with `unsetOnly: true` honours that.
  - argo-rollouts-ingress-auth.yaml
  - argo-rollouts-network-policy.yaml

transformers:
  - namespace-transformer.yaml
  # Phase K Wave 13 — Apone (DevOps). Strip `metadata.namespace`
  # from cluster-scoped Kinds AFTER the W12 NamespaceTransformer
  # runs. Closes the W12 retro D7 open item (ClusterPolicy
  # namespace quirk). See per-file header for the empirical
  # rationale + the enumerated cluster-scoped Kinds. Order in
  # `transformers:` matters — this MUST follow
  # `namespace-transformer.yaml` so the strip runs against the
  # post-namespace state. See also
  # `docs/cluster-policy-namespace-exclusion.md`.
  - cluster-scoped-fieldspecs.yaml

patches:
  - target:
      kind: Deployment
      name: mahjong-autotable
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "384Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
  - target:
      kind: HorizontalPodAutoscaler
      name: mahjong-autotable
    # Phase K Wave 16 — Apone (DevOps). The W7-era inline JSON-
    # Patch ops (minReplicas + maxReplicas) are now extracted to
    # `hpa-patch.yaml` (strategic-merge). Rendered cluster state is
    # byte-identical (minReplicas: 3, maxReplicas: 12). See
    # `infra/k8s/overlays/prod/hpa-patch.yaml` per-file header for
    # the W16 layout rationale + the W17 5-replica candidate.
    path: hpa-patch.yaml
  - target:
      kind: Ingress
      name: mahjong-autotable
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: mahjong.example.com
      - op: replace
        path: /spec/rules/0/host
        value: mahjong.example.com
  # Phase K Wave 4 — Apone (DevOps). HSTS preload header patch on
  # the Ingress. The header is set via nginx-ingress
  # `configuration-snippet` annotation — see `hsts-patch.yaml` per-
  # file header for the choice of ingress-layer pin vs C# middleware.
  - target:
      kind: Ingress
      name: mahjong-autotable
    path: hsts-patch.yaml
  # Phase K Wave 4 — Apone (DevOps). Mount the JWT signing-keys
  # Secret (materialised by `jwt-keys-secret.yaml` ExternalSecret —
  # OUT-OF-BAND, NOT in resources). Three indexed env vars feed
  # Bishop's W4/W5 `Auth.JwtSigningKeys` array binding (see
  # `docs/jwt-rotation.md` §3 for the ESO + rotation flow). Marked
  # `optional: true` so a fresh cluster without ESO bootstrapped
  # can still start (the app falls back to the singular
  # `Auth:JwtSigningKey` from the omnibus secret).
  - target:
      kind: Deployment
      name: mahjong-autotable
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: mahjong-jwt-keys
            optional: true

  # Phase K Wave 7 — Apone (DevOps). Mount the RS256 JWT
  # signing-keys Secret (materialised by `jwt-rsa-keys-secret.yaml`
  # ExternalSecret — OUT-OF-BAND, NOT in resources, same operational
  # convention as the W4 HS256 secret). Three indexed env vars feed
  # Bishop's W7 `Auth.JwtRsaKeys` array binding. `optional: true`
  # so the deployment can start before the operator has bootstrapped
  # RS256 — the existing HS256 path stays canonical until
  # `Auth:DefaultAlgorithm=RS256` is flipped.
  - target:
      kind: Deployment
      name: mahjong-autotable
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: mahjong-jwt-rsa-keys
            optional: true

  # Phase K Wave 12 — Apone (DevOps). Mount the prod Redis
  # connection-string Secret (materialised by
  # `redis-connection-string-secret.yaml` — wired in via
  # `resources:` above so the ExternalSecret is part of the
  # `kustomize build` graph). The secret carries the
  # `Idempotency__Redis__ConnectionString` env var that the
  # IConnectionMultiplexer factory consumes when
  # `Idempotency:Provider=Redis`. `optional: true` so the
  # deployment can still start during the cutover window before
  # ESO has hydrated the secret from AWS Secrets Manager — the
  # in-memory provider remains the fallback until
  # `Idempotency:Provider=Redis` is flipped via the omnibus
  # configmap. See `docs/redis-cluster.md §11` for the prod
  # sizing + cutover sequence and `docs/prod-cutover.md §2`
  # for the wire-up rationale.
  - target:
      kind: Deployment
      name: mahjong-autotable
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: mahjong-redis-prod
            optional: true

  # Phase K Wave 14 — Apone (DevOps). Post-cutover hardening
  # gate 1 (Redis envFrom `optional: true → false`). The patch
  # below is PRE-WIRED but COMMENTED OUT — the W13 PR-ready
  # artefact moves from "exists on disk only" to "exists on
  # disk AND pre-registered in this kustomization" so the
  # cutover-day enablement is a one-line uncomment, not a
  # multi-line block add. See `docs/prod-cutover.md §6.8
  # "Post-cutover patch enablement"` for the four pre-conditions
  # that must hold before uncommenting + the rollback path.
  # The patch file's own header (`redis-envfrom-required-patch.yaml`)
  # documents the index pin (`/envFrom/4/secretRef/optional`),
  # which is the gating contract this wire-up depends on — if a
  # future wave inserts an additional envFrom entry BEFORE the
  # Redis one, the index pin shifts and the uncomment MUST be
  # paired with a path update in the patch file. The §6.8
  # operator runbook covers that case.
  #
  # DO NOT uncomment until §6.8 pre-conditions are green.
  # - path: redis-envfrom-required-patch.yaml  # ENABLE AT PROD CUTOVER per docs/prod-cutover.md §6.8
  #   target:
  #     kind: Deployment
  #     name: mahjong-autotable

configMapGenerator:
  - name: mahjong-autotable
    behavior: merge
    literals:
      - Persistence__Provider=Postgres
      - Cors__AllowedOrigins__0=https://mahjong.example.com

images:
  - name: ghcr.io/long2know/mahjong-autotable
    newTag: latest
