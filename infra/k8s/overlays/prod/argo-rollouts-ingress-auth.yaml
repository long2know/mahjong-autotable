# Phase K Wave 11 — Apone (DevOps). Phase K Wave 12 wire-in.
#
# Argo Rollouts dashboard ingress with auth-aware OIDC proxy.
#
# W10 shipped the Argo Rollouts cluster install runbook with
# port-forward-only access (`docs/argo-rollouts-setup.md` §4.1
# / §4.2). W11 ships the auth-aware ingress so the squad can
# reach the dashboard via a stable URL gated by the existing
# `oauth2-proxy` + dex OIDC chain (no new identity provider —
# the W2/W3 OAuth chain already covers @squad.mahjong + the
# allow-listed external observers).
#
# W12 status — IN-BAND (cross-namespace). Wired into the prod
# overlay via `kustomization.yaml` (`resources:` list). The
# overlay swapped its top-level `namespace: mahjong-prod`
# directive for a `NamespaceTransformer` with `unsetOnly: true`
# (`namespace-transformer.yaml`) — that transformer leaves
# resources that pre-declare `metadata.namespace` alone, so this
# Ingress stays pinned to `argo-rollouts` (the dashboard
# Service's namespace, which nginx-ingress requires for upstream
# resolution) while in-base resources continue to pick up
# `mahjong-prod` by default. See `docs/prod-cutover.md §2` for
# the cross-namespace wire-up rationale.
#
# Pre-reqs (unchanged from W11):
#
#   1. Argo Rollouts installed per `docs/argo-rollouts-setup.md`
#      §2 (helm chart `argo-rollouts 2.37.7`, controller in
#      ns `argo-rollouts`, dashboard service
#      `argo-rollouts-dashboard:3100`).
#   2. `oauth2-proxy` deployed in ns `auth` and reachable at
#      `https://auth.mahjong.example.com` (the squad's existing
#      OIDC chain — see `docs/oauth-production-setup.md` §4).
#   3. cert-manager + the wildcard ACM cert on `*.mahjong.example.com`
#      (or the per-host LE cert flow).
#
# The ingress is namespace-scoped to `argo-rollouts` (NOT the
# `mahjong-prod` app namespace) because the dashboard service
# lives in that namespace and nginx-ingress requires the Ingress
# resource to be in the same namespace as the upstream Service.
#
# Why a separate file in `overlays/prod/` (rather than in
# `infra/k8s/argo-rollouts/`):
#
#   * The argo-rollouts Helm chart owns the controller + the
#     dashboard Service; it does NOT own the ingress (the chart
#     is intentionally deployment-agnostic — exposing the
#     dashboard is operator's choice).
#   * Apone-lane allowlist owns `infra/k8s/overlays/prod/` —
#     adding the ingress here keeps the resource discoverable
#     in the same overlay as the rest of the prod surface and
#     stays within the W11 lane regex.
#
# Auth flow (nginx-ingress auth-request subrequest):
#
#   1. Client GET /argo-rollouts/ → nginx-ingress.
#   2. nginx-ingress hits `auth.mahjong.example.com/oauth2/auth`
#      with the inbound cookies (auth-url subrequest).
#   3. If auth-url returns 2xx → original request proxies to
#      the dashboard Service.
#   4. If auth-url returns 401 → nginx-ingress 302-redirects to
#      `auth.mahjong.example.com/oauth2/start?rd=<original URL>`
#      (auth-signin); the user lands on dex, signs in, comes
#      back with the cookie set, retries the original request.
#
# The dashboard itself has NO built-in auth (per the W10 §4.3
# warning); this Ingress IS the auth boundary.
#
# Path stripping: the dashboard expects to serve from `/` (it
# emits absolute URLs in its SPA assets); we rewrite
# `/argo-rollouts(/|$)(.*)` → `/$2` via the nginx-ingress
# `rewrite-target` annotation so the SPA can ship under the
# `/argo-rollouts/` prefix on the public host without touching
# the dashboard image. The `app-root` annotation handles the
# bare `/argo-rollouts` (no trailing slash) → `/argo-rollouts/`
# redirect.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-rollouts-dashboard
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/component: dashboard-ingress
    app.kubernetes.io/managed-by: apone
  annotations:
    # ── OIDC auth-request (W11) ─────────────────────────────────
    # Subrequest-based auth — nginx-ingress hits the oauth2-proxy
    # `/oauth2/auth` endpoint on every request. 2xx = allow;
    # 401 = 302 to the auth-signin URL below.
    nginx.ingress.kubernetes.io/auth-url: "https://auth.mahjong.example.com/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.mahjong.example.com/oauth2/start?rd=$escaped_request_uri"
    # Forward the user-identity headers from oauth2-proxy to the
    # upstream dashboard (the dashboard doesn't consume them at
    # W11 — but propagating them now means a future audit-log
    # patch sees the authenticated user).
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Groups"
    # ── Path rewrite — /argo-rollouts/* → /* ─────────────────────
    nginx.ingress.kubernetes.io/rewrite-target: "/$2"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # ── TLS / HSTS hygiene ──────────────────────────────────────
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Tighten the upstream connect timeout — the dashboard is in-
    # cluster; a 5 s ceiling is generous and prevents a hung
    # upstream from stalling the auth-request subrequest budget.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mahjong.example.com
      # The wildcard cert (or the apex cert with a SAN for
      # `mahjong.example.com`) is provisioned by cert-manager
      # / the W11 prod edge stack — see
      # `infra/terraform/envs/prod/main.tf` `module "edge"` for
      # the ACM-validated cert that fronts the ALB.
      secretName: mahjong-tls-cert
  rules:
    - host: mahjong.example.com
      http:
        paths:
          - path: /argo-rollouts(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: argo-rollouts-dashboard
                port:
                  number: 3100
