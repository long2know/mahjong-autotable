# Phase K Wave 11 — Apone (DevOps).
#
# ESO mount for the prod Redis connection string. Bishop's W10
# `RedisIdempotencyStore` runtime reads `Idempotency:Redis:ConnectionString`
# from configuration; the ASP.NET-Core config binder maps the
# env-var `Idempotency__Redis__ConnectionString` onto that key.
#
# *** OUT-OF-BAND TEMPLATE — NOT in any kustomization.yaml resources
# list. Apply manually with `kubectl apply -f` AFTER the matching
# `infra/k8s/overlays/prod/secret-template.yaml` has been applied:
#
#   kubectl -n mahjong-prod apply -f \
#       infra/k8s/overlays/prod/redis-connection-string-secret.yaml
#
# Two separate ExternalSecrets in `mahjong-prod` is the same
# pattern as `jwt-keys-secret.yaml` (W4) — splitting the Redis
# secret out keeps the Redis-token rotation runbook
# (`docs/redis-cluster.md` §8) on its OWN data plane; operators
# rotate the Redis auth-token WITHOUT having to re-shape the
# omnibus secret JSON. The deployment patch in
# `prod-kustomization.yaml` mounts BOTH secrets via envFrom (W12
# hand-off — the kustomization wiring lands once the prod cluster
# bootstrap completes; until then, the deployment falls back to
# the in-process `Idempotency:Redis:ConnectionString` value from
# the omnibus `mahjong-autotable` Secret).
#
# Pre-reqs:
#
#   * External Secrets Operator installed cluster-wide.
#   * A ClusterSecretStore named `aws-secrets-manager-prod` with
#     an IAM role allowed to `ssm:GetParameter` on
#     `arn:aws:ssm:*:*:parameter/mahjong/prod/redis/*` (the W11
#     IAM patch — see `docs/redis-cluster.md` §11).
#   * An SSM SecureString parameter pre-seeded by the operator
#     per `docs/redis-cluster.md` §3 (split-form) or §11 (the
#     W11 prod omnibus-string form):
#
#       /mahjong/prod/redis/connection-string  →  full StackExchange.Redis
#                                                 format connection string
#                                                 (host:port,password=…,
#                                                  ssl=True,abortConnect=False)
#
# Why the omnibus-string form (not split): the .NET runtime's
# `StackExchange.Redis.ConnectionMultiplexer.Connect()` reads a
# single connection-string blob — the split form is operator-
# friendly during rotation but requires the runtime to compose
# `host:port,password=$TOKEN,ssl=True,abortConnect=False` from
# three secrets. The omnibus form is one ESO key → one env-var
# → one runtime read. The split form is documented in §3 for
# the rotation path; the omnibus form (this template) is what
# the prod runtime mounts on every boot.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mahjong-redis-prod
  labels:
    app.kubernetes.io/name: mahjong-autotable
    app.kubernetes.io/component: redis-connection-string
    app.kubernetes.io/managed-by: external-secrets
spec:
  # 15 min refresh — Redis auth-token rotation is the second-most
  # security-sensitive secret we rotate (after JWT). 1 h (the
  # omnibus refresh) is fine for slow-rotating DB strings; for a
  # Redis token rotation we want the new token materialised
  # inside the cluster within minutes. The `force-sync` annotation
  # flow in `docs/redis-cluster.md` §8 still works if the operator
  # needs an immediate refresh.
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-prod
  target:
    name: mahjong-redis-prod
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: mahjong-autotable
          app.kubernetes.io/component: redis-connection-string
  data:
    # Maps to ASP.NET-Core config key:
    #   Idempotency:Redis:ConnectionString
    # via the canonical `__` (double-underscore) array/section
    # separator. Bishop's W10 binding reads
    # `IConfiguration.GetSection("Idempotency:Redis")["ConnectionString"]`.
    - secretKey: Idempotency__Redis__ConnectionString
      remoteRef:
        key: /mahjong/prod/redis/connection-string
