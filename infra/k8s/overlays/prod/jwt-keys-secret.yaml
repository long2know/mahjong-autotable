# Phase K Wave 4 — Apone (DevOps).
#
# ESO mount for `Auth.JwtSigningKeys` (the Wave-3 fallback-list
# schema; Bishop's code-side binding lands in W4/W5).
#
# *** OUT-OF-BAND TEMPLATE — NOT in any kustomization.yaml resources
# list. Apply manually with `kubectl apply -f` AFTER the matching
# overlays/prod/secret-template.yaml has been applied:
#
#   kubectl -n mahjong-prod apply -f \
#       infra/k8s/overlays/prod/jwt-keys-secret.yaml
#
# Two ExternalSecrets in `mahjong-prod` are intentional:
#
#   * `mahjong-autotable` (overlays/prod/secret-template.yaml) — the
#     omnibus secret with DB connection strings + cookie keys +
#     OAuth client secrets + Sentry DSN, sourced from a SINGLE
#     JSON-shaped SSM parameter `mahjong/prod/app`.
#   * `mahjong-jwt-keys` (THIS FILE) — three INDEPENDENT SSM
#     parameters (`/mahjong/prod/auth/jwt/key-{active,previous,archive}`)
#     materialised into a separate Secret. Splitting them out keeps
#     the JWT-rotation runbook (`docs/jwt-rotation.md` §4) on its
#     own data plane — operator rotates JWT keys WITHOUT having to
#     re-shape the omnibus secret JSON. The deployment patch in
#     prod-kustomization.yaml mounts BOTH secrets via envFrom.
#
# The `__N` (double-underscore + index) syntax is ASP.NET Core's
# canonical mapping for array-shaped config keys. The runtime
# config-binder turns:
#
#   Auth__JwtSigningKeys__0 → Auth:JwtSigningKeys[0]
#   Auth__JwtSigningKeys__1 → Auth:JwtSigningKeys[1]
#   Auth__JwtSigningKeys__2 → Auth:JwtSigningKeys[2]
#
# Bishop's W4/W5 binding reads `IConfiguration.GetSection("Auth:JwtSigningKeys").Get<string[]>()`
# and feeds the array into `TokenValidationParameters.IssuerSigningKeys`.
# See `docs/jwt-rotation.md` §2 for the sealed-in code-side contract.
#
# The SSM key-naming convention is the rotation-state name (NOT the
# array index), so the operator never has to compute "which SSM
# key holds index 1 today?" — that bookkeeping happens at ESO-
# materialise time via this template:
#
#   /mahjong/prod/auth/jwt/key-active    → array[0]  (signer)
#   /mahjong/prod/auth/jwt/key-previous  → array[1]  (validator-only fallback)
#   /mahjong/prod/auth/jwt/key-archive   → array[2]  (validator-only fallback, optional)
#
# Rotation procedure (the COMPLETE flow, codified in
# `docs/jwt-rotation.md` §3):
#
#   1. Mint new key  → write to `/mahjong/prod/auth/jwt/key-active`
#   2. Old active   → cycle to `/mahjong/prod/auth/jwt/key-previous`
#   3. Old previous → cycle to `/mahjong/prod/auth/jwt/key-archive`
#   4. ESO picks up within `refreshInterval`; rolling restart re-reads.
#
# `key-archive` is OPTIONAL — the smoke test
# (`tests/smoke/jwt-rotation-smoke.sh`) only exercises [0]+[1]; the
# third slot is defense-in-depth for the 30-day grace window
# (operator may have a long-lived refresh-token user whose JWT was
# minted under a key two rotations ago).
#
# Pre-reqs:
#   * External Secrets Operator installed cluster-wide.
#   * A ClusterSecretStore named `aws-secrets-manager-prod` with an
#     IAM role allowed to `ssm:GetParameter` on
#     `arn:aws:ssm:*:*:parameter/mahjong/prod/auth/jwt/*`.
#   * Three SSM SecureString parameters pre-seeded by the operator
#     (NOT created by this template — secrets never originate in
#     this repo). Use the canonical bootstrap:
#
#       openssl rand -base64 48 | aws ssm put-parameter \
#           --name /mahjong/prod/auth/jwt/key-active \
#           --type SecureString --value file:///dev/stdin
#       openssl rand -base64 48 | aws ssm put-parameter \
#           --name /mahjong/prod/auth/jwt/key-previous \
#           --type SecureString --value file:///dev/stdin
#       openssl rand -base64 48 | aws ssm put-parameter \
#           --name /mahjong/prod/auth/jwt/key-archive \
#           --type SecureString --value file:///dev/stdin

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mahjong-jwt-keys
  labels:
    app.kubernetes.io/name: mahjong-autotable
    app.kubernetes.io/component: jwt-signing-keys
spec:
  # 15 min refresh — JWT key rotation is the most security-sensitive
  # secret rotation we run. 1 h (the omnibus refresh) is fine for
  # the slow-rotating DB strings / OAuth client secrets; for an
  # emergency JWT rotation we want the new key materialised inside
  # the cluster within minutes, not within the hour. The
  # `force-sync` annotation flow in docs/jwt-rotation.md §3 step 3
  # still works if the operator needs an immediate refresh.
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-prod
  target:
    name: mahjong-jwt-keys
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: mahjong-autotable
          app.kubernetes.io/component: jwt-signing-keys
  data:
    # Index 0 → active signer. New tokens are minted with this key.
    - secretKey: auth__jwtsigningkeys__0
      remoteRef:
        key: /mahjong/prod/auth/jwt/key-active
    # Index 1 → previous key. Validator-only fallback for tokens
    # minted before the most recent rotation. 30-day grace window.
    - secretKey: auth__jwtsigningkeys__1
      remoteRef:
        key: /mahjong/prod/auth/jwt/key-previous
    # Index 2 → archive key. Validator-only fallback for tokens
    # minted before the SECOND-most-recent rotation. Defense-in-depth
    # for long-lived refresh-token users. Optional — if the SSM
    # parameter does not exist, ESO will refuse to sync until it's
    # created (fail-loud — see `docs/jwt-rotation.md` §3 for the
    # bootstrap order).
    - secretKey: auth__jwtsigningkeys__2
      remoteRef:
        key: /mahjong/prod/auth/jwt/key-archive
