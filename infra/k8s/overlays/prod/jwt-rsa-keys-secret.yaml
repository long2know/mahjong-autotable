# Phase K Wave 7 — Apone (DevOps).
#
# RS256 JWT signing-keys ExternalSecret — companion to Wave 4's
# HS256 `mahjong-jwt-keys`. Materialises three PEM-formatted RSA
# private keys from SSM into a dedicated Secret that the
# deployment mounts as `Auth__JwtRsaKeys__{0,1,2}`.
#
# *** OUT-OF-BAND TEMPLATE — NOT in any kustomization.yaml resources
# list, mirroring the W4 `jwt-keys-secret.yaml` operational
# convention. Apply manually with `kubectl apply -f` AFTER the
# matching `overlays/prod/secret-template.yaml` has been applied:
#
#   kubectl -n mahjong-prod apply -f \
#       infra/k8s/overlays/prod/jwt-rsa-keys-secret.yaml
#
# Why a SEPARATE Secret (vs adding RSA slots to mahjong-jwt-keys)?
#
#   * HS256 and RS256 are different cryptographic shapes; mixing
#     them in a single Secret would make ESO-side validation a
#     pain (HS256 keys are opaque random bytes, RS256 keys are
#     PEM-encoded RSA private keys — the W7 binding's value
#     parser would have to disambiguate per-index).
#   * Rotation cadence may differ — RS256 keys live LONGER because
#     the JWKS clients (mobile + the federation peers in W8) cache
#     the JWK set; rotating RSA every 30 days would generate
#     unnecessary client-side cache pressure. HS256's 30-day
#     rotation stays; RS256 nominally 90-day.
#   * Bishop's W7 backend binding consumes a NEW config section
#     `Auth:JwtRsaKeys` — keeping it on its own data plane lets
#     the existing `Auth:JwtSigningKeys` binding stay untouched.
#
# Two-binding co-existence (W7 transition):
#
#   * `Auth__JwtSigningKeys__{0,1,2}`     ← Wave 4 — HS256 (existing)
#   * `Auth__JwtRsaKeys__{0,1,2}`         ← Wave 7 — RS256 (NEW)
#
# Bishop's W7 binding accepts BOTH simultaneously. New tokens are
# signed with `JwtRsaKeys[0]` once the operator flips the config
# flag `Auth:DefaultAlgorithm=RS256`. The validator accepts
# tokens signed under EITHER family during the cutover window —
# see `docs/jwt-rotation.md` §9 for the W7 transition runbook.
#
# SSM path naming convention (PEM-encoded SecureString values):
#
#   /mahjong/prod/auth/jwt/rsa-active    → Auth:JwtRsaKeys[0]  (signer)
#   /mahjong/prod/auth/jwt/rsa-previous  → Auth:JwtRsaKeys[1]  (validator-only fallback)
#   /mahjong/prod/auth/jwt/rsa-archive   → Auth:JwtRsaKeys[2]  (validator-only fallback, optional)
#
# Bootstrap (operator runs ONCE per environment, OUT OF BAND —
# the repo never originates private keys):
#
#   # Generate a fresh 2048-bit RSA private key in PEM format.
#   openssl genrsa -out /tmp/jwt-rsa-active.pem 2048
#
#   # Upload as a SecureString — the value is the multi-line PEM.
#   aws ssm put-parameter \
#       --name /mahjong/prod/auth/jwt/rsa-active \
#       --type SecureString \
#       --value "file:///tmp/jwt-rsa-active.pem"
#
#   # Repeat for `rsa-previous` and (optionally) `rsa-archive`.
#   # Wipe the on-disk copies:
#   shred -u /tmp/jwt-rsa-*.pem
#
# Pre-reqs:
#   * External Secrets Operator installed cluster-wide.
#   * The W4 `aws-secrets-manager-prod` ClusterSecretStore (the
#     IAM role's `ssm:GetParameter` allow list is
#     `arn:aws:ssm:*:*:parameter/mahjong/prod/auth/jwt/*` which
#     already covers the new `rsa-*` parameters).
#   * Three SSM SecureString parameters pre-seeded by the operator
#     using the bootstrap above. `rsa-archive` is OPTIONAL during
#     the cutover — the W7 binding tolerates a missing slot 2.
#
# JWKS publication (W8 scope — Bishop):
#
#   The PUBLIC half of `rsa-active` (+ `rsa-previous` + `rsa-archive`
#   if present) is published at `/.well-known/jwks.json` by the
#   backend. The W8 ESO template will also materialise the public
#   keys into a ConfigMap that the JWKS-publishing controller
#   picks up — out of scope for W7.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mahjong-jwt-rsa-keys
  labels:
    app.kubernetes.io/name: mahjong-autotable
    app.kubernetes.io/component: jwt-rsa-signing-keys
spec:
  # 15-min refresh — matches the W4 HS256 cadence. RSA-key
  # rotation is rarer than HS256 rotation but the propagation
  # latency requirement is the same: an emergency revocation
  # MUST land in the cluster within minutes.
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-prod
  target:
    name: mahjong-jwt-rsa-keys
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: mahjong-autotable
          app.kubernetes.io/component: jwt-rsa-signing-keys
  data:
    # Index 0 → active RSA signer. New tokens are minted with
    # this PEM-encoded private key once
    # `Auth:DefaultAlgorithm=RS256` is set.
    - secretKey: auth__jwtrsakeys__0
      remoteRef:
        key: /mahjong/prod/auth/jwt/rsa-active
    # Index 1 → previous RSA key. Validator-only fallback for
    # tokens minted before the most recent rotation. 90-day
    # grace window (RSA cadence is slower than HS256 because
    # JWKS cache TTLs are longer).
    - secretKey: auth__jwtrsakeys__1
      remoteRef:
        key: /mahjong/prod/auth/jwt/rsa-previous
    # Index 2 → archive RSA key. Validator-only fallback for
    # tokens minted before the SECOND-most-recent rotation.
    # Defense-in-depth for long-lived refresh-token users.
    # OPTIONAL during the W7 cutover — the W7 binding tolerates
    # an empty slot here.
    - secretKey: auth__jwtrsakeys__2
      remoteRef:
        key: /mahjong/prod/auth/jwt/rsa-archive
