# Phase K Wave 3 — Apone (DevOps).
#
# ExternalSecret that materialises the `tls-cert-turn` k8s Secret
# consumed by `infra/k8s/base/turn-server.yaml`'s `turns:` listener
# on port 5349. Closes the Phase K Wave 2 TLS gap (documented in
# `docs/turn-server-setup.md` §1.4 as "Phase L follow-up" — Wave 3
# brings it forward so corporate firewalls that block plain
# `:3478` UDP/TCP can still negotiate ICE candidates).
#
# *** OUT-OF-BAND TEMPLATE — NOT in any kustomization.yaml
# resources list. Apply manually with `kubectl apply -f`:
#
#   kubectl -n mahjong-prod apply -f \
#       infra/k8s/overlays/prod/turn-tls-secret.yaml
#
# Mirror of `secret-template.yaml` shape: ExternalSecret bound to
# the `aws-secrets-manager-prod` ClusterSecretStore. The SSM key
# family is `/mahjong/prod/turn/tls/*` — operator-provisioned
# from an ACM-issued cert (or Let's Encrypt via cert-manager, then
# exported into SSM by the operator). We do NOT bind ESO directly
# to AWS Certificate Manager because ACM private certs cannot be
# materialised outside ACM (they live cryptographically inside
# the ACM HSM by design); the operator exports a *public* cert
# (e.g. cert-manager-issued Let's Encrypt R3 for
# `turn.mahjong.example.com`) into SSM SecureString parameters
# at:
#
#   /mahjong/prod/turn/tls/crt   — PEM-encoded cert chain (full chain)
#   /mahjong/prod/turn/tls/key   — PEM-encoded private key (RSA or ECDSA)
#
# The materialised k8s Secret is typed `kubernetes.io/tls` so
# downstream Ingress / Service / coturn TLS consumers can pick it
# up by name. coturn's `--cert /etc/tls/tls.crt --pkey /etc/tls/tls.key`
# args (see base/turn-server.yaml) read the standard
# `kubernetes.io/tls` keys (`tls.crt` + `tls.key`) directly.
#
# ## Pre-reqs (operator action — DevOps does NOT touch production secrets)
#
#   1. Provision a public TLS cert for `turn.mahjong.example.com`
#      (cert-manager + Let's Encrypt HTTP-01, or operator-issued
#      via ACM Public CA with cert export enabled).
#   2. Export the chain + key into SSM:
#        aws ssm put-parameter --type SecureString \
#          --name /mahjong/prod/turn/tls/crt --value "$(cat fullchain.pem)"
#        aws ssm put-parameter --type SecureString \
#          --name /mahjong/prod/turn/tls/key --value "$(cat privkey.pem)"
#   3. Verify the `aws-secrets-manager-prod` ClusterSecretStore's
#      IAM role can `ssm:GetParameter` on
#      `arn:aws:ssm:*:*:parameter/mahjong/prod/turn/tls/*` (one
#      extra rule alongside the existing `/mahjong/prod/turn/*`
#      grant from Wave 2).
#   4. Apply this ExternalSecret. ESO materialises `tls-cert-turn`
#      within 1 h (refreshInterval). After the cert is materialised,
#      `kubectl -n mahjong-prod rollout restart deployment turn-server`
#      so coturn picks up the new mount.
#
# ## Rotation
#
# 60 days before expiry (Let's Encrypt 90-day cert), the operator
# re-runs steps 1–2 with the renewed cert. ESO refreshes on the
# next 1 h tick; restart the Deployment to bind the new file.
# `docs/turn-server-setup.md` §6 captures the runbook in full.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: turn-tls-cert
  namespace: mahjong-prod
  labels:
    app.kubernetes.io/name: turn-server
    app.kubernetes.io/part-of: mahjong-autotable
    app.kubernetes.io/component: turn
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-prod
  target:
    name: tls-cert-turn
    creationPolicy: Owner
    template:
      # Standard k8s TLS Secret shape — coturn picks up tls.crt +
      # tls.key directly without needing extra wiring.
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .crt }}"
        tls.key: "{{ .key }}"
  data:
    - secretKey: crt
      remoteRef:
        key: /mahjong/prod/turn/tls/crt
    - secretKey: key
      remoteRef:
        key: /mahjong/prod/turn/tls/key
