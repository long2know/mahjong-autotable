# Phase K Wave 2 — Apone (DevOps). Production coturn config.
# `external-ip` MUST be set to the LB public IP after the Service
# comes up (operator action; coturn refuses to start without it).
realm=turn.mahjong.example.com
external-ip=REPLACE_WITH_LB_PUBLIC_IP

listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200

lt-cred-mech
user-quota=24
total-quota=480

no-loopback-peers
no-multicast-peers
no-cli
cli-password=DISABLED_BY_NO_CLI

simple-log
log-file=stdout
