# Phase K Wave 7 — Apone (DevOps).
#
# Staging-overlay equivalent of W7's prod
# `overlays/prod/jwt-rsa-keys-secret.yaml`. Same shape, different
# SSM parameter root + different ClusterSecretStore +
# namespace + different target Secret name.
#
# *** Listed in `kustomization.yaml` resources — staging applies
# both `kubectl apply -k`-style. (The prod overlay deliberately
# keeps the JWT secret OUT-OF-BAND for risk-reduction; staging
# folds it into the kustomization to make rotation-rehearsal
# drills cheap.)
#
# See the prod header for the detailed rationale (HS256/RS256
# co-existence, JWKS publication boundary, naming convention).
# This file is intentionally a near-mirror; deltas are:
#
#   * `namespace: mahjong-staging` (implicit via kustomization)
#   * `secretStoreRef.name: aws-secrets-manager-staging`
#   * `target.name: mahjong-jwt-rsa-keys-staging`
#   * SSM root: `/mahjong/staging/auth/jwt/rsa-*`
#   * `app.kubernetes.io/env: staging` label
#
# The `auth__jwtrsakeys__N` env-var KEYS are the same as prod
# (matching the W7 Auth:JwtRsaKeys array shape); only the
# Secret-object name differs to prevent cross-environment
# collision if someone misapplies overlays.
#
# Pre-reqs:
#   * External Secrets Operator installed cluster-wide.
#   * `aws-secrets-manager-staging` ClusterSecretStore with an
#     IAM role allowed to `ssm:GetParameter` on
#     `arn:aws:ssm:*:*:parameter/mahjong/staging/auth/jwt/*`.
#   * Three SSM SecureString parameters pre-seeded by the operator
#     (NOT created by this template — private keys never originate
#     in this repo). See the prod header for the bootstrap
#     procedure, substituting `staging` for `prod`.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mahjong-jwt-rsa-keys-staging
  labels:
    app.kubernetes.io/name: mahjong-autotable
    app.kubernetes.io/component: jwt-rsa-signing-keys
    app.kubernetes.io/env: staging
spec:
  # 15-min refresh — matches prod cadence. Staging should
  # rotate-rehearse at prod cadence so RS256 propagation bugs
  # surface here first.
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-staging
  target:
    name: mahjong-jwt-rsa-keys-staging
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: mahjong-autotable
          app.kubernetes.io/component: jwt-rsa-signing-keys
          app.kubernetes.io/env: staging
  data:
    # Index 0 → active RSA signer.
    - secretKey: auth__jwtrsakeys__0
      remoteRef:
        key: /mahjong/staging/auth/jwt/rsa-active
    # Index 1 → previous RSA key. Validator-only fallback.
    - secretKey: auth__jwtrsakeys__1
      remoteRef:
        key: /mahjong/staging/auth/jwt/rsa-previous
    # Index 2 → archive RSA key. Validator-only fallback,
    # OPTIONAL during W7 cutover.
    - secretKey: auth__jwtrsakeys__2
      remoteRef:
        key: /mahjong/staging/auth/jwt/rsa-archive
