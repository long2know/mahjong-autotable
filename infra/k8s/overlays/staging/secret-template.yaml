# Phase J Wave 8 (Apone) — External Secrets template for staging.
#
# *** OUT-OF-BAND TEMPLATE — NOT in any kustomization.yaml resources
# list. Apply manually with `kubectl apply -f` once the cluster has
# External Secrets Operator installed:
#
#   kubectl -n mahjong-staging apply -f \
#       infra/k8s/overlays/staging/secret-template.yaml
#
# This file REPLACES the placeholder `Secret` named `mahjong-autotable`
# that base/secret-template.yaml ships. Applying both will fight
# (last-write-wins) — pick one. The recommended layout:
#
#   * In `base/kustomization.yaml`, the placeholder Secret stays in
#     resources so that `kubectl apply -k base/` works end-to-end for
#     local dev / kind clusters that don't have ESO.
#   * In a production cluster, run `kubectl apply -k overlays/staging/`
#     FIRST (which applies the placeholder), THEN
#     `kubectl apply -f overlays/staging/secret-template.yaml`
#     to swap the Secret to an ESO-managed one. ESO then owns the
#     refresh loop.
#
# Pre-reqs:
#   * External Secrets Operator: helm repo add external-secrets
#     https://charts.external-secrets.io
#   * A ClusterSecretStore named `aws-secrets-manager-staging` already
#     bound to the right IAM role.
#
# If your cluster does not have ESO, delete this file and rely on the
# base placeholder Secret with real values injected via `kubectl create
# secret generic mahjong-autotable --from-literal=…`.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mahjong-autotable
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-staging
  target:
    name: mahjong-autotable
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ConnectionStrings__PostgreSql
      remoteRef:
        key: mahjong/staging/app
        property: connectionstrings__postgresql
    - secretKey: ConnectionStrings__SqlServer
      remoteRef:
        key: mahjong/staging/app
        property: connectionstrings__sqlserver
    - secretKey: Auth__JwtSigningKey
      remoteRef:
        key: mahjong/staging/app
        property: auth__jwtsigningkey
    - secretKey: Auth__CookieEncryptionKey
      remoteRef:
        key: mahjong/staging/app
        property: auth__cookieencryptionkey
    - secretKey: Auth__Google__ClientSecret
      remoteRef:
        key: mahjong/staging/app
        property: auth__google__clientsecret
    - secretKey: Auth__GitHub__ClientSecret
      remoteRef:
        key: mahjong/staging/app
        property: auth__github__clientsecret
    - secretKey: Sentry__Dsn
      remoteRef:
        key: mahjong/staging/app
        property: sentry__dsn
