# Phase K Wave 5 — Apone (DevOps).
#
# Staging-overlay equivalent of Wave-4's prod
# `overlays/prod/jwt-keys-secret.yaml`. Same shape, different SSM
# parameter root + different ClusterSecretStore + namespace.
#
# *** OUT-OF-BAND TEMPLATE — listed in `kustomization.yaml` so
# `kubectl apply -k overlays/staging/` picks it up alongside the
# omnibus `secret-template.yaml`. Two ExternalSecrets in
# `mahjong-staging` are intentional — exactly mirrors the prod
# split (see `overlays/prod/jwt-keys-secret.yaml` header for the
# detailed rationale):
#
#   * `mahjong-autotable` (overlays/staging/secret-template.yaml) —
#     the omnibus secret with DB connection strings + cookie keys
#     + OAuth client secrets + Sentry DSN, sourced from a SINGLE
#     JSON-shaped SSM parameter `mahjong/staging/app`.
#   * `mahjong-jwt-keys-staging` (THIS FILE) — three INDEPENDENT
#     SSM SecureString parameters
#     (`/mahjong/staging/auth/jwt/key-{active,previous,archive}`)
#     materialised into a separate Secret. Splitting them out
#     keeps the JWT-rotation runbook on its own data plane —
#     operators rotate JWT keys without re-shaping the omnibus
#     secret JSON.
#
# Why a staging clone of the prod surface?
#
# Wave-4 shipped this in prod first because production rotation
# is the user-impacting surface (a JWT key rotation in prod that
# fails takes everyone offline). Staging lagged because the W3
# code-side binding `Auth.JwtSigningKeys` (Bishop's W4/W5 work)
# wasn't yet exercised end-to-end. Wave-5 closes the staging gap
# so:
#
#   * Bishop's `tests/smoke/jwt-rotation-smoke.sh` (which targets
#     a staging URL by default) gets a real Auth.JwtSigningKeys
#     array binding to exercise — previously staging fell back
#     to the singular `Auth__JwtSigningKey` from the omnibus.
#   * Future emergency-rotation drills can be practised in
#     staging before being run in prod (the rotation procedure
#     itself — "cycle key-active → key-previous → key-archive" —
#     becomes muscle memory before it's needed for real).
#   * Pre-prod canaries (Hudson's Wave 6 work, anticipated) can
#     verify the array-binding behaviour without leaning on the
#     omnibus's singular-key fallback.
#
# The 15-min refreshInterval matches prod — staging is the
# regression-rehearsal surface for prod-grade rotation cadence.
# Cheaper SSM polling in staging is a false economy: the goal is
# for staging to BEHAVE like prod, not just deploy like prod.
#
# Pre-reqs:
#   * External Secrets Operator installed cluster-wide.
#   * A ClusterSecretStore named `aws-secrets-manager-staging` with
#     an IAM role allowed to `ssm:GetParameter` on
#     `arn:aws:ssm:*:*:parameter/mahjong/staging/auth/jwt/*`.
#   * Three SSM SecureString parameters pre-seeded by the operator
#     (NOT created by this template — secrets never originate in
#     this repo). Use the canonical bootstrap:
#
#       openssl rand -base64 48 | aws ssm put-parameter \
#           --name /mahjong/staging/auth/jwt/key-active \
#           --type SecureString --value file:///dev/stdin
#       openssl rand -base64 48 | aws ssm put-parameter \
#           --name /mahjong/staging/auth/jwt/key-previous \
#           --type SecureString --value file:///dev/stdin
#       openssl rand -base64 48 | aws ssm put-parameter \
#           --name /mahjong/staging/auth/jwt/key-archive \
#           --type SecureString --value file:///dev/stdin
#
# Wired into the deployment via `kustomization.yaml`'s `envFrom`
# patch — same JSON-patch shape as the prod overlay.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mahjong-jwt-keys-staging
  labels:
    app.kubernetes.io/name: mahjong-autotable
    app.kubernetes.io/component: jwt-signing-keys
    app.kubernetes.io/env: staging
spec:
  # 15 min refresh — matches prod cadence (see prod header for
  # rationale). Staging should rotate-rehearse at prod cadence,
  # not at a slower 1h cadence that would mask propagation bugs.
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-staging
  target:
    # Different target Secret name from prod so the ENVFROM
    # patch below cannot accidentally collide with a prod
    # cluster where someone applied both overlays. The
    # `auth__jwtsigningkeys__N` env-var KEYS are the same as
    # prod (matching the Auth.JwtSigningKeys array shape); the
    # SECRET-OBJECT name differs.
    name: mahjong-jwt-keys-staging
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: mahjong-autotable
          app.kubernetes.io/component: jwt-signing-keys
          app.kubernetes.io/env: staging
  data:
    # Index 0 → active signer. New tokens are minted with this key.
    - secretKey: auth__jwtsigningkeys__0
      remoteRef:
        key: /mahjong/staging/auth/jwt/key-active
    # Index 1 → previous key. Validator-only fallback for tokens
    # minted before the most recent rotation. 30-day grace window.
    - secretKey: auth__jwtsigningkeys__1
      remoteRef:
        key: /mahjong/staging/auth/jwt/key-previous
    # Index 2 → archive key. Validator-only fallback for tokens
    # minted before the SECOND-most-recent rotation. Defense-in-
    # depth for long-lived refresh-token users.
    - secretKey: auth__jwtsigningkeys__2
      remoteRef:
        key: /mahjong/staging/auth/jwt/key-archive
