# Phase J Wave 7 — Apone (DevOps). Wave-5 amendment: jwt-keys-secret wiring.
#
# Staging overlay. Single-replica + Sqlite is the cheapest possible footprint
# for a soak environment; flip to Postgres + replicas=2 in the deployment
# patch below the moment matchmaking volume warrants it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mahjong-staging
namePrefix: staging-

resources:
  - ../../base
  # Phase K Wave 5 — Apone. Staging-equivalent of prod's
  # mahjong-jwt-keys ExternalSecret (Wave 4). Listed as a resource
  # so `kubectl apply -k overlays/staging/` materialises both the
  # omnibus secret AND the JWT-keys secret. See per-file header for
  # rationale (15m refresh, three rotation-state-named SSM params).
  - jwt-keys-secret.yaml
  # Phase K Wave 7 — Apone. Staging-equivalent of W7's prod
  # mahjong-jwt-rsa-keys ExternalSecret. Listed as a resource (the
  # prod equivalent is OUT-OF-BAND for risk-reduction). RS256
  # rotation-rehearsal happens in staging first.
  - jwt-rsa-keys-secret.yaml

patches:
  - target:
      kind: Deployment
      name: mahjong-autotable
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Ingress
      name: mahjong-autotable
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.mahjong.example.com
      - op: replace
        path: /spec/rules/0/host
        value: staging.mahjong.example.com
  # Phase K Wave 5 — Apone (DevOps). Mount the staging JWT
  # signing-keys Secret (materialised by `jwt-keys-secret.yaml`
  # ExternalSecret). Three indexed env vars feed Bishop's
  # `Auth.JwtSigningKeys` array binding — same shape as the
  # prod overlay patch, with the staging-specific Secret name.
  # `optional: true` so a fresh staging cluster without ESO
  # bootstrapped can still start (fallback to the omnibus
  # secret's singular `Auth__JwtSigningKey`).
  - target:
      kind: Deployment
      name: mahjong-autotable
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: mahjong-jwt-keys-staging
            optional: true
  # Phase K Wave 7 — Apone (DevOps). Mount the staging RS256 JWT
  # signing-keys Secret (materialised by `jwt-rsa-keys-secret.yaml`
  # ExternalSecret). Three indexed env vars feed Bishop's W7
  # `Auth.JwtRsaKeys` array binding. `optional: true` so the
  # deployment starts before RS256 bootstrap.
  - target:
      kind: Deployment
      name: mahjong-autotable
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: mahjong-jwt-rsa-keys-staging
            optional: true

configMapGenerator:
  - name: mahjong-autotable
    behavior: merge
    literals:
      - Cors__AllowedOrigins__0=https://staging.mahjong.example.com
      - ASPNETCORE_ENVIRONMENT=Staging

images:
  - name: ghcr.io/long2know/mahjong-autotable
    newTag: latest
