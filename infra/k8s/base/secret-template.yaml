# Phase J Wave 7 — Apone (DevOps).
#
# *** TEMPLATE ONLY — DO NOT APPLY AS-IS. Replace placeholders with
# real values and apply with `kubectl apply -f`, OR (recommended) use a
# secrets manager (Sealed Secrets, external-secrets, SOPS, Vault).
#
# The deployment's `envFrom` block marks this secret as `optional: true`
# so the pod can boot on the Sqlite-only happy path without the
# connection strings being present.
apiVersion: v1
kind: Secret
metadata:
  name: mahjong-autotable
  labels:
    app.kubernetes.io/name: mahjong-autotable
type: Opaque
stringData:
  # ── Postgres ──────────────────────────────────────────────────────
  # Required when Persistence__Provider=Postgres. Use a dedicated
  # least-privilege role; the app only needs SELECT/INSERT/UPDATE/DELETE
  # on its tables plus CREATE for the initial bootstrap.
  ConnectionStrings__PostgreSql: "Host=REPLACE_ME;Port=5432;Database=mahjong_autotable;Username=mahjong;Password=REPLACE_ME;SslMode=Require"

  # ── SQL Server ────────────────────────────────────────────────────
  # Required when Persistence__Provider=SqlServer.
  ConnectionStrings__SqlServer: "Server=REPLACE_ME,1433;Database=mahjong_autotable;User Id=mahjong;Password=REPLACE_ME;TrustServerCertificate=true;Encrypt=true"

  # ── Build provenance override ─────────────────────────────────────
  # Normally baked into the image at build time (Dockerfile ARG
  # BUILD_SHA). Override here for hotfix rebuilds where the image SHA
  # diverges from the source SHA you want surfaced at /health.
  # BUILD_SHA: ""
