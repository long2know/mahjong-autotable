# Phase K Wave 6 — Apone (DevOps).
#
# coturn TURN/STUN server — PRODUCTION manifest.
#
# This is the W6 production-shape successor to the W2 single-replica
# `turn-server.yaml` in this directory. Key differences:
#
#   * 2 replicas (HA across AZs via pod anti-affinity).
#   * `use-auth-secret` HMAC mode (W3 migration; Bishop's `/api/turn`
#     endpoint mints time-limited credentials using the same shared
#     HMAC key — see `docs/turn-server-setup.md` §5).
#   * `static-auth-secret` populated from the ExternalSecret in
#     `coturn-secret.yaml` (one SSM SecureString =
#     `/mahjong/prod/turn/auth_secret`).
#   * Wider media relay port range (49152-65535 — the IANA ephemeral
#     range) matched by the `coturn-netpol` NetworkPolicy.
#   * NetworkPolicy admits UDP 49152-65535 cluster-wide (TURN relay
#     candidates can land on ANY port in the range).
#
# The W2 single-replica `turn-server.yaml` remains for staging
# (where 1 replica is acceptable). Production overlays will
# eventually move to apply ONLY this manifest (`coturn-*.yaml`);
# the W2 file stays in `base/` for staging continuity.
#
# Resource naming pattern: `coturn` (not `turn-server`) so the W6
# manifests can be applied alongside W2 during the cutover.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  labels:
    app.kubernetes.io/name: coturn
    app.kubernetes.io/part-of: mahjong-autotable
    app.kubernetes.io/component: turn
    app.kubernetes.io/version: "4.6"
    mahjong.io/wave: phase-k-wave-6
spec:
  # 2 replicas spread across 2 AZs — one AZ failure does NOT kill
  # the TURN data plane. coturn is stateless per-session for our
  # use (no DB, HMAC validates credentials on each request) so
  # active-active is safe; clients re-bind to whichever replica is
  # behind the LB IP.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: coturn
  strategy:
    # RollingUpdate would drop in-flight ICE sessions; coturn is
    # connection-oriented (TURN relay channels persist). We use
    # the surge-then-drain pattern explicitly so a refresh always
    # spins a fresh pod, waits for it to be ready, then evicts an
    # old one (rather than the rapid Recreate that the default
    # would do at replicas=2 with maxUnavailable=25%).
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coturn
        app.kubernetes.io/component: turn
        app.kubernetes.io/version: "4.6"
        mahjong.io/wave: phase-k-wave-6
    spec:
      # AZ spread — both replicas land in different AZs.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: coturn
              topologyKey: topology.kubernetes.io/zone
      # coturn binds 3478/UDP + 3478/TCP + 5349/TCP (well-known
      # ports — all >1024 so we do NOT need CAP_NET_BIND_SERVICE).
      # Run as non-root for defence-in-depth.
      securityContext:
        runAsNonRoot: true
        runAsUser: 998
        runAsGroup: 998
        fsGroup: 998
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: coturn
          image: coturn/coturn:4.6
          imagePullPolicy: IfNotPresent
          # Top-level args: point at the W6 ConfigMap +
          # SecretRef-mounted HMAC key + the W3 TLS cert (mounted
          # from the existing `tls-cert-turn` Secret — operator
          # provisions via the W3 `turn-tls-secret.yaml` overlay).
          args:
            - --config=/etc/coturn/turnserver.conf
            - --static-auth-secret-file=/etc/coturn/secrets/static-auth-secret
            - --cert=/etc/tls/tls.crt
            - --pkey=/etc/tls/tls.key
            # `--log-binding 0.0.0.0:0` — request-log style; structured
            # output suitable for stdout capture (see W3 §7 alerts).
          ports:
            - name: stun-udp
              containerPort: 3478
              protocol: UDP
            - name: stun-tcp
              containerPort: 3478
              protocol: TCP
            - name: turns-tcp
              containerPort: 5349
              protocol: TCP
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/coturn
              readOnly: true
            - name: secrets
              mountPath: /etc/coturn/secrets
              readOnly: true
            - name: tls
              mountPath: /etc/tls
              readOnly: true
          # coturn has no /health endpoint; TCP-probe the TURN port.
          # If the bind dropped, the probe will fail and k8s will
          # reschedule.
          livenessProbe:
            tcpSocket:
              port: stun-tcp
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: stun-tcp
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: coturn-config
            items:
              - key: turnserver.conf
                path: turnserver.conf
        - name: secrets
          secret:
            secretName: coturn-static-auth-secret
        # Re-uses Wave-3's `tls-cert-turn` Secret — provisioned by
        # `infra/k8s/overlays/prod/turn-tls-secret.yaml` (ESO →
        # `/mahjong/prod/turn/tls/*`). Loud-fail if missing.
        - name: tls
          secret:
            secretName: tls-cert-turn
---
apiVersion: v1
kind: Service
metadata:
  name: coturn
  labels:
    app.kubernetes.io/name: coturn
    app.kubernetes.io/part-of: mahjong-autotable
    app.kubernetes.io/component: turn
    mahjong.io/wave: phase-k-wave-6
  annotations:
    # `Local` traffic-policy preserves the real client IP, which
    # coturn needs to mint relay candidates against. AWS NLB
    # auto-passes the original source IP when this is set.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: coturn
  ports:
    - name: stun-udp
      port: 3478
      targetPort: stun-udp
      protocol: UDP
    - name: stun-tcp
      port: 3478
      targetPort: stun-tcp
      protocol: TCP
    - name: turns-tcp
      port: 5349
      targetPort: turns-tcp
      protocol: TCP
---
# NetworkPolicy — admit the TURN media relay range (UDP 49152-65535).
# coturn allocates ephemeral UDP ports in this range for each relay
# candidate; without an explicit NetworkPolicy allow, a future default-
# deny baseline (`docs/admission-policy.md` candidate) would silently
# break ICE.
#
# `from: []` (empty selector) means "from any source" — TURN relay
# media MUST be reachable from the public internet (clients NAT through
# from anywhere). The Service's NLB + the AWS SG provide the public-
# internet ingress shaping; the NetworkPolicy is the in-cluster guard
# for the pod's egress + ingress permission set.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coturn-relay-ports
  labels:
    app.kubernetes.io/name: coturn
    app.kubernetes.io/part-of: mahjong-autotable
    mahjong.io/wave: phase-k-wave-6
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coturn
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Control-plane ports (3478 UDP + TCP, 5349 TCP).
    - ports:
        - port: 3478
          protocol: UDP
        - port: 3478
          protocol: TCP
        - port: 5349
          protocol: TCP
    # Relay media range — the IANA ephemeral port range; coturn
    # allocates from here for each relay candidate. `endPort` is
    # the standard k8s NetworkPolicy port-range syntax (GA in 1.25+
    # via the NetworkPolicyEndPort feature gate — enabled by default
    # in EKS 1.25+; the W5 Terraform module pins K8s 1.30).
    - ports:
        - port: 49152
          endPort: 65535
          protocol: UDP
  egress:
    # coturn needs to reach arbitrary external IPs to relay media
    # to peers; this is the WHOLE POINT of a TURN server.
    # Restricting egress further would break NAT traversal.
    - {}
