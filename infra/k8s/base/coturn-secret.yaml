# Phase K Wave 6 — Apone (DevOps).
#
# ExternalSecret materialising the HMAC `static-auth-secret` from
# AWS SSM into a k8s Secret that the coturn Deployment mounts.
#
# The Secret name (`coturn-static-auth-secret`) is referenced by:
#   * `coturn-deployment.yaml` (mount path
#     `/etc/coturn/secrets/static-auth-secret`).
#   * Bishop's `/api/turn` endpoint (mounted into the API
#     container OR fetched from the same SSM parameter at startup;
#     either side reads the SAME source-of-truth so HMACs validate
#     symmetrically).
#
# Source SSM parameter: `/mahjong/<env>/turn/auth_secret`.
# Provisioning + rotation are operator-driven (see
# `docs/turn-server-setup.md` §5):
#
#   openssl rand -base64 48 | \
#     aws ssm put-parameter \
#       --name /mahjong/prod/turn/auth_secret \
#       --type SecureString --value file:///dev/stdin
#
# refreshInterval = 15m so a rotation propagates inside the
# documented W3 ICE-credential TTL window (max 1h client-side
# expiry — see §4).
#
# The ClusterSecretStore is overlay-patched
# (`aws-secrets-manager-prod` in prod / `aws-secrets-manager-staging`
# in staging). The base ships the prod store name as a placeholder;
# overlays MUST patch.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coturn-static-auth-secret
  labels:
    app.kubernetes.io/name: coturn
    app.kubernetes.io/part-of: mahjong-autotable
    app.kubernetes.io/component: turn
    mahjong.io/wave: phase-k-wave-6
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager-prod
    kind: ClusterSecretStore
  target:
    name: coturn-static-auth-secret
    creationPolicy: Owner
    # The Secret has ONE key whose VALUE is the HMAC secret. The
    # Deployment mounts the whole Secret directory and addresses
    # the file by name (`--static-auth-secret-file=/etc/coturn/secrets/static-auth-secret`).
    template:
      type: Opaque
      data:
        static-auth-secret: "{{ .auth_secret }}"
  data:
    - secretKey: auth_secret
      remoteRef:
        # Production SSM path. Overlay-patched per environment:
        #   prod  → /mahjong/prod/turn/auth_secret
        #   staging → /mahjong/staging/turn/auth_secret
        key: /mahjong/prod/turn/auth_secret
