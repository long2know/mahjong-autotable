# Phase J Wave 7 — Apone (DevOps).
#
# Base kustomization. Overlays (overlays/staging, overlays/prod) inherit
# everything here and patch the image tag, replica count, ingress host,
# resource limits, and provider/connection-string env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonLabels:
  app.kubernetes.io/name: mahjong-autotable
  app.kubernetes.io/part-of: mahjong-autotable

resources:
  - configmap.yaml
  - secret-template.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  # Phase J Wave 9 — pre-rollout migration Job. `kubectl apply -k` will
  # create the Job each sync; Argo CD / Flux operators sequence it via
  # the `argocd.argoproj.io/sync-wave: -1` annotation in
  # job-migrate.yaml so the migration completes BEFORE the Deployment
  # rolls a new image. See docs/kubernetes.md.
  - job-migrate.yaml
  # Phase K Wave 2 — Apone (DevOps). coturn TURN server scaffold for the
  # WebRTC voice signalling hub. See docs/turn-server-setup.md for the
  # operator runbook. Listed last so a cluster without TURN credentials
  # can `kubectl apply -k . --prune` to peel it back without disturbing
  # the rest of the base.
  - turn-server.yaml

images:
  - name: ghcr.io/long2know/mahjong-autotable
    newTag: latest
