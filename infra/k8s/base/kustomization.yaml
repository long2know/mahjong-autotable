# Phase J Wave 7 — Apone (DevOps).
#
# Base kustomization. Overlays (overlays/staging, overlays/prod) inherit
# everything here and patch the image tag, replica count, ingress host,
# resource limits, and provider/connection-string env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonLabels:
  app.kubernetes.io/name: mahjong-autotable
  app.kubernetes.io/part-of: mahjong-autotable

resources:
  - configmap.yaml
  - secret-template.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  # Phase K Wave 18 — Apone (DevOps). Off-peak HPA `minReplicas`
  # override (cron-scheduled). Listed in base/ rather than only
  # the prod overlay because kustomize's LoadRestrictor blocks
  # an overlay from `resources:`-loading a file outside its own
  # tree; placing the file under base/ + adding it here is the
  # idiomatic kustomize path. Staging inherits the same off-peak
  # optimization (staging's `base/hpa.yaml` floor is also 3 per
  # W16 — the off-peak relax to 1 is benign there too). See the
  # per-file header for the W17 retro design rationale + the
  # Option B (CronJob + kubectl patch hpa) choice + UTC schedule
  # shape (23:00-07:00 off-peak → minReplicas=1, 07:00-23:00
  # on-peak → minReplicas=3). Operator runbook in
  # `docs/hpa-cron-override.md`.
  - hpa-cron-override.yaml
  # Phase J Wave 9 — pre-rollout migration Job. `kubectl apply -k` will
  # create the Job each sync; Argo CD / Flux operators sequence it via
  # the `argocd.argoproj.io/sync-wave: -1` annotation in
  # job-migrate.yaml so the migration completes BEFORE the Deployment
  # rolls a new image. See docs/kubernetes.md.
  - job-migrate.yaml
  # Phase K Wave 2 — Apone (DevOps). coturn TURN server scaffold for the
  # WebRTC voice signalling hub. See docs/turn-server-setup.md for the
  # operator runbook. Listed last so a cluster without TURN credentials
  # can `kubectl apply -k . --prune` to peel it back without disturbing
  # the rest of the base.
  - turn-server.yaml
  # Phase K Wave 6 — Apone (DevOps). Production coturn manifest set
  # (Deployment + ConfigMap + Secret/ExternalSecret) replacing the W2
  # scaffold. NetworkPolicy + HMAC auth wired into turnserver.conf.
  # See docs/turn-server-setup.md §"k8s deployment" for the apply runbook.
  - coturn-deployment.yaml
  - coturn-configmap.yaml
  - coturn-secret.yaml
  # Phase K Wave 22 — Apone (DevOps). SignalR sticky-session shared-cookie
  # validation contract (Kyverno ClusterPolicy). Lives top-level in base/
  # rather than `kyverno-policies/` subdir because it's a SignalR-affinity
  # contract scoped to the Ingress resource shipped from this kustomization
  # — i.e. it's an admission-gate FOR the ingress.yaml above, not a
  # generic cluster-wide rule. K8sManifestSanity test
  # (`BaseKustomization_IncludesAllResources`) enumerates every top-level
  # base/*.yaml and requires each be listed here; missing entries silently
  # skip deploy. See docs/signalr-affinity-validation-w22.md for the
  # admission flow + rejection examples.
  - ingress-validation.yaml

images:
  - name: ghcr.io/long2know/mahjong-autotable
    newTag: latest
