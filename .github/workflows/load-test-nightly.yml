# Phase K Wave 1 — Apone (DevOps).
#
# Nightly load test cron.
#
# Boots the production-shaped docker-compose stack on a GitHub-hosted runner,
# waits for `/health` to go green, runs `tests/load/lobby-flood.js` via
# `tests/load/run-and-compare.sh`, persists the JSON summary as an artefact,
# and APPENDS a row to `docs/load-test-results-history.md` describing the run.
#
# If the current p99 for any of the three workloads (lobby / join /
# tournament) grows by more than 25% vs the prior recorded run, the wrapper
# script exits non-zero, this workflow goes RED, and the alerting steps fire:
#
#   1. A Sentry event is emitted by the wrapper itself (if SENTRY_DSN is
#      configured as a repo secret) so the existing Sentry alert rules
#      fan out to whatever channel the operator wired up there.
#   2. A failure-notification email is sent via `dawidd6/action-send-mail`
#      when the corresponding SMTP_* secrets are present. (No secrets ⇒
#      the step degrades to a workflow-summary note; the run is still RED.)
#
# Schedule: 02:00 UTC daily. Late enough that same-day main pushes have
# finished building + signing, early enough that a regression is visible
# on Stephen's morning dashboard (UTC-5/6 ≈ 20:00–21:00 local).

name: load-test-nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      duration_s:
        description: "Load test duration in seconds (default 60)."
        required: false
        default: "60"
      regression_pct:
        description: "Regression threshold for p99 (percent; default 25)."
        required: false
        default: "25"

permissions:
  contents: read
  packages: read

jobs:
  load-test:
    name: docker-compose + lobby-flood + history append
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need full history so `git rev-parse --short HEAD` resolves
          # and the wrapper can stamp the commit column in the history file.
          fetch-depth: 1

      - name: Set up Node (for lobby-flood.js + the sentry helper)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install load-test deps
        run: |
          cd tests/load
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # Stand up the production-shaped stack. We use the base
      # docker-compose.yml — that's the canonical "production single image"
      # surface Stephen ships. The compose file builds from local
      # Dockerfile on first up, so this also serves as a build smoke.
      - name: docker compose up (production-shaped stack)
        run: |
          docker compose -f docker-compose.yml up -d --build
          docker compose -f docker-compose.yml ps

      - name: Wait for /health
        env:
          PORT: "8080"
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:${PORT}/health" > /dev/null 2>&1; then
              echo "✅ /health responding after ${i}s"
              curl -fsS "http://localhost:${PORT}/health"
              echo
              exit 0
            fi
            sleep 1
          done
          echo "❌ /health did not respond within 60s"
          docker compose -f docker-compose.yml logs --tail 100
          exit 1

      # Run the load test + regression compare + history-file append.
      # Wrapper exit codes: 0 = pass, 1 = setup/runtime/parse failure,
      # 2 = regression beyond threshold. We treat 2 as "alertable" — the
      # job goes RED but the artefact + history row are still uploaded.
      - name: Run lobby-flood + regression compare
        id: loadtest
        env:
          BASE_URL: http://localhost:8080
          DURATION_S: ${{ github.event.inputs.duration_s || '60' }}
          REGRESSION_PCT: ${{ github.event.inputs.regression_pct || '25' }}
          GIT_SHA: ${{ github.sha }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set +e
          tests/load/run-and-compare.sh
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$rc" -eq 2 ]; then
            echo "result=regression" >> "$GITHUB_OUTPUT"
            # Fall through — we want the artefacts uploaded before exiting RED.
            exit 0
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Tail compose logs on regression / failure
        if: always() && steps.loadtest.outputs.result != 'pass'
        run: |
          mkdir -p .work/loadtest/compose-logs
          docker compose -f docker-compose.yml logs --tail 500 \
            > .work/loadtest/compose-logs/compose.log 2>&1 || true
          docker compose -f docker-compose.yml ps \
            > .work/loadtest/compose-logs/ps.txt 2>&1 || true

      - name: Upload load-test artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-${{ github.run_id }}
          path: |
            .work/loadtest/
            docs/load-test-results-history.md
          if-no-files-found: warn
          retention-days: 30

      # Best-effort SMTP alert. Degrades gracefully when SMTP_* secrets are
      # absent (the workflow still goes RED and the Sentry event from the
      # wrapper already fired). The action below skips itself cleanly when
      # `username` is empty — we double-guard with the `if:` to be defensive.
      - name: Send failure email
        if: always() && steps.loadtest.outputs.result == 'regression' && env.SMTP_USERNAME != ''
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🚨 Mahjong Autotable — nightly load test p99 regression"
          to: ${{ secrets.ALERT_EMAIL_TO || secrets.SMTP_USERNAME }}
          from: "Mahjong Autotable CI <${{ secrets.SMTP_USERNAME }}>"
          body: |
            The nightly load test detected a p99 latency regression beyond
            the configured threshold.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}
            Threshold: ${{ github.event.inputs.regression_pct || '25' }}%

            History file: docs/load-test-results-history.md
            Raw JSON: workflow artefact `load-test-${{ github.run_id }}` → .work/loadtest/

            A Sentry event was also emitted (if SENTRY_DSN is configured).

      - name: Workflow summary
        if: always()
        env:
          RESULT: ${{ steps.loadtest.outputs.result }}
        run: |
          {
            echo "### Nightly load test (Phase K Wave 1)"
            echo ""
            echo "- Result: \`${RESULT:-failure}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Threshold: \`${{ github.event.inputs.regression_pct || '25' }}%\` p99 regression vs prior run"
            echo "- History file: \`docs/load-test-results-history.md\`"
            echo "- Artefact: \`load-test-${{ github.run_id }}\`"
            echo ""
            case "${RESULT:-}" in
              pass)
                echo "✅ no regression beyond threshold"
                ;;
              regression)
                echo "🚨 p99 regression detected — see \`docs/load-test-results-history.md\` and the artefact for the comparison detail."
                ;;
              *)
                echo "❌ workflow failed before regression analysis could complete — see job logs."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      # If the wrapper reported a regression, make the job RED at the end
      # so the Actions dashboard shows the failure. We deferred this so the
      # alerting + artefact steps could run first.
      - name: Fail on regression
        if: always() && steps.loadtest.outputs.result == 'regression'
        run: |
          echo "::error::load-test p99 regression beyond ${{ github.event.inputs.regression_pct || '25' }}%"
          exit 1

      - name: docker compose down
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v --remove-orphans || true
