# Phase K Wave 10 — Apone (DevOps). Original synthetic probe.
# Phase K Wave 11 — Apone (DevOps). Multi-region matrix (us-east-1,
#                                   us-west-2, eu-west-1, ap-southeast-1)
#                                   + per-region cooldown state machine.
#
# Production health probe — synthetic checks against the live
# edge from FOUR regional probe targets. Complements the Sentry
# (W6) + Prometheus (W7) reactive stack with a 5-minute
# multi-region proactive probe.
#
# ## What it does (W11)
#
# Every 5 minutes the workflow fans out a 4-job matrix — one per
# region — and each region hits four endpoints + asserts basic
# invariants against its closest CloudFront edge:
#
#   * `/healthz`              — HTTP 200; body has `"status":"ok"`.
#   * `/readyz`               — HTTP 200; latency under the budget.
#   * `/metrics`              — HTTP 200; body size sanity check
#                               (>1024 bytes — guarantees the
#                               Prometheus surface didn't degrade
#                               to an empty 200).
#   * `/.well-known/jwks.json`— HTTP 200; JSON body has at least 3
#                               `keys` entries (per W7 + W10 §3 —
#                               active/previous/archive).
#
# ## Per-region target resolution
#
# Each matrix job resolves its base URL via a repository variable
# named `PROD_BASE_URL_<REGION>` (e.g. `PROD_BASE_URL_US_EAST_1`).
# Falls back to `PROD_BASE_URL` for any region without a regional
# override, then to the hard-coded
# `https://api.mahjong-autotable.com` default. This lets the
# operator point each region at a region-specific CloudFront
# edge / Route 53 latency-routed alias without changing the
# workflow.
#
# ## Cooldown / paging — PER REGION
#
# Strikes + recoveries are tracked PER REGION via a per-region
# HTML state marker in the issue body:
#
#   <!-- prod-health-check:state region=us-east-1 strikes=N recoveries=M -->
#
# A region's marker is independent — a single-region outage opens
# the issue without waiting on the other three. The issue body
# carries one marker per region (4 total). The aggregation rule:
#
#   * Issue OPENS when ANY region reaches `strikes >= 3` and no
#     incident is already open.
#   * Issue UPDATES when ANY failing region's strikes change.
#   * Issue CLOSES when ALL regions hit `recoveries >= 2`
#     consecutively (the strict-AND closure rule — partial
#     recovery in one region while another is still failing
#     keeps the incident open).
#
# Pre-W11 (single-region): one strike counter, one paging
# threshold. The matrix extension is strictly additive — the
# W10 behaviour against a single region is a degenerate case of
# the W11 matrix (operator can pin the matrix to one region via
# `workflow_dispatch.inputs.regions` if needed for a planned
# focused probe).
#
# ## Configuration
#
# Repository variables:
#   * `PROD_BASE_URL`              — global fallback (default
#                                    `https://api.mahjong-autotable.com`).
#   * `PROD_BASE_URL_US_EAST_1`    — per-region override
#                                    (closest us-east-1 edge).
#   * `PROD_BASE_URL_US_WEST_2`    — per-region override.
#   * `PROD_BASE_URL_EU_WEST_1`    — per-region override.
#   * `PROD_BASE_URL_AP_SOUTHEAST_1`— per-region override.
#
# Repository secret `SLACK_WEBHOOK_URL` (optional — when missing,
# only the GitHub issue is opened).
#
# ## Disabling for planned maintenance
#
# `workflow_dispatch` with `pause_until=<RFC3339 timestamp>` sets
# a pause window via the dispatch input; the cron job aborts
# before probing if the current time is before the expiry.

name: prod-health-check

on:
  # Apone — CI emergency fix (post-W22 merge). The scheduled
  # probe is DISABLED until the us-east-1 / global production
  # endpoint (api.mahjong-autotable.com) is actually applied by
  # Stephen — the 15-wave deferral arc means the host doesn't
  # resolve yet, so the */5min cron was paging the operator with
  # `body.out: No such file or directory` failure emails every
  # cycle. Re-enable the `schedule:` block once the global edge
  # is provisioned + at least one regional `PROD_BASE_URL_*` var
  # is set to a routable host. Until then the workflow is only
  # callable via `workflow_dispatch` for manual smoke tests.
  #
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated regions to probe (subset of us-east-1,us-west-2,eu-west-1,ap-southeast-1). Default all 4."
        required: false
        default: "us-east-1,us-west-2,eu-west-1,ap-southeast-1"
        type: string
      readyz_latency_budget_ms:
        description: "Override /readyz latency budget in ms (default 1500)."
        required: false
        default: "1500"
        type: string
      reset_strike_counter:
        description: "Reset the consecutive-failure counter (use after manual triage). Resets ALL regions."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: prod-health-check
  cancel-in-progress: false

env:
  READYZ_BUDGET_MS: ${{ github.event.inputs.readyz_latency_budget_ms || '1500' }}
  STRIKE_THRESHOLD: "3"
  RECOVERY_THRESHOLD: "2"
  ISSUE_LABELS: "incident,automated,production"
  ISSUE_TITLE_PREFIX: "[prod-health-check] Production probe failure"
  # Global fallback target URL — per-region overrides resolve in
  # the matrix's `Resolve target` step.
  GLOBAL_BASE_URL: ${{ vars.PROD_BASE_URL || 'https://api.mahjong-autotable.com' }}

jobs:
  probe:
    name: Probe ${{ matrix.region }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        region:
          - us-east-1
          - us-west-2
          - eu-west-1
          - ap-southeast-1
    steps:
      - name: Resolve target for ${{ matrix.region }}
        id: target
        env:
          REGION: ${{ matrix.region }}
          PROD_US_EAST_1: ${{ vars.PROD_BASE_URL_US_EAST_1 }}
          PROD_US_WEST_2: ${{ vars.PROD_BASE_URL_US_WEST_2 }}
          PROD_EU_WEST_1: ${{ vars.PROD_BASE_URL_EU_WEST_1 }}
          PROD_AP_SOUTHEAST_1: ${{ vars.PROD_BASE_URL_AP_SOUTHEAST_1 }}
        run: |
          set -euo pipefail
          case "$REGION" in
            us-east-1)      regional="${PROD_US_EAST_1:-}" ;;
            us-west-2)      regional="${PROD_US_WEST_2:-}" ;;
            eu-west-1)      regional="${PROD_EU_WEST_1:-}" ;;
            ap-southeast-1) regional="${PROD_AP_SOUTHEAST_1:-}" ;;
            *)              regional="" ;;
          esac
          target="${regional:-$GLOBAL_BASE_URL}"
          echo "region=$REGION"
          echo "target=$target"
          echo "Runner geo: $(curl -sS https://ipinfo.io/region || echo unknown)"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Filter — skip when region not in dispatch set
        id: filter
        env:
          REGIONS_INPUT: ${{ github.event.inputs.regions || 'us-east-1,us-west-2,eu-west-1,ap-southeast-1' }}
          REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          if echo ",${REGIONS_INPUT}," | grep -q ",${REGION},"; then
            echo "include=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::skipping region ${REGION} (not in dispatch set)"
            echo "include=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe endpoints for ${{ matrix.region }}
        if: steps.filter.outputs.include == 'true'
        id: run-probe
        env:
          BASE: ${{ steps.target.outputs.target }}
          REGION: ${{ matrix.region }}
        run: |
          set -uo pipefail
          report_file="report-${REGION}.md"
          : > "$report_file"
          overall=0

          probe() {
            local label="$1" path="$2" assertion="$3"
            local url="${BASE%/}${path}"
            local start_ns end_ns latency_ms status body_size
            start_ns=$(date +%s%N)
            body=$(curl -sS -o body.out -w '%{http_code} %{size_download}' --max-time 10 "$url" 2>err.out || echo "000 0")
            end_ns=$(date +%s%N)
            latency_ms=$(( (end_ns - start_ns) / 1000000 ))
            status="${body%% *}"
            body_size="${body##* }"

            local ok=1 detail=""
            case "$assertion" in
              healthz)
                [ "$status" = "200" ] || ok=0
                grep -q '"status":"ok"' body.out || ok=0
                detail="status=${status}; body=$(head -c 200 body.out | tr -d '\n')"
                ;;
              readyz)
                [ "$status" = "200" ] || ok=0
                [ "$latency_ms" -le "$READYZ_BUDGET_MS" ] || ok=0
                detail="status=${status}; latency_ms=${latency_ms}; budget_ms=${READYZ_BUDGET_MS}"
                ;;
              metrics)
                [ "$status" = "200" ] || ok=0
                [ "${body_size:-0}" -gt 1024 ] || ok=0
                detail="status=${status}; body_size=${body_size}"
                ;;
              jwks)
                [ "$status" = "200" ] || ok=0
                if [ "$ok" = "1" ]; then
                  key_count=$(jq '.keys | length' body.out 2>/dev/null || echo 0)
                  [ "${key_count:-0}" -ge 3 ] || ok=0
                  detail="status=${status}; key_count=${key_count}"
                else
                  detail="status=${status}"
                fi
                ;;
            esac

            if [ "$ok" = "1" ]; then
              echo "- ✅ \`${label}\` (${path}) — ${detail}" >> "$report_file"
            else
              echo "- ❌ \`${label}\` (${path}) — ${detail}" >> "$report_file"
              overall=1
            fi
            rm -f body.out err.out
          }

          probe "healthz" "/healthz" "healthz"
          probe "readyz"  "/readyz"  "readyz"
          probe "metrics" "/metrics" "metrics"
          probe "jwks"    "/.well-known/jwks.json" "jwks"

          {
            echo "### ${REGION}"
            echo
            echo "- Target: \`${BASE}\`"
            echo "- Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            cat "$report_file"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$overall" = "0" ]; then
            verdict=pass
          else
            verdict=fail
          fi

          # Persist verdict + report as JSON for the aggregator
          # job. Single-file artefact per region.
          jq -nc \
              --arg region "$REGION" \
              --arg verdict "$verdict" \
              --arg target "$BASE" \
              --rawfile report "$report_file" \
              '{region: $region, verdict: $verdict, target: $target, report: $report}' \
              > "verdict-${REGION}.json"

      - name: Upload per-region verdict artefact
        if: steps.filter.outputs.include == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: verdict-${{ matrix.region }}
          path: verdict-${{ matrix.region }}.json
          retention-days: 7
          if-no-files-found: error

  cooldown-and-page:
    name: Aggregate verdicts + per-region cooldown
    runs-on: ubuntu-latest
    needs: probe
    timeout-minutes: 5
    if: always()
    steps:
      - name: Download all per-region verdict artefacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: verdict-*
          path: verdicts
          merge-multiple: true

      - name: List verdict files
        id: list
        run: |
          set -euo pipefail
          files=$(ls -1 verdicts/ 2>/dev/null | wc -l)
          echo "Found ${files} verdict files:"
          ls -la verdicts/ || true
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - name: Apply per-region cooldown logic
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          RESET_FLAG: ${{ github.event.inputs.reset_strike_counter && 'true' || 'false' }}
          STRIKE_THRESHOLD: ${{ env.STRIKE_THRESHOLD }}
          RECOVERY_THRESHOLD: ${{ env.RECOVERY_THRESHOLD }}
          ISSUE_LABELS: ${{ env.ISSUE_LABELS }}
          ISSUE_TITLE_PREFIX: ${{ env.ISSUE_TITLE_PREFIX }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const strikeThreshold = parseInt(process.env.STRIKE_THRESHOLD || '3', 10);
            const recoveryThreshold = parseInt(process.env.RECOVERY_THRESHOLD || '2', 10);
            const titlePrefix = process.env.ISSUE_TITLE_PREFIX;
            const labels = (process.env.ISSUE_LABELS || '')
              .split(',').map(s => s.trim()).filter(Boolean);
            const reset = process.env.RESET_FLAG === 'true';

            // Load every per-region verdict JSON.
            const dir = 'verdicts';
            const regions = [];
            if (fs.existsSync(dir)) {
              for (const f of fs.readdirSync(dir)) {
                if (!f.endsWith('.json')) continue;
                try {
                  const j = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
                  regions.push(j);
                } catch (e) {
                  core.warning(`failed to parse ${f}: ${e.message}`);
                }
              }
            }
            regions.sort((a, b) => a.region.localeCompare(b.region));

            if (regions.length === 0) {
              core.notice('no verdict files — probe matrix produced no artefacts (likely all skipped)');
              return;
            }

            // Find any open incident issue from this workflow.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident,automated,production',
              per_page: 50,
            });
            const existing = open.find(i => i.title.startsWith(titlePrefix));

            // Per-region state-marker regex —
            //   <!-- prod-health-check:state region=us-east-1 strikes=N recoveries=M -->
            const stateRe = /<!--\s*prod-health-check:state\s+region=([a-z0-9-]+)\s+strikes=(\d+)\s+recoveries=(\d+)\s*-->/g;

            const previousState = {};
            if (existing) {
              const body = existing.body || '';
              let m;
              while ((m = stateRe.exec(body)) !== null) {
                previousState[m[1]] = {
                  strikes: parseInt(m[2], 10),
                  recoveries: parseInt(m[3], 10),
                };
              }
            }

            // Apply this run's deltas to each region's state.
            const newState = {};
            for (const r of regions) {
              const prev = previousState[r.region] || { strikes: 0, recoveries: 0 };
              let strikes = prev.strikes;
              let recoveries = prev.recoveries;
              if (reset) {
                strikes = 0; recoveries = 0;
              } else if (r.verdict === 'fail') {
                strikes += 1;
                recoveries = 0;
              } else {
                recoveries += 1;
                // strikes intentionally NOT decremented on partial
                // recovery — keeps the worst-of-window count.
              }
              newState[r.region] = { strikes, recoveries, verdict: r.verdict };
            }

            // Aggregate verdict.
            const anyAtThreshold = Object.entries(newState)
              .some(([, s]) => s.strikes >= strikeThreshold);
            const anyStillFailing = Object.entries(newState)
              .some(([, s]) => s.verdict === 'fail');
            const allRecovered = Object.entries(newState)
              .every(([, s]) => s.verdict === 'pass' && s.recoveries >= recoveryThreshold);

            // Emit verdicts.
            for (const r of regions) {
              const s = newState[r.region];
              if (r.verdict === 'fail') {
                core.warning(`[${r.region}] FAIL (strike ${s.strikes}/${strikeThreshold})`);
              } else {
                core.notice(`[${r.region}] PASS (recoveries ${s.recoveries}/${recoveryThreshold})`);
              }
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const nowIso = new Date().toISOString();

            function renderStateMarkers() {
              return regions.map(r => {
                const s = newState[r.region];
                return `<!-- prod-health-check:state region=${r.region} strikes=${s.strikes} recoveries=${s.recoveries} -->`;
              }).join('\n');
            }

            function renderRegionTable() {
              const lines = [
                '| Region | Verdict | Strikes | Recoveries |',
                '|--------|---------|---------|------------|',
              ];
              for (const r of regions) {
                const s = newState[r.region];
                const v = r.verdict === 'pass' ? '✅' : '❌';
                lines.push(`| \`${r.region}\` | ${v} | ${s.strikes}/${strikeThreshold} | ${s.recoveries}/${recoveryThreshold} |`);
              }
              return lines.join('\n');
            }

            function renderRegionReports() {
              return regions.map(r => {
                const s = newState[r.region];
                const v = r.verdict === 'pass' ? '✅ PASS' : '❌ FAIL';
                return [
                  `#### ${r.region} — ${v} (strike ${s.strikes}/${strikeThreshold}, recoveries ${s.recoveries}/${recoveryThreshold})`,
                  ``,
                  `- Target: \`${r.target}\``,
                  ``,
                  r.report.trim(),
                  ``,
                ].join('\n');
              }).join('\n');
            }

            // CASE 1 — no incident open + a region tripped the threshold.
            if (!existing && anyAtThreshold) {
              const title = `${titlePrefix} — ${nowIso.slice(0, 10)}`;
              const body = [
                `## ⚠️ Sustained probe failure (multi-region)`,
                ``,
                `- First detected: ${nowIso}`,
                `- Latest run: ${runUrl}`,
                ``,
                `### Region status`,
                ``,
                renderRegionTable(),
                ``,
                `### Latest probe report`,
                ``,
                renderRegionReports(),
                ``,
                `### First-response steps`,
                ``,
                `1. Verify GitHub Actions is healthy: <https://www.githubstatus.com/>`,
                `2. Check the Sentry dashboard for correlated 5xx errors.`,
                `3. Open the [incident response runbook §7](../docs/production-deployment-runbook.md#7-incident-response-runbook).`,
                `4. Multi-region triage — see [\`docs/edge-region-probes.md\`](../docs/edge-region-probes.md) for the W11 per-region failure-mode playbook.`,
                ``,
                renderStateMarkers(),
              ].join('\n');
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
              core.setFailed(`opened incident issue #${created.data.number} — at least one region at strike threshold`);
              return;
            }

            // CASE 2 — incident already open + at least one region still failing.
            if (existing && anyStillFailing) {
              const body = (existing.body || '').replace(stateRe, '').trimEnd();
              const appended = [
                body,
                ``,
                `---`,
                ``,
                `### Probe update — ${nowIso}`,
                ``,
                renderRegionTable(),
                ``,
                renderRegionReports(),
                ``,
                `- Run: ${runUrl}`,
                ``,
                renderStateMarkers(),
              ].join('\n');
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: appended,
              });
              core.setFailed(`updated incident issue #${existing.number} — at least one region still failing`);
              return;
            }

            // CASE 3 — incident open AND every region recovered.
            if (existing && allRecovered) {
              const body = (existing.body || '').replace(stateRe, '').trimEnd();
              const appended = [
                body,
                ``,
                `---`,
                ``,
                `### Recovery — ${nowIso}`,
                ``,
                renderRegionTable(),
                ``,
                `- All regions clean for ≥ ${recoveryThreshold} consecutive runs.`,
                `- Last clean run: ${runUrl}`,
                ``,
                renderStateMarkers(),
              ].join('\n');
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: appended,
                state: 'closed',
                state_reason: 'completed',
              });
              core.notice(`closed incident issue #${existing.number} (all regions recovered)`);
              return;
            }

            // CASE 4 — incident open + some regions recovered, some still pending recovery threshold.
            if (existing) {
              const body = (existing.body || '').replace(stateRe, '').trimEnd();
              const appended = [
                body,
                ``,
                `---`,
                ``,
                `### Partial recovery — ${nowIso}`,
                ``,
                renderRegionTable(),
                ``,
                `- Recovery in progress — closure requires every region at ≥ ${recoveryThreshold} recoveries.`,
                `- Run: ${runUrl}`,
                ``,
                renderStateMarkers(),
              ].join('\n');
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: appended,
              });
              core.notice(`partial recovery — issue #${existing.number} kept open`);
              return;
            }

            // CASE 5 — no incident open, no region at threshold, nothing to do.
            core.notice('no incident state change (no region at strike threshold, no open incident)');

      - name: Post Slack notification (on incident open)
        if: needs.probe.result == 'failure' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{text: ("⚠️ prod-health-check FAIL — multi-region — run " + $url)}')
          curl -sS -X POST -H 'content-type: application/json' \
            --max-time 10 \
            -d "$payload" \
            "${SLACK_WEBHOOK_URL}" \
            || echo "::warning::slack webhook delivery failed (best-effort)"
