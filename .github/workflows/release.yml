# Phase J Wave 8 (Apone, DevOps) — production release workflow.
#
# Fires on version tag push (`v*.*.*`). Builds + smoke-tests the
# production Docker image, then creates a GitHub Release with the
# CHANGELOG.md excerpt for the matching version + auto-generated PR
# notes since the previous tag.
#
# This file is INTENTIONALLY separate from docker-build.yml so the
# image build remains shared between `main` pushes and tag pushes,
# while the release-only side effects (release notes, smoke test,
# manifest extras) only fire on tags. docker-build.yml already
# publishes the `<tag-name>` image; this workflow waits for that
# image to exist, then attaches the release notes around it.

name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: long2know/mahjong-autotable

jobs:
  smoke:
    name: Smoke test the tagged image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for image
        # docker-build.yml is triggered by the same tag push, so the
        # image may not exist yet when this workflow starts. Poll for
        # ~6 min before giving up.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          for i in $(seq 1 36); do
            if docker manifest inspect "$REGISTRY/$IMAGE_NAME:$TAG" >/dev/null 2>&1; then
              echo "image $REGISTRY/$IMAGE_NAME:$TAG is available"
              exit 0
            fi
            echo "[$i/36] image not yet published; sleeping 10s"
            sleep 10
          done
          echo "::error::image $REGISTRY/$IMAGE_NAME:$TAG never appeared on the registry" >&2
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        env:
          TAG: ${{ github.ref_name }}
        run: docker pull "$REGISTRY/$IMAGE_NAME:$TAG"

      - name: Run smoke test
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          chmod +x tests/smoke/docker-build-smoke.sh
          IMAGE="$REGISTRY/$IMAGE_NAME:$TAG" \
            tests/smoke/docker-build-smoke.sh

      - name: Run auth-flow smoke test
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          chmod +x tests/smoke/auth-flow-smoke.sh
          IMAGE="$REGISTRY/$IMAGE_NAME:$TAG" \
            tests/smoke/auth-flow-smoke.sh

  release:
    name: Create GitHub release
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract CHANGELOG section
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Pull out the section between this version's heading and
          # the next version's heading. If CHANGELOG.md doesn't carry
          # an entry for this tag, we still proceed and let
          # --generate-notes fill in the body.
          set -e
          version="${TAG#v}"
          file=CHANGELOG.md
          if [[ ! -f "$file" ]]; then
            echo "no CHANGELOG.md present — falling back to gh --generate-notes"
            echo "section=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Match "## [<version>]" or "## <version>"
          section=$(awk -v ver="$version" '
            $0 ~ "^## (\\[)?" ver "([] ]|$)" { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' "$file")
          if [[ -z "$section" ]]; then
            echo "no CHANGELOG section for $version — falling back to gh --generate-notes"
            echo "section=" >> "$GITHUB_OUTPUT"
          else
            echo "section<<EOF" >> "$GITHUB_OUTPUT"
            echo "$section" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.changelog.outputs.section }}
        run: |
          set -e
          flags=(--title "$TAG" --verify-tag)
          if [[ -n "$NOTES" ]]; then
            printf '%s\n\n---\n\n' "$NOTES" > .release-notes.md
            flags+=(--notes-file .release-notes.md)
          else
            flags+=(--generate-notes)
          fi
          gh release create "$TAG" "${flags[@]}"

      - name: Summary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### Released $TAG"
            echo
            echo "- Image: \`$REGISTRY/$IMAGE_NAME:$TAG\`"
            echo "- Smoke test: passed"
            echo "- Release page: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
