# Phase J Wave 8 (Apone, DevOps) — production release workflow.
#
# Fires on version tag push (`v*.*.*`). Builds + smoke-tests the
# production Docker image, then creates a GitHub Release with the
# CHANGELOG.md excerpt for the matching version + auto-generated PR
# notes since the previous tag.
#
# This file is INTENTIONALLY separate from docker-build.yml so the
# image build remains shared between `main` pushes and tag pushes,
# while the release-only side effects (release notes, smoke test,
# manifest extras) only fire on tags. docker-build.yml already
# publishes the `<tag-name>` image; this workflow waits for that
# image to exist, then attaches the release notes around it.

name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: long2know/mahjong-autotable

jobs:
  smoke:
    name: Smoke test the tagged image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image-digest: ${{ steps.resolve-digest.outputs.image-digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for image
        # docker-build.yml is triggered by the same tag push, so the
        # image may not exist yet when this workflow starts. Poll for
        # ~6 min before giving up.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          for i in $(seq 1 36); do
            if docker manifest inspect "$REGISTRY/$IMAGE_NAME:$TAG" >/dev/null 2>&1; then
              echo "image $REGISTRY/$IMAGE_NAME:$TAG is available"
              exit 0
            fi
            echo "[$i/36] image not yet published; sleeping 10s"
            sleep 10
          done
          echo "::error::image $REGISTRY/$IMAGE_NAME:$TAG never appeared on the registry" >&2
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        env:
          TAG: ${{ github.ref_name }}
        run: docker pull "$REGISTRY/$IMAGE_NAME:$TAG"

      - name: Run smoke test
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          chmod +x tests/smoke/docker-build-smoke.sh
          IMAGE="$REGISTRY/$IMAGE_NAME:$TAG" \
            tests/smoke/docker-build-smoke.sh

      - name: Run auth-flow smoke test
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          chmod +x tests/smoke/auth-flow-smoke.sh
          IMAGE="$REGISTRY/$IMAGE_NAME:$TAG" \
            tests/smoke/auth-flow-smoke.sh

      - name: Resolve manifest-list digest
        id: resolve-digest
        # Phase K Wave 2 — Apone. Surfaces the per-architecture
        # manifest-list digest so the downstream `verify-signature`
        # reusable workflow can cosign-verify the exact bits we just
        # smoke-tested. `imagetools inspect` resolves the digest
        # without re-pulling the layers.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect \
            --format '{{.Manifest.Digest}}' \
            "$REGISTRY/$IMAGE_NAME:$TAG")
          if ! echo "$digest" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::could not resolve digest for $REGISTRY/$IMAGE_NAME:$TAG (got '$digest')"
            exit 1
          fi
          echo "image-digest=$REGISTRY/$IMAGE_NAME@$digest" >> "$GITHUB_OUTPUT"
          echo "Resolved digest: $REGISTRY/$IMAGE_NAME@$digest"

  verify-signature:
    # Phase K Wave 2 — Apone. Reusable cosign verify gate.
    # The release is NOT published unless the image we smoke-tested
    # was signed by THIS repo's sign-image.yml workflow on `main`
    # or a `v*.*.*` tag. Calls the reusable workflow rather than
    # inlining `cosign verify` so the expected-identity regex +
    # cosign version stay in lock-step across all consumers.
    needs: smoke
    uses: ./.github/workflows/verify-signature.yml
    with:
      image-digest: ${{ needs.smoke.outputs.image-digest }}
    permissions:
      contents: read
      packages: read

  verify-sbom:
    # Phase K Wave 3 — Apone (DevOps).
    #
    # SBOM signed-by-cosign pre-publish gate. Wave 1 shipped
    # `sbom.yml` (CycloneDX + SPDX SBOM generation against the local
    # build) and Wave 3 closes the chain: the release is NOT cut
    # unless an SPDX SBOM for the EXACT image digest exists AND its
    # cosign keyless signature verifies against the same canonical
    # signer identity (`sign-image.yml`@main|v*) that signed the
    # image manifest itself.
    #
    # Why generate-sign-verify here vs reading sbom.yml's artefact?
    # Cross-workflow artefact passing is brittle in GitHub Actions
    # (artefacts are per-run; resolving the right run id at tag-push
    # time requires extra plumbing). Generating from the tagged
    # image, signing keyless, and verifying in the same job binds
    # the SBOM cryptographically to the release tag — exactly what
    # supply-chain auditors want to see in the Rekor entry.
    needs: [smoke, verify-signature]
    name: SBOM signed + verified (cosign blob)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      # Required for cosign keyless: lets sign-blob mint an OIDC
      # token that Fulcio swaps for a short-lived signing cert.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          # Keep in lock-step with sign-image.yml + verify-signature.yml.
          cosign-release: v2.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SPDX SBOM from the published image
        uses: anchore/sbom-action@v0
        with:
          # Pin to the digest-qualified reference so the SBOM
          # describes the bits we just smoke-tested + signature-
          # verified (NOT a tag that could be re-pushed).
          image: ${{ needs.smoke.outputs.image-digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-artifact-retention: 90

      - name: Cosign sign SBOM (keyless OIDC)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          if [[ ! -s sbom.spdx.json ]]; then
            echo "::error::sbom.spdx.json missing or empty — cannot sign"
            exit 1
          fi
          # `cosign sign-blob` writes the detached signature to
          # `--output-signature`; certificate to `--output-certificate`.
          # Both are needed for the verify-blob step + audit attachment.
          cosign sign-blob \
            --yes \
            --output-signature sbom.spdx.json.sig \
            --output-certificate sbom.spdx.json.pem \
            sbom.spdx.json
          test -s sbom.spdx.json.sig
          test -s sbom.spdx.json.pem
          echo "✅ SBOM signed; signature → sbom.spdx.json.sig"

      - name: Cosign verify-blob (gate)
        env:
          EXPECTED_IDENTITY_REGEXP: ^https://github\.com/long2know/mahjong-autotable/\.github/workflows/release\.yml@refs/tags/v.*$
          EXPECTED_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          # Verify-blob exits non-zero on any of: missing/empty sig,
          # cert-identity mismatch, issuer mismatch, Rekor entry
          # mismatch, blob hash mismatch. Block release on ANY of
          # those — the whole point of this gate.
          cosign verify-blob \
            --signature sbom.spdx.json.sig \
            --certificate sbom.spdx.json.pem \
            --certificate-identity-regexp "$EXPECTED_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$EXPECTED_OIDC_ISSUER" \
            sbom.spdx.json
          echo "✅ SBOM signature verified — release may proceed"

      - name: Upload signed SBOM artefact bundle
        uses: actions/upload-artifact@v4
        with:
          name: sbom-signed-${{ github.ref_name }}
          path: |
            sbom.spdx.json
            sbom.spdx.json.sig
            sbom.spdx.json.pem
          if-no-files-found: error
          retention-days: 90

      - name: Step Summary
        if: always()
        run: |
          {
            echo "### SBOM signed + verified (Phase K Wave 3)"
            echo
            echo "- Image: \`${{ needs.smoke.outputs.image-digest }}\`"
            echo "- SBOM:      \`sbom.spdx.json\`"
            echo "- Signature: \`sbom.spdx.json.sig\`"
            echo "- Cert:      \`sbom.spdx.json.pem\`"
            echo "- Verifier:  \`cosign verify-blob --certificate-identity-regexp \"…/release.yml@refs/tags/v*\"\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub release
    needs: [smoke, verify-signature, verify-sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-signed-${{ github.ref_name }}
          path: sbom

      - name: Extract CHANGELOG section
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Pull out the section between this version's heading and
          # the next version's heading. If CHANGELOG.md doesn't carry
          # an entry for this tag, we still proceed and let
          # --generate-notes fill in the body.
          set -e
          version="${TAG#v}"
          file=CHANGELOG.md
          if [[ ! -f "$file" ]]; then
            echo "no CHANGELOG.md present — falling back to gh --generate-notes"
            echo "section=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Match "## [<version>]" or "## <version>"
          section=$(awk -v ver="$version" '
            $0 ~ "^## (\\[)?" ver "([] ]|$)" { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' "$file")
          if [[ -z "$section" ]]; then
            echo "no CHANGELOG section for $version — falling back to gh --generate-notes"
            echo "section=" >> "$GITHUB_OUTPUT"
          else
            echo "section<<EOF" >> "$GITHUB_OUTPUT"
            echo "$section" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.changelog.outputs.section }}
        run: |
          set -e
          flags=(--title "$TAG" --verify-tag)
          if [[ -n "$NOTES" ]]; then
            printf '%s\n\n---\n\n' "$NOTES" > .release-notes.md
            flags+=(--notes-file .release-notes.md)
          else
            flags+=(--generate-notes)
          fi
          # Phase K Wave 3 — Apone. Attach the signed SBOM bundle
          # (sbom.spdx.json + .sig + .pem) to the GitHub Release so
          # downstream auditors can pull the artefacts directly from
          # the release page without re-running the workflow.
          gh release create "$TAG" "${flags[@]}" \
            sbom/sbom.spdx.json \
            sbom/sbom.spdx.json.sig \
            sbom/sbom.spdx.json.pem

      - name: Summary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### Released $TAG"
            echo
            echo "- Image: \`$REGISTRY/$IMAGE_NAME:$TAG\`"
            echo "- Smoke test: passed"
            echo "- Cosign image signature: verified"
            echo "- Cosign SBOM signature: verified"
            echo "- Release page: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
