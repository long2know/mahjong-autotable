# Phase K Wave 22 — Apone (DevOps).
#
# us-east-1 ACTUAL APPLY — auto-rollback dry-run trigger.
#
# W21 landed the opt-in auto-rollback safety net in
# `infra/terraform/regional-eks/us-east-1/auto-rollback.tf`
# (terraform null_resource provisioner that fires the W20 V2
# 8-invariant smoke-test post-apply + triggers `terraform
# destroy -auto-approve` on failure within a 5-minute window).
#
# W22 wires the safety net into a CI smoke job. Three trigger
# modes:
#
#   1. `workflow_dispatch` — operator-initiated. Default mode
#      sets `auto_rollback_dry_run=true` (LOG-only rollback);
#      explicit opt-in flips to actual destroy on smoke
#      failure.
#   2. `schedule` (weekly, Sunday 02:00 UTC) — DRY-RUN ONLY.
#      Validates that the smoke test + auto-rollback null_
#      resource still wire correctly week-over-week. Catches
#      drift in the terraform module / smoke-test script
#      shape that would otherwise only surface at the next
#      manual apply.
#   3. `pull_request` (paths-filtered to the auto-rollback.tf
#      file + the smoke test script) — DRY-RUN ONLY. Catches
#      lint / shape regressions on PR before they merge.
#
# # The CI pipeline shape
#
#   * `validate` — runs `terraform validate` + `terraform fmt
#     -check` on the regional-eks/us-east-1 workspace. Cheap;
#     runs on every trigger.
#   * `dry-run-plan` — runs `terraform plan -var enable_auto_
#     rollback=true -var auto_rollback_dry_run=true` against
#     the workspace and captures the plan to an artefact.
#     Does NOT apply. The plan output documents the expected
#     null_resource behaviour for the next manual apply.
#   * `smoke-shape-check` — runs `bash -n` syntax-check on the
#     smoke-test script (statically validates the W20 V2
#     8-invariant flow doesn't drift). Cheap.
#   * `auto-rollback-trigger` — the actual trigger step. Only
#     runs on `workflow_dispatch` with the
#     `actually_rollback_on_failure` input set to `true`.
#     This is the ACTUAL-APPLY path; defaults to DRY-RUN
#     when the input is omitted.
#
# # SAFETY — three opt-in dials
#
#   1. `workflow_dispatch` only — schedule + pull_request
#      paths default to DRY-RUN.
#   2. `actually_rollback_on_failure` input gates the
#      `auto_rollback_dry_run=false` flip. Default is `false`
#      (= DRY-RUN).
#   3. Cluster ENABLE flag MUST be wired in tfvars BEFORE
#      the CI job is invoked. The workflow does NOT modify
#      tfvars; it only reads the workspace state.
#
# Documented opt-in path: `docs/us-east-1-auto-rollback-
# runbook.md §3`.
#
# # Why a SEPARATE workflow (not extended release.yml)
#
#   * Cadence — release.yml runs per-tag; this is weekly.
#   * Trigger semantics — release.yml is build-artefact
#     focused; this is infrastructure-apply focused.
#   * Failure semantics — release.yml red blocks releases;
#     this red opens a triage issue but does not block
#     anything immediate (the safety net is opt-in by
#     default).
#
# # Cross-references
#
#   * `infra/terraform/regional-eks/us-east-1/auto-rollback.tf`
#     — the W21 null_resource provisioner this workflow
#     drives.
#   * `infra/terraform/regional-eks/us-east-1/post-apply-
#     smoke-test.sh` — the W20 V2 8-invariant smoke.
#   * `docs/us-east-1-auto-rollback-runbook.md` — the W22
#     operator runbook.
#   * `docs/us-east-1-apply-runbook.md` — the W19/W20/W21
#     apply runbook.

name: us-east-1-auto-rollback

on:
  workflow_dispatch:
    inputs:
      actually_rollback_on_failure:
        description: >-
          Set to "true" to flip auto_rollback_dry_run=false
          (ACTUAL destroy on smoke failure). Default is
          DRY-RUN (LOG-only rollback). See
          docs/us-east-1-auto-rollback-runbook.md §3 for
          the prod opt-in procedure.
        required: false
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
      smoke_timeout_seconds:
        description: >-
          Smoke-test timeout in seconds. Default 300s (5min)
          matches the W21 auto-rollback.tf design point.
        required: false
        default: '300'
        type: string
  schedule:
    # Sunday 02:00 UTC — DRY-RUN ONLY. Catches drift in the
    # terraform module / smoke script week-over-week. The
    # schedule trigger CANNOT flip actually_rollback_on_
    # failure; it always runs in dry-run mode.
    - cron: '0 2 * * 0'
  pull_request:
    paths:
      - 'infra/terraform/regional-eks/us-east-1/auto-rollback.tf'
      - 'infra/terraform/regional-eks/us-east-1/post-apply-smoke-test.sh'
      - '.github/workflows/us-east-1-auto-rollback.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Serialize all us-east-1 auto-rollback runs — they
  # touch the same terraform workspace.
  group: us-east-1-auto-rollback
  cancel-in-progress: false

jobs:
  validate:
    name: Validate terraform + smoke script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.5.7'
          terraform_wrapper: false

      - name: terraform fmt -check
        working-directory: infra/terraform/regional-eks/us-east-1
        run: terraform fmt -check -diff

      - name: terraform init (backend disabled — validate only)
        working-directory: infra/terraform/regional-eks/us-east-1
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: infra/terraform/regional-eks/us-east-1
        run: terraform validate

      - name: bash -n smoke-test script
        run: bash -n infra/terraform/regional-eks/us-east-1/post-apply-smoke-test.sh

  dry-run-plan:
    name: Dry-run plan (auto-rollback wired, no apply)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.5.7'
          terraform_wrapper: false

      - name: terraform init (backend disabled — plan only)
        working-directory: infra/terraform/regional-eks/us-east-1
        run: terraform init -backend=false

      - name: Determine dry-run / actual-rollback mode
        id: mode
        run: |
          set -euo pipefail
          # workflow_dispatch with explicit opt-in is the
          # ONLY path that flips dry-run off. Schedule +
          # pull_request are ALWAYS dry-run.
          ACTUAL='false'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.actually_rollback_on_failure }}" = "true" ]; then
            ACTUAL='true'
          fi
          DRY='true'
          if [ "$ACTUAL" = "true" ]; then
            DRY='false'
          fi
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"
          echo "actual=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "::notice::auto_rollback_dry_run=$DRY (actually_rollback_on_failure=$ACTUAL)"

      - name: terraform plan (auto-rollback null_resource)
        id: plan
        working-directory: infra/terraform/regional-eks/us-east-1
        run: |
          set -euo pipefail
          # Plan ONLY the auto-rollback resource — keeps the
          # blast radius narrow. Operators apply via the
          # standard apply runbook; this CI job's job is to
          # confirm the null_resource shape is consistent
          # week-over-week.
          terraform plan \
            -var "enable_auto_rollback=true" \
            -var "auto_rollback_dry_run=${{ steps.mode.outputs.dry_run }}" \
            -var "auto_rollback_smoke_timeout_seconds=${{ inputs.smoke_timeout_seconds || '300' }}" \
            -target='null_resource.us_east_1_auto_rollback' \
            -no-color \
            -out=auto-rollback.tfplan \
            2>&1 | tee plan.out
          terraform show -no-color auto-rollback.tfplan > plan.txt

      - name: Upload plan artefact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: us-east-1-auto-rollback-plan-${{ github.run_id }}
          path: |
            infra/terraform/regional-eks/us-east-1/plan.txt
            infra/terraform/regional-eks/us-east-1/plan.out
          if-no-files-found: warn
          retention-days: 30

      - name: Post plan summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            let plan = '';
            try {
              plan = fs.readFileSync(
                'infra/terraform/regional-eks/us-east-1/plan.txt',
                'utf8'
              );
            } catch (_) {
              plan = '_(plan output unavailable)_';
            }
            const summary = plan.length > 8000
              ? plan.slice(0, 8000) + '\n... (truncated — see workflow artefact)'
              : plan;
            const body = '### us-east-1 auto-rollback dry-run plan\n\n' +
                         '* `enable_auto_rollback=true`\n' +
                         '* `auto_rollback_dry_run=true` (PR runs are DRY-RUN only)\n\n' +
                         '<details><summary>terraform plan output</summary>\n\n' +
                         '```hcl\n' + summary + '\n```\n</details>';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  auto-rollback-trigger:
    name: Auto-rollback smoke trigger (post-apply window)
    needs: dry-run-plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run smoke-test syntactic / structural validation
        run: |
          set -euo pipefail
          bash -n infra/terraform/regional-eks/us-east-1/post-apply-smoke-test.sh
          # Document the 5-minute window contract by
          # logging the timeout the auto-rollback.tf
          # null_resource will enforce on a real apply.
          echo "::notice::Smoke timeout window: ${{ inputs.smoke_timeout_seconds || '300' }}s (5min @ default)"
          echo "::notice::actually_rollback_on_failure: ${{ inputs.actually_rollback_on_failure }}"
          # The trigger job's purpose is to land the
          # OPERATOR CONTRACT — the CI job itself does
          # NOT invoke the smoke test against a real
          # cluster (no kubectl context in CI). The real
          # invocation runs as the null_resource
          # provisioner during a `terraform apply`.
          echo "==== W22 auto-rollback trigger ===="
          echo "This job validates the trigger contract. The"
          echo "actual auto-rollback fires from the null_resource"
          echo "provisioner in auto-rollback.tf at terraform apply"
          echo "time. See docs/us-east-1-auto-rollback-runbook.md"
          echo "for the operator runbook."

      - name: Summary
        if: always()
        run: |
          echo "==== us-east-1 auto-rollback W22 trigger summary ===="
          echo "actually_rollback_on_failure = ${{ inputs.actually_rollback_on_failure }}"
          echo "smoke_timeout_seconds        = ${{ inputs.smoke_timeout_seconds || '300' }}"
          DRY='true'
          if [ "${{ inputs.actually_rollback_on_failure }}" = "true" ]; then
            DRY='false'
          fi
          echo "auto_rollback_dry_run        = ${DRY}"
