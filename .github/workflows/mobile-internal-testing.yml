# Phase K Wave 6 — Apone (DevOps).
#
# Mobile internal-testing promotion — on `mobile-v*.*.*` tags only.
#
# Pairs with `.github/workflows/mobile-build.yml` (the W2 build):
#   * mobile-build.yml runs on every PR + main push — produces
#     UNSIGNED artefacts for CI verification.
#   * THIS workflow runs only on `mobile-v*.*.*` tags — produces
#     SIGNED .ipa + .aab and uploads to TestFlight + Play Internal
#     Testing.
#
# Code-signing identities live in repository secrets (operator-
# managed):
#
#   * iOS  (TestFlight)
#       APPLE_API_KEY_ID          — App Store Connect API key ID.
#       APPLE_API_ISSUER_ID       — App Store Connect issuer UUID.
#       APPLE_API_KEY_BASE64      — base64-encoded .p8 private key.
#       IOS_DIST_CERT_BASE64      — base64-encoded distribution .p12.
#       IOS_DIST_CERT_PASSWORD    — .p12 password.
#       IOS_PROVISION_PROFILE_BASE64 — base64-encoded
#                                       `.mobileprovision` file.
#       IOS_KEYCHAIN_PASSWORD     — ephemeral keychain password.
#
#   * Android  (Play Console Internal Testing)
#       ANDROID_KEYSTORE_BASE64   — base64-encoded JKS keystore.
#       ANDROID_KEYSTORE_PASSWORD — keystore password.
#       ANDROID_KEY_ALIAS         — signing-key alias inside keystore.
#       ANDROID_KEY_PASSWORD      — signing-key password.
#       PLAY_SERVICE_ACCOUNT_JSON — base64-encoded service-account
#                                    JSON with `androidpublisher`
#                                    edit role.
#
#   * Slack
#       SLACK_WEBHOOK_URL         — incoming-webhook URL for
#                                    #mobile-releases notifications.
#
# All secrets are guarded by an `if:` check — when absent, the
# matching job logs a warning and SOFT-FAILS so a tag push from a
# fork (which cannot see secrets) doesn't block the workflow.
# Operator-driven tag pushes from `main` always have secrets and
# proceed to upload.
#
# See `docs/mobile-release.md` for the full release flow + initial
# secret setup runbook.

name: mobile-internal-testing

on:
  push:
    tags:
      - "mobile-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the workflow_dispatch ref; rebuilds the artefacts under that tag)."
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: mobile-internal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve tag + version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^mobile-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG does not match mobile-vMAJOR.MINOR.PATCH"
            exit 1
          fi
          VERSION="${TAG#mobile-v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Building mobile release: tag=$TAG version=$VERSION"

  build-web-bundle:
    name: Build web bundle
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/autotable-src/package-lock.json

      - name: npm ci + build
        working-directory: src/frontend/autotable-src
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Upload bundle artefact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: web-bundle-${{ needs.prepare.outputs.version }}
          path: src/frontend/autotable/
          retention-days: 30

  android:
    name: Android (signed .aab → Play Internal)
    needs: [prepare, build-web-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      uploaded: ${{ steps.fastlane.outputs.uploaded }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download web bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: web-bundle-${{ needs.prepare.outputs.version }}
          path: src/frontend/autotable/

      - name: Set up JDK 17
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install fastlane
        run: |
          set -euo pipefail
          gem install fastlane -NV
          fastlane --version

      - name: Install Capacitor + add Android platform
        working-directory: mobile
        run: |
          set -euo pipefail
          npm install
          npx cap add android || echo "android platform may already exist"
          npx cap sync android

      - name: Detect signing secrets
        id: secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          # Soft-fail when secrets are absent — fork PRs cannot
          # access them. Operator-driven tag pushes from main always
          # have them.
          if [[ -z "$KEYSTORE" || -z "$PLAY_SA" ]]; then
            echo "have-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 or PLAY_SERVICE_ACCOUNT_JSON missing — skipping signed build + Play upload"
          else
            echo "have-secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.secrets.outputs.have-secrets == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p mobile/android/keystores
          printf '%s' "$KEYSTORE" | base64 -d > mobile/android/keystores/release.jks
          test -s mobile/android/keystores/release.jks || { echo "keystore decode failed"; exit 1; }

      - name: gradle bundleRelease (SIGNED)
        if: steps.secrets.outputs.have-secrets == 'true'
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=../keystores/release.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -x lint

      - name: fastlane supply → Play Internal Testing
        id: fastlane
        if: steps.secrets.outputs.have-secrets == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Decode the service account JSON to a file (fastlane
          # `supply` reads from a path, not stdin).
          mkdir -p mobile/android/fastlane
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | base64 -d > mobile/android/fastlane/play-sa.json
          chmod 600 mobile/android/fastlane/play-sa.json

          AAB=$(ls mobile/android/app/build/outputs/bundle/release/*.aab | head -n 1)
          test -n "$AAB" || { echo "no .aab produced"; exit 1; }

          # `track internal` = Play Console Internal Testing track.
          # `release_status draft` lets the operator gate the
          # promotion-to-testers click; flip to `completed` to
          # auto-roll-out to internal testers.
          fastlane supply \
            --aab "$AAB" \
            --track internal \
            --release_status draft \
            --json_key mobile/android/fastlane/play-sa.json \
            --package_name com.long2know.mahjong \
            --skip_upload_metadata true \
            --skip_upload_changelogs true \
            --skip_upload_images true \
            --skip_upload_screenshots true
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Upload Android artefact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: android-release-${{ needs.prepare.outputs.version }}
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 90

  ios:
    name: iOS (signed .ipa → TestFlight)
    needs: [prepare, build-web-bundle]
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      uploaded: ${{ steps.fastlane.outputs.uploaded }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download web bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: web-bundle-${{ needs.prepare.outputs.version }}
          path: src/frontend/autotable/

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install fastlane
        run: |
          set -euo pipefail
          gem install fastlane -NV
          fastlane --version

      - name: Install Capacitor + add iOS platform
        working-directory: mobile
        run: |
          set -euo pipefail
          npm install
          npx cap add ios || echo "ios platform may already exist"
          npx cap sync ios

      - name: Detect signing secrets
        id: secrets
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          DIST_CERT: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          PROVISION: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$API_KEY" || -z "$DIST_CERT" || -z "$PROVISION" ]]; then
            echo "have-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_API_KEY_BASE64 / IOS_DIST_CERT_BASE64 / IOS_PROVISION_PROFILE_BASE64 missing — skipping signed build + TestFlight upload"
          else
            echo "have-secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode certs + provisioning profile
        if: steps.secrets.outputs.have-secrets == 'true'
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          DIST_CERT_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PW: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p mobile/ios/secrets
          printf '%s' "$API_KEY_BASE64" | base64 -d > mobile/ios/secrets/api_key.p8
          printf '%s' "$DIST_CERT_BASE64" | base64 -d > mobile/ios/secrets/dist.p12
          printf '%s' "$PROVISION_BASE64" | base64 -d > mobile/ios/secrets/profile.mobileprovision
          chmod 600 mobile/ios/secrets/*

          # Create an ephemeral keychain that lives for the run.
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import mobile/ios/secrets/dist.p12 \
            -k build.keychain \
            -P "$DIST_CERT_PW" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain

          # Install the provisioning profile.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(grep -aoE "UUID</key>[[:space:]]*<string>[^<]+" mobile/ios/secrets/profile.mobileprovision | tail -n 1 | grep -oE "[A-Z0-9-]{36}" | head -n 1)
          cp mobile/ios/secrets/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: fastlane pilot → TestFlight
        id: fastlane
        if: steps.secrets.outputs.have-secrets == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: mobile/ios/App
        run: |
          set -euo pipefail
          # Install pods (Capacitor 6 still uses CocoaPods).
          pod install --repo-update

          # Build + sign + upload via fastlane gym + pilot. gym
          # produces a signed .ipa; pilot uploads to TestFlight via
          # the App Store Connect API.
          fastlane run gym \
            workspace:App.xcworkspace \
            scheme:App \
            configuration:Release \
            export_method:app-store \
            output_directory:build \
            output_name:Mahjong-Autotable.ipa

          fastlane run pilot \
            api_key_path:../../secrets/api_key.p8 \
            api_key_id:"$APPLE_API_KEY_ID" \
            api_issuer:"$APPLE_API_ISSUER_ID" \
            ipa:build/Mahjong-Autotable.ipa \
            skip_waiting_for_build_processing:true \
            skip_submission:true \
            distribute_external:false
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Upload iOS artefact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ios-release-${{ needs.prepare.outputs.version }}
          path: |
            mobile/ios/App/build/Mahjong-Autotable.ipa
          if-no-files-found: warn
          retention-days: 90

  notify:
    name: Slack notification
    needs: [prepare, android, ios]
    if: always() && (needs.android.outputs.uploaded == 'true' || needs.ios.outputs.uploaded == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect Slack webhook
        id: webhook
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SLACK_WEBHOOK_URL not set — skipping notification"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to Slack
        if: steps.webhook.outputs.have == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ANDROID_OK: ${{ needs.android.outputs.uploaded }}
          IOS_OK: ${{ needs.ios.outputs.uploaded }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Compact slack payload. Avoid heredoc + jq nesting for
          # actionlint friendliness.
          PAYLOAD=$(python3 -c "
          import json, os
          msg = {
              'text': f\":iphone: Mahjong mobile {os.environ['TAG']} promoted to internal testing\",
              'blocks': [
                  {'type': 'section', 'text': {'type': 'mrkdwn',
                      'text': f\"*Mahjong-Autotable mobile* {os.environ['VERSION']} — internal-testing promotion\"}},
                  {'type': 'section', 'fields': [
                      {'type': 'mrkdwn', 'text': f\"*Android (Play Internal):* {'✅ uploaded' if os.environ.get('ANDROID_OK')=='true' else '⏭️ skipped'}\"},
                      {'type': 'mrkdwn', 'text': f\"*iOS (TestFlight):* {'✅ uploaded' if os.environ.get('IOS_OK')=='true' else '⏭️ skipped'}\"},
                  ]},
                  {'type': 'context', 'elements': [
                      {'type': 'mrkdwn', 'text': f\"<{os.environ['RUN_URL']}|Workflow run>\"}]}
              ],
          }
          print(json.dumps(msg))
          ")
          curl -fsSL -X POST -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
