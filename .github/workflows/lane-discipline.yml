# Phase K Wave 6 — Vasquez (QA). Extended Wave 7 to PR-blocking.
#
# Lane-discipline check. Runs the cross-lane bundling detector on
# every PR so the W3/W4 git-config-race / Wave-5 stash-discipline
# recurrence is caught at the CI gate, not at squash-merge time.
#
# Hard-fails when a single commit touches MORE than one agent's lane
# OR when an author identity does NOT match the lane it touched.
#
# Wave 7 (Vasquez):
#   - --strict invocation also verifies tests/ci/lane-map.json is
#     present + parseable (the regex map is now the documented truth
#     for per-agent path ownership).
#   - This workflow is REQUIRED-FOR-MERGE on the main branch
#     protection rule. Setting `required-checks: lane-discipline / check`
#     enforces the gate at merge time (configured in repo settings).
#
# Owner: Vasquez (QA). See `docs/agent-handoff-protocol.md`.
#
# ## CI-noise iter2 (Apone, 2027-02-XX) — PR TRIGGER DISABLED
#
# Stephen explicitly killed the wave-mill / per-lane policy in
# playability-first mode. The lane-discipline gate is a wave-machine
# artifact and is no longer applicable to a multi-lane playability
# PR (cf. PR #82 fix/frontend-playability-iter2 spanning bishop +
# hicks lanes legitimately). The PR-trigger is removed; the
# workflow remains available via `workflow_dispatch` for ad-hoc
# audits if/when wave discipline returns. The companion
# `lane-discipline-status (OPTIONAL-FOR-NOW)` workflow is left in
# place as a non-blocking preview. Decision note:
# `.squad/decisions/inbox/apone-ci-noise-iter2.md`.

name: lane-discipline

on:
  # CI-noise iter2 (Apone): pull_request trigger removed —
  # workflow_dispatch ONLY until Stephen reinstates lane discipline.
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Verbose output'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  check:
    name: Cross-lane bundling check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the PR branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so the script can walk PR_REF..BASE_REF.
          fetch-depth: 0

      - name: Determine PR refs
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr_ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "base_ref=origin/${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr_ref=HEAD" >> "$GITHUB_OUTPUT"
            echo "base_ref=origin/main" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify lane-map.json is present and parseable
        run: |
          test -f tests/ci/lane-map.json \
            || (echo "lane-map.json missing — Vasquez QA gate"; exit 1)
          grep -q '"lanes"' tests/ci/lane-map.json \
            || (echo "lane-map.json missing 'lanes' key"; exit 1)
          echo "lane-map.json OK"

      - name: Run lane-discipline check (PR mode, STRICT — gates merge)
        env:
          PR_REF: ${{ steps.refs.outputs.pr_ref }}
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
          VERBOSE: ${{ github.event.inputs.verbose == 'true' && '1' || '0' }}
        run: |
          chmod +x tests/ci/check-cross-lane-bundling.sh
          # --strict implies --pr; explicit --pr/--base preserved for
          # the diff range. The strict flag adds the lane-map.json
          # presence check as a hard gate.
          STRICT=1 tests/ci/check-cross-lane-bundling.sh --pr "$PR_REF" --base "$BASE_REF" --strict

      - name: Run main historical report (non-failing)
        if: ${{ always() }}
        run: |
          tests/ci/check-cross-lane-bundling.sh --branch --count 4 || true
