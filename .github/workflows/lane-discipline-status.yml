# Phase K Wave 9 — Vasquez (QA).
#
# Opt-in preview status workflow for the lane-discipline gate.
# Publishes an OPTIONAL-FOR-NOW status check name so Stephen can
# preview the lane-discipline outcome on PRs BEFORE the existing
# lane-discipline/check is flipped to a required status check on
# `main`.
#
# Once Stephen flips lane-discipline/cross-lane-bundling to
# required via the runbook in docs/agent-handoff-protocol.md §4,
# this workflow can be removed (or left in place as a
# secondary preview).
#
# Owner: Vasquez (QA).

name: lane-discipline-status (OPTIONAL-FOR-NOW)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  preview:
    name: lane-discipline / cross-lane-bundling (OPTIONAL-FOR-NOW)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout (full history for the PR branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine PR refs
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr_ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "base_ref=origin/${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr_ref=HEAD" >> "$GITHUB_OUTPUT"
            echo "base_ref=origin/main" >> "$GITHUB_OUTPUT"
          fi

      - name: Run lane-discipline check (preview, non-blocking)
        id: scan
        continue-on-error: true
        env:
          PR_REF: ${{ steps.refs.outputs.pr_ref }}
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
        run: |
          chmod +x tests/ci/check-cross-lane-bundling.sh
          set +e
          STRICT=1 tests/ci/check-cross-lane-bundling.sh \
            --pr "$PR_REF" --base "$BASE_REF" --strict
          ECODE=$?
          set -e
          echo "ecode=$ECODE" >> "$GITHUB_OUTPUT"
          if [ "$ECODE" -ne 0 ]; then
            echo "::warning::OPTIONAL-FOR-NOW — lane-discipline preview FAILED. This is non-blocking until Stephen flips the required-status-check; see docs/agent-handoff-protocol.md §4."
          fi

      - name: Annotate preview outcome
        if: ${{ always() }}
        run: |
          if [ "${{ steps.scan.outputs.ecode }}" = "0" ]; then
            echo "::notice title=lane-discipline OPTIONAL-FOR-NOW::PASS — your PR is clean against the cross-lane bundling rules."
          else
            echo "::warning title=lane-discipline OPTIONAL-FOR-NOW::PREVIEW FAILED — once Stephen flips this to required (docs/agent-handoff-protocol.md §4) your PR will be blocked from merging until amended."
          fi
