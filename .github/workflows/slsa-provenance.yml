# Phase K Wave 5 — Apone (DevOps).
#
# SLSA Level 3 in-toto provenance — UNIFIED multi-subject predicate.
#
# Wave-4 shipped two parallel attestation flows:
#
#   * `slsa-provenance.yml` (W4) — used `generator_container_slsa3.yml`
#     to emit a SINGLE-SUBJECT predicate (image manifest digest only),
#     attached to the OCI registry as a sidecar artefact.
#   * `sbom.yml` (J9 + W3) — generated CycloneDX + SPDX SBOMs as
#     workflow artefacts and pushed them to GitHub's dependency-graph,
#     but emitted NO in-toto predicate of its own (the SBOMs were
#     loose artefacts, not Sigstore-attested).
#
# Two predicate flows is fine for the Wave-4 floor (the image was
# attested even if the SBOM wasn't) but it leaves an audit gap: an
# auditor verifying the SLSA predicate cannot cryptographically
# confirm "the SBOM I'm looking at came from the SAME build run that
# produced this image". They have to TRUST the workflow run logs, not
# verify cryptographically.
#
# Wave-5 closes that gap. We replace the container-only generator
# with the GENERIC SLSA generator (`generator_generic_slsa3.yml`)
# which accepts a LIST of subjects, and we pass BOTH the image
# manifest list digest AND the CycloneDX SBOM file digest. The
# resulting `provenance-and-sbom.intoto.jsonl` is a SINGLE in-toto
# statement whose `subject:` array contains both artefacts — one
# DSSE-signed envelope, one Rekor entry, one verifiable claim:
# "this build run produced THIS image AND THIS SBOM, here are the
# materials + builder that produced them both".
#
# How the generic generator works:
#
#   * Input: a base64-encoded multi-line string (`sha256sum`-format)
#     where each line is `<sha256-hex>  <subject-name>`.
#   * Output: `<artifact-name>.intoto.jsonl` — a DSSE envelope wrapping
#     an in-toto statement whose `subject:` array reflects EVERY
#     supplied line, signed via OIDC + Sigstore Fulcio, recorded in
#     Rekor.
#
# The output is NOT auto-attached to the OCI registry (the generic
# generator doesn't know about OCI). We attach it ourselves via
# `cosign attest --predicate <file> --type slsaprovenance` so the
# downstream Kyverno `attestations:` block (also new in Wave-5) can
# find it via the standard OCI-sidecar discovery path.
#
# Pipeline shape:
#
#   1. resolve-digest  — unchanged: poll for the published image
#                        and compute the manifest-list digest.
#   2. build-sbom      — pull the image and generate the CycloneDX
#                        SBOM with Syft; compute the SBOM file's
#                        sha256; upload it as a workflow artefact
#                        so the downstream provenance + attach
#                        jobs can pick it up.
#   3. provenance      — generic SLSA generator, two subjects:
#                        image digest + SBOM file digest.
#   4. attest-oci      — cosign attest the resulting predicate to
#                        the image as an OCI sidecar attestation
#                        of `predicateType slsaprovenance1` so the
#                        new Wave-5 Kyverno `attestations:` block
#                        verifies cleanly.
#   5. attach-to-release — on tag pushes, upload both the predicate
#                          file AND the SBOM as Release assets.
#
# Why a single attestation instead of two (image + SBOM)?
#
#   * One Rekor entry is cheaper to look up + faster to verify.
#   * Auditors get ONE artefact to download + ONE `cosign verify-attestation`
#     to run — the SBOM provenance ride along on the image-provenance
#     verification.
#   * The SLSA v1 predicate spec EXPLICITLY supports multi-subject;
#     this is its intended shape for "build produced multiple
#     artefacts" (image + SBOM + signing-key release notes, etc.).
#   * Cross-subject tampering becomes verifiable: if the SBOM is
#     swapped post-attestation, the verifier rejects (the
#     subject-array hash doesn't match the DSSE envelope).
#
# Verification + auditor runbook: docs/slsa-provenance.md §4.
# Generator-version bump procedure: docs/slsa-provenance.md §6.
# Backwards-compatibility note: docs/slsa-provenance.md §6 also
# covers the migration from the Wave-4 single-subject shape; the
# pre-Wave-5 attestation remains in Rekor and remains verifiable
# with the Wave-4 `slsa-verifier verify-image` invocation.

name: slsa-provenance

on:
  # Mirror docker-build.yml triggers so every published bit gets a
  # unified predicate.
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      digest:
        description: "Image digest to attest (e.g. sha256:abc123...). Defaults to the manifest currently tagged `latest`."
        required: false
        default: ""
      tag:
        description: "Image tag the digest currently resolves to (used only for log breadcrumbs)."
        required: false
        default: "latest"

# Workflow-level permissions are deliberately minimal. The reusable
# workflow and the attest-oci job re-declare the elevated grants
# they need on the specific jobs that need them.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: long2know/mahjong-autotable
  # Filename of the unified predicate. Stable so docs + Release
  # tooling can grep for it without parsing the workflow.
  PROVENANCE_NAME: provenance-and-sbom.intoto.jsonl
  # Filename of the CycloneDX SBOM. Stable for the same reason and
  # so `cosign attest --predicate` can resolve it deterministically.
  SBOM_NAME: sbom.cyclonedx.json
  # ── Phase K Wave 7 — Apone (DevOps) ──────────────────────────
  # SIGNER-IDENTITY-INVARIANT — this workflow's cosign-attest call
  # produces predicates signed by the SAME OIDC identity covered by
  # the six-file invariant enforced by
  # `scripts/check_signer_identity.py`. The canonical regex below is
  # the source of truth that every cosign verify, Kyverno policy, and
  # admission gate in the repo MUST match. Edit only as part of the
  # documented rotation procedure in
  # `docs/signer-identity-invariant.md`.
  EXPECTED_IDENTITY_REGEXP: ^https://github\.com/long2know/mahjong-autotable/\.github/workflows/sign-image\.yml@refs/(heads/main|tags/v.*)$

jobs:
  resolve-digest:
    # Resolve the manifest-list digest the SLSA generator will attest
    # against. Mirror of sign-image.yml's resolve step — same pattern
    # so the two workflows stay symmetrical.
    name: Resolve published image digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.export.outputs.image }}
      digest: ${{ steps.export.outputs.digest }}
      digest-hex: ${{ steps.export.outputs.digest-hex }}
      tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - name: Resolve tag to attest
        id: resolve-tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_TAG}" ] && [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${DISPATCH_TAG}"
          elif [ "${REF_TYPE}" = "tag" ]; then
            tag="${REF_NAME}"
          else
            tag="latest"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${tag}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for image to appear
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if docker manifest inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
              echo "image ${IMAGE}:${TAG} is available"
              exit 0
            fi
            echo "[$i/36] image not yet published; sleeping 10s"
            sleep 10
          done
          echo "::error::image ${IMAGE}:${TAG} never appeared on the registry" >&2
          exit 1

      - name: Resolve manifest-list digest
        id: export
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ steps.resolve-tag.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_DIGEST}" ] && [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            digest="${DISPATCH_DIGEST}"
            echo "Using operator-supplied digest: ${digest}"
          else
            digest="sha256:$(docker buildx imagetools inspect --raw "${IMAGE}:${TAG}" | sha256sum | awk '{print $1}')"
            echo "Resolved manifest-list digest: ${digest}"
          fi
          digest_hex="${digest#sha256:}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "digest-hex=${digest_hex}" >> "$GITHUB_OUTPUT"

  build-sbom:
    # Generate the CycloneDX SBOM from the PUBLISHED image (same
    # digest the provenance attests). Syft runs against the
    # remote registry-pulled image so the SBOM reflects the
    # bits that admission will actually pull, not a local rebuild.
    name: Build CycloneDX SBOM + compute subjects
    needs: resolve-digest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    outputs:
      sbom-sha256: ${{ steps.compute.outputs.sbom-sha256 }}
      base64-subjects: ${{ steps.compute.outputs.base64-subjects }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CycloneDX SBOM from published image
        # Anchore's sbom-action is the canonical Syft wrapper for
        # GHA; it accepts a registry reference + writes SBOM to disk.
        # We pin the published digest (not the tag) so the SBOM is
        # bound to EXACTLY what provenance is being generated for.
        uses: anchore/sbom-action@fc46e51fd3cb168ffb36c6d1915723c47db58abb # v0.17.7
        with:
          image: ${{ needs.resolve-digest.outputs.image }}@${{ needs.resolve-digest.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ env.SBOM_NAME }}
          upload-artifact: false
          dependency-snapshot: false

      - name: Compute SBOM sha256 + base64 subjects list
        id: compute
        env:
          IMAGE: ${{ needs.resolve-digest.outputs.image }}
          DIGEST_HEX: ${{ needs.resolve-digest.outputs.digest-hex }}
          SBOM_FILE: ${{ env.SBOM_NAME }}
        run: |
          set -euo pipefail

          # Compute SBOM file sha256 (hex, no prefix).
          sbom_sha=$(sha256sum "${SBOM_FILE}" | awk '{print $1}')
          echo "sbom-sha256=${sbom_sha}" >> "$GITHUB_OUTPUT"

          # The generic SLSA generator expects a base64-encoded
          # multi-line string in `sha256sum`-output format:
          #
          #   <sha256-hex>  <subject-name>
          #
          # We list TWO subjects:
          #
          #   1. The image manifest digest. Subject-name follows the
          #      OCI convention of "<image>@sha256:<digest>" so any
          #      verifier resolving the predicate by image reference
          #      finds the matching subject deterministically.
          #   2. The CycloneDX SBOM file. Subject-name is the
          #      filename; auditors who downloaded the file from the
          #      Release page can verify its hash with `sha256sum`.
          {
            printf '%s  %s\n' "${DIGEST_HEX}" "${IMAGE}@sha256:${DIGEST_HEX}"
            printf '%s  %s\n' "${sbom_sha}"   "${SBOM_FILE}"
          } > subjects.txt

          cat subjects.txt

          b64=$(base64 -w0 < subjects.txt)
          echo "base64-subjects=${b64}" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM artefact for downstream jobs
        # Provenance + attest jobs (and the Release-attach job)
        # download this back so the SBOM file is consistent across
        # the whole pipeline (sha256 frozen at this step).
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: cyclonedx-sbom
          path: ${{ env.SBOM_NAME }}
          retention-days: 90
          if-no-files-found: error

  provenance:
    # The OFFICIAL SLSA L3 GENERIC provenance generator. Runs on a
    # SEPARATE runner with hardened permissions (the build runner
    # cannot inject material into the provenance — that's what gives
    # L3 the "non-falsifiable" guarantee). Multi-subject mode is
    # enabled by passing the base64 sha256sum-format subjects list.
    needs: [resolve-digest, build-sbom]
    # Pin MUST be a fully-qualified vX.Y.Z tag — the generator refuses
    # to run if invoked via a shorter ref. Coordinated bump per the
    # docs/slsa-provenance.md §6 runbook.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    permissions:
      actions: read       # generator inspects this workflow's env.
      id-token: write     # OIDC token → Fulcio short-lived cert.
      contents: write     # generator writes its predicate artefact + (on tags) attaches to release.
    with:
      base64-subjects: ${{ needs.build-sbom.outputs.base64-subjects }}
      # Stable filename so downstream jobs + docs can grep for it.
      provenance-name: ${{ vars.PROVENANCE_NAME || 'provenance-and-sbom.intoto.jsonl' }}
      # Keep the runner light by using the prebuilt generator binary
      # from the v2.0.0 release.
      compile-generator: false
      # Do NOT have the reusable workflow auto-upload the predicate
      # to the GitHub Release. Our `attach-to-release` job below
      # does that AFTER pairing with the SBOM file so both land
      # atomically under matching names.
      upload-assets: false

  attest-oci:
    # Attach the unified predicate to the image as an OCI sidecar
    # attestation so the Wave-5 Kyverno `attestations:` block can
    # discover it via the standard `cosign download attestation`
    # path. Without this, the predicate exists in Rekor + as a
    # workflow/release artefact but NOT next to the image — the
    # admission verifier wouldn't see it.
    name: Cosign attest predicate to image (OCI sidecar)
    needs: [resolve-digest, build-sbom, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write     # write the .att sidecar artefact next to the image.
      id-token: write     # OIDC token → Fulcio short-lived cert (cosign keyless).
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: v2.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download unified predicate
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: predicate/

      - name: Cosign attest unified predicate
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE: ${{ needs.resolve-digest.outputs.image }}
          DIGEST: ${{ needs.resolve-digest.outputs.digest }}
          PROV_NAME: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          set -euo pipefail
          ls -la predicate/
          predicate_path="predicate/${PROV_NAME}"
          if [ ! -f "${predicate_path}" ]; then
            # fall back to first .jsonl in the directory
            predicate_path=$(find predicate -maxdepth 1 -type f -name '*.intoto.jsonl' | head -n1)
          fi
          echo "Attesting ${IMAGE}@${DIGEST} with ${predicate_path}"

          # Apone — CI emergency fix. The generic SLSA generator emits
          # a DSSE-wrapped in-toto Statement; cosign v2.4+ with
          # `--type slsaprovenance1 --predicate <file>` strictly
          # validates the file against the SLSA v1 predicate schema
          # (requires `buildDefinition`), which a DSSE envelope does
          # not satisfy at the file level. Unwrap the envelope first:
          # base64-decode the `payload` field of the first DSSE line
          # and extract its in-toto Statement's `predicate` object
          # into a bare JSON file that cosign can consume. We feed
          # cosign the bare predicate so cosign re-wraps it in its
          # own envelope for the OCI sidecar (the original envelope
          # is still uploaded as a separate artefact + lives in Rekor).
          bare_predicate="predicate/predicate.bare.json"
          SRC="${predicate_path}" DST="${bare_predicate}" python3 -c '
          import base64, json, os, sys
          src = os.environ["SRC"]
          dst = os.environ["DST"]
          with open(src, "r", encoding="utf-8") as f:
              first = f.readline().strip()
          env = json.loads(first)
          payload_b64 = env.get("payload")
          if not payload_b64:
              raise SystemExit(f"no payload field in DSSE envelope at {src}")
          statement = json.loads(base64.b64decode(payload_b64))
          predicate = statement.get("predicate")
          if predicate is None:
              raise SystemExit(f"no predicate field in in-toto Statement at {src}")
          with open(dst, "w", encoding="utf-8") as f:
              json.dump(predicate, f)
          print(f"Extracted bare predicate to {dst}; keys={sorted(predicate)}")
          '

          cosign attest \
              --type slsaprovenance1 \
              --predicate "${bare_predicate}" \
              --yes \
              "${IMAGE}@${DIGEST}"

  attach-to-release:
    # On tag pushes only: download the unified predicate + the SBOM
    # and upload BOTH to the matching GitHub Release. Downstream
    # consumers grab one bundle, verify both subjects.
    needs: [resolve-digest, build-sbom, provenance]
    if: github.ref_type == 'tag'
    name: Attach unified predicate + SBOM to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download unified predicate
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: predicate/

      - name: Download CycloneDX SBOM
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: cyclonedx-sbom
          path: sbom/

      - name: Normalize filenames
        env:
          PROV_NAME: ${{ needs.provenance.outputs.provenance-name }}
          SBOM_NAME: ${{ env.SBOM_NAME }}
        run: |
          set -euo pipefail
          ls -la predicate/ sbom/
          # Canonical Release-attached filenames. The generic generator
          # already produces ${PROV_NAME}; copy in case the generator
          # chose a different default (defensive: matches the same
          # pattern the W4 attach-to-release job used).
          if [ ! -f "predicate/${PROV_NAME}" ]; then
            src=$(find predicate -maxdepth 1 -type f -name '*.intoto.jsonl' | head -n1)
            cp "${src}" "predicate/${PROV_NAME}"
          fi
          test -f "sbom/${SBOM_NAME}" || { echo "::error::SBOM file missing"; exit 1; }

      - name: Wait for release to exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "release ${TAG} exists; attaching predicate + SBOM"
              exit 0
            fi
            echo "[$i/60] release ${TAG} not yet published; sleeping 10s"
            sleep 10
          done
          echo "::warning::release ${TAG} never appeared; skipping attach (predicate is still in Rekor + OCI sidecar)"
          exit 0

      - name: Attach predicate + SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PROV_NAME: ${{ needs.provenance.outputs.provenance-name }}
          SBOM_NAME: ${{ env.SBOM_NAME }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
                "predicate/${PROV_NAME}" \
                "sbom/${SBOM_NAME}" \
                --repo "${GITHUB_REPOSITORY}" --clobber
            echo "Attached ${PROV_NAME} + ${SBOM_NAME} to release ${TAG}"
          else
            echo "Release missing; skipped (Rekor + OCI sidecar still hold the predicate)"
          fi

      - name: Step summary
        env:
          IMAGE: ${{ needs.resolve-digest.outputs.image }}
          DIGEST: ${{ needs.resolve-digest.outputs.digest }}
          SBOM_SHA256: ${{ needs.build-sbom.outputs.sbom-sha256 }}
          TAG: ${{ github.ref_name }}
          PROV_NAME: ${{ needs.provenance.outputs.provenance-name }}
          SBOM_NAME: ${{ env.SBOM_NAME }}
        run: |
          {
            echo "## SLSA L3 unified provenance + SBOM attached"
            echo ""
            echo "- Image: \`${IMAGE}@${DIGEST}\`"
            echo "- SBOM: \`${SBOM_NAME}\` (\`sha256:${SBOM_SHA256}\`)"
            echo "- Predicate: \`${PROV_NAME}\` (DSSE-signed, multi-subject)"
            echo "- Release: [\`${TAG}\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG})"
            echo "- Verify locally: see [\`docs/slsa-provenance.md\`](../blob/main/docs/slsa-provenance.md) §4."
          } >> "$GITHUB_STEP_SUMMARY"
