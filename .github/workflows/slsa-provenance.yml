# Phase K Wave 4 — Apone (DevOps).
#
# SLSA Level 3 in-toto provenance for every published container image.
#
# Where this sits in the supply-chain chain:
#
#   Wave 1   sign-image.yml             cosign keyless signature on the
#                                       multi-arch manifest list digest.
#   Wave 2   verify-signature.yml       reusable cosign-verify gate.
#   Wave 3   container-scan.yml         Trivy CRITICAL gate every PR.
#   Wave 3   release.yml verify-sbom    SPDX SBOM signed with cosign.
#   Wave 3   kyverno-cosign-verify.yaml admission-time signature verify.
#   Wave 4   slsa-provenance.yml (this) SLSA L3 in-toto provenance
#                                       predicate, signed via Fulcio +
#                                       recorded in Rekor, attached as
#                                       an OCI artefact to the image AND
#                                       (on tag pushes) dropped onto the
#                                       GitHub Release as
#                                       `provenance.intoto.jsonl`.
#
# WHY SLSA on top of cosign signatures?
#
# A cosign signature attests "these bits were signed by THIS workflow
# identity". SLSA provenance is the next ring outward: it's a signed,
# Sigstore-anchored in-toto predicate that links
#
#   * the source commit (subject + digest, plus the full builder
#     materials list — repo, ref, workflow path, run id, run attempt),
#   * the build environment (runner OS, builder version),
#   * the produced artefact (image manifest digest)
#
# into one tamper-evident statement. A consumer who has the image
# digest can call `slsa-verifier` and prove not only WHO signed it
# (cosign already does that) but also WHAT COMMIT it was built from,
# WHICH WORKFLOW built it, and that the workflow file at that commit
# was unmodified from what produced the artefact. That's the SLSA L3
# guarantee: "non-falsifiable, hermetic source-to-artefact link".
#
# Why the upstream reusable workflow over a hand-rolled implementation?
#
# `slsa-framework/slsa-github-generator` is the official, audited
# reference implementation. It runs on an isolated runner pool with
# strict permissions so the build cannot tamper with the provenance
# generator. Hand-rolling would lose the L3 guarantee (the builder
# would be the same runner as the build itself — circular trust).
#
# The reusable workflow MUST be pinned to a fully-qualified `vX.Y.Z`
# tag (NOT a shorter `vX.Y` / `vX` ref, NOT a sha) — that's how the
# generator detects which tagged release of itself is being invoked
# and refuses to run otherwise. Bumping the pin is a coordinated
# upgrade: bump here AND re-verify with `slsa-verifier` against a
# test artefact.
#
# Verification runbook for operators / auditors: docs/slsa-provenance.md.

name: slsa-provenance

on:
  # Fire on the same triggers that publish an image to the registry.
  # docker-build.yml runs on push-to-main and on `v*.*.*` tag pushes;
  # we mirror that exact set so every published bit gets a provenance
  # predicate. workflow_dispatch is for re-running provenance against
  # a hand-supplied digest (e.g. backfill after a Sigstore outage).
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      digest:
        description: "Image digest to attest (e.g. sha256:abc123...). Defaults to the manifest currently tagged `latest`."
        required: false
        default: ""
      tag:
        description: "Image tag the digest currently resolves to (used only for log breadcrumbs)."
        required: false
        default: "latest"

# Workflow-level permissions are deliberately minimal. The reusable
# workflow re-declares the elevated grants it needs (id-token: write,
# packages: write, actions: read) on the `provenance` job below — the
# resolve job below stays read-only.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: long2know/mahjong-autotable

jobs:
  resolve-digest:
    # Resolve the manifest-list digest the SLSA generator will attest
    # against. Mirror of sign-image.yml's resolve step — same pattern
    # so the two workflows stay symmetrical.
    name: Resolve published image digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.export.outputs.image }}
      digest: ${{ steps.export.outputs.digest }}
      tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - name: Resolve tag to attest
        id: resolve-tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_TAG}" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${DISPATCH_TAG}"
          elif [ "${REF_TYPE}" = "tag" ]; then
            tag="${REF_NAME}"
          else
            tag="latest"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${tag}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for image to appear
        # docker-build.yml is triggered by the same push/tag event,
        # so the image may not exist yet when this workflow starts.
        # Poll for ~6 min before giving up — matches release.yml.
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if docker manifest inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
              echo "image ${IMAGE}:${TAG} is available"
              exit 0
            fi
            echo "[$i/36] image not yet published; sleeping 10s"
            sleep 10
          done
          echo "::error::image ${IMAGE}:${TAG} never appeared on the registry" >&2
          exit 1

      - name: Resolve manifest-list digest
        id: export
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ steps.resolve-tag.outputs.tag }}
          DISPATCH_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_DIGEST}" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            digest="${DISPATCH_DIGEST}"
            echo "Using operator-supplied digest: ${digest}"
          else
            # `docker buildx imagetools inspect --raw` returns the manifest
            # list JSON; piping through sha256sum reconstructs the digest
            # the registry stores. Matches the same approach used by
            # `sign-image.yml` so signature + provenance bind to the SAME bits.
            digest="sha256:$(docker buildx imagetools inspect --raw "${IMAGE}:${TAG}" | sha256sum | awk '{print $1}')"
            echo "Resolved manifest-list digest: ${digest}"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  provenance:
    # The OFFICIAL SLSA L3 container-provenance generator. Runs on a
    # SEPARATE runner with hardened permissions (the build runner
    # cannot inject material into the provenance — that's what gives
    # L3 the "non-falsifiable" guarantee).
    needs: resolve-digest
    # Pin MUST be a fully-qualified vX.Y.Z tag — the generator refuses
    # to run if invoked via a shorter ref. Bump as a coordinated
    # upgrade with the operator runbook (docs/slsa-provenance.md §6).
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    permissions:
      actions: read       # generator inspects this workflow's env.
      id-token: write     # OIDC token → Fulcio short-lived cert.
      packages: write     # writes the attestation as an OCI artefact next to the image.
    with:
      image: ${{ needs.resolve-digest.outputs.image }}
      digest: ${{ needs.resolve-digest.outputs.digest }}
      registry-username: ${{ github.actor }}
      # Provenance is generated even for branch pushes (main builds);
      # `compile-generator: false` keeps the runner light by using
      # the prebuilt generator binary from the v2.0.0 release.
      compile-generator: false
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  attach-to-release:
    # On tag pushes only: download the freshly-generated `provenance.intoto.jsonl`
    # from the reusable workflow's output artefact and attach it to
    # the matching GitHub Release so downstream consumers can grab it
    # without the OCI tooling. release.yml is the workflow that
    # creates the Release; this job uses `gh release upload --clobber`
    # so a re-run replaces the asset cleanly.
    needs: [resolve-digest, provenance]
    if: github.ref_type == 'tag'
    name: Attach provenance to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download provenance artefact
        # The SLSA generator publishes a workflow artefact named
        # `<provenance-name>.intoto.jsonl`; resolving that name from
        # the reusable-workflow output keeps this job self-locating.
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance/

      - name: Rename to canonical filename
        env:
          PROV_NAME: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          set -euo pipefail
          ls -la provenance/
          # Canonical filename per `slsa-verifier` docs: the attestation
          # bundle is consumed as `provenance.intoto.jsonl`. Rename if
          # the generator chose a different default.
          if [ ! -f "provenance/provenance.intoto.jsonl" ]; then
            cp "provenance/${PROV_NAME}" provenance/provenance.intoto.jsonl
          fi

      - name: Wait for release to exist
        # release.yml may finish AFTER this workflow because of the
        # smoke + verify-signature + verify-sbom chain. Poll up to
        # ~10 min for the release to appear, then attach.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "release ${TAG} exists; attaching provenance"
              exit 0
            fi
            echo "[$i/60] release ${TAG} not yet published; sleeping 10s"
            sleep 10
          done
          echo "::warning::release ${TAG} never appeared; skipping attach (provenance is still in Rekor + OCI registry)"
          exit 0

      - name: Attach provenance to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" provenance/provenance.intoto.jsonl \
                --repo "${GITHUB_REPOSITORY}" --clobber
            echo "Attached provenance.intoto.jsonl to release ${TAG}"
          else
            echo "Release missing; skipped (Rekor + OCI registry still hold the provenance)"
          fi

      - name: Step summary
        env:
          IMAGE: ${{ needs.resolve-digest.outputs.image }}
          DIGEST: ${{ needs.resolve-digest.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## SLSA L3 provenance attached"
            echo ""
            echo "- Image: \`${IMAGE}@${DIGEST}\`"
            echo "- Release: [\`${TAG}\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG})"
            echo "- Verify locally: see [\`docs/slsa-provenance.md\`](../blob/main/docs/slsa-provenance.md) §4."
          } >> "$GITHUB_STEP_SUMMARY"
