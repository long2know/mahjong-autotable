# Phase K Wave 7 — Apone (DevOps).
#
# Mobile EXTERNAL-testing promotion — operator-driven only.
#
# Pairs with `.github/workflows/mobile-internal-testing.yml` (W6):
#
#   * mobile-internal-testing.yml runs on `mobile-v*.*.*` tags
#     and pushes signed builds to:
#       - TestFlight  → Internal Testing track  (up to 100 Apple
#                       Developer Program team members)
#       - Play Console → Internal Testing track  (max 100 testers)
#
#   * THIS workflow runs only via `workflow_dispatch` and PROMOTES
#     the most-recent internal build to:
#       - TestFlight  → External Testing groups (up to 10 000
#                       beta testers; Apple App Review on the FIRST
#                       external build of each version)
#       - Play Console → Closed Testing tracks  (testers added
#                       by email — typically 100 → 10 000)
#
# Why a SEPARATE workflow (not auto-promotion)?
#
#   * External-Testing distribution exposes the binary to people
#     OUTSIDE the company / dev team. Auto-promotion on every tag
#     is far too aggressive — Internal Testing is for soak;
#     promotion gates the External release once the operator + the
#     internal beta cohort agree the build is fit.
#   * App Review pauses (Apple, ~24 h for the first External build
#     of a version) cannot be rolled back by re-triggering — the
#     operator MUST be in the loop.
#   * Release notes for External testers are user-facing copy that
#     wants careful authoring; the workflow takes them as input.
#
# Code-signing identities, Play credentials, and TestFlight API
# keys are the SAME secrets the Internal workflow consumes —
# operator-driven External release just re-uses them. See
# `docs/mobile-release.md` §3 for the one-time secret setup.
#
# Soft-fail behaviour mirrors mobile-internal-testing.yml:
#   when secrets are missing (fork PRs cannot see them), the
#   matching job logs a warning + EXITS 0; operator-driven
#   dispatches from `main` always have them.

name: mobile-external-testing

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to promote (e.g. mobile-v0.16.0). MUST match mobile-vMAJOR.MINOR.PATCH."
        required: true
      release_notes:
        description: "Release notes for External testers (Markdown / plaintext; max ~4000 chars)."
        required: true
      ios_external_groups:
        description: "Comma-separated TestFlight External Group names (created in App Store Connect). Defaults to 'External-Beta'."
        required: false
        default: "External-Beta"
        type: string
      android_track:
        description: "Play Console Closed Testing track (e.g. 'beta', 'alpha', or any custom closed-testing track ID)."
        required: false
        default: "beta"
        type: string
      release_status:
        description: "Initial Play release_status — 'draft' (operator gates roll-out) or 'completed' (auto-roll)."
        required: false
        default: "draft"
        type: choice
        options:
          - draft
          - completed
          - inProgress

permissions:
  contents: read
  id-token: write

concurrency:
  group: mobile-external-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag + capture promotion inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      package_name: ${{ steps.tag.outputs.package_name }}
      ios_bundle_id: ${{ steps.tag.outputs.ios_bundle_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate tag shape
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^mobile-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG does not match mobile-vMAJOR.MINOR.PATCH"
            exit 1
          fi
          VERSION="${TAG#mobile-v}"
          # Bundle IDs match the W6 internal-testing workflow
          # defaults. Keep in lock-step.
          PACKAGE_NAME="com.long2know.mahjong"
          IOS_BUNDLE_ID="com.long2know.mahjong"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "package_name=$PACKAGE_NAME"
            echo "ios_bundle_id=$IOS_BUNDLE_ID"
          } >> "$GITHUB_OUTPUT"
          echo "Promoting mobile build: tag=$TAG version=$VERSION"

      - name: Verify tag is a real ref
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag '$TAG' does not exist in the repository — has mobile-internal-testing.yml run for it?"
            exit 1
          fi
          echo "Tag $TAG resolves to commit $(git rev-parse "refs/tags/$TAG")"

      - name: Write release-notes payload (artefact)
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          mkdir -p release-notes
          # Cap to 4000 chars (TestFlight + Play both reject longer
          # blobs). Truncation is loud, not silent — fail if too
          # long instead of clipping.
          CHARS=${#NOTES}
          if (( CHARS > 4000 )); then
            echo "::error::release_notes is $CHARS chars; max 4000"
            exit 1
          fi
          printf '%s\n' "$NOTES" > release-notes/external.txt
          echo "Wrote release-notes/external.txt ($CHARS chars)"

      - name: Upload release-notes artefact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-notes-${{ steps.tag.outputs.version }}
          path: release-notes/
          retention-days: 30

  android-external:
    name: Android — promote Internal → Closed Testing
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Detect Play credentials
        id: secrets
        env:
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$PLAY_SA" ]]; then
            echo "have-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON missing — skipping Play promotion"
          else
            echo "have-secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby (fastlane)
        if: steps.secrets.outputs.have-secrets == 'true'
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install fastlane
        if: steps.secrets.outputs.have-secrets == 'true'
        run: |
          set -euo pipefail
          gem install fastlane -NV
          fastlane --version

      - name: Download release notes
        if: steps.secrets.outputs.have-secrets == 'true'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-notes-${{ needs.prepare.outputs.version }}
          path: release-notes/

      - name: fastlane supply — promote Internal → Closed Testing
        id: promote
        if: steps.secrets.outputs.have-secrets == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          DEST_TRACK: ${{ inputs.android_track }}
          RELEASE_STATUS: ${{ inputs.release_status }}
        run: |
          set -euo pipefail
          mkdir -p fastlane
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | base64 -d > fastlane/play-sa.json
          chmod 600 fastlane/play-sa.json

          # Locate release notes (en-US is the Play Console
          # default; multi-locale support can ride alongside but
          # the W7 baseline ships en-US only).
          mkdir -p fastlane/metadata/android/en-US/changelogs
          # Strip the version-code-suffixed file (Play Console
          # wants the changelog mapped to the version code that
          # carries the External release, but `fastlane supply
          # --track-promote-to` writes to the existing track's
          # build, so we just push the changelog under the
          # default name).
          cp release-notes/external.txt fastlane/metadata/android/en-US/changelogs/default.txt

          # `--track internal --track-promote-to <DEST>` is the
          # supply primitive that promotes the most recent build
          # on the Internal track to a Closed Testing track
          # WITHOUT re-uploading the AAB. Play Console enforces
          # `(packageName, versionCode)` uniqueness — promotion
          # is the right verb (re-upload would reject with
          # "version code already exists").
          fastlane supply \
            --json_key fastlane/play-sa.json \
            --package_name "$PACKAGE_NAME" \
            --track internal \
            --track_promote_to "$DEST_TRACK" \
            --release_status "$RELEASE_STATUS" \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --metadata_path fastlane/metadata/android/
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Skip notice (no secrets)
        if: steps.secrets.outputs.have-secrets != 'true'
        run: |
          echo "Android promotion SKIPPED (missing PLAY_SERVICE_ACCOUNT_JSON)" >> "$GITHUB_STEP_SUMMARY"

  ios-external:
    name: iOS — promote TestFlight Internal → External
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 30
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Detect App Store Connect API key
        id: secrets
        env:
          APPLE_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_KEY" || -z "$APPLE_KEY_ID" || -z "$APPLE_ISSUER" ]]; then
            echo "have-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_API_KEY_BASE64 / APPLE_API_KEY_ID / APPLE_API_ISSUER_ID missing — skipping TestFlight External promotion"
          else
            echo "have-secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby (fastlane)
        if: steps.secrets.outputs.have-secrets == 'true'
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install fastlane
        if: steps.secrets.outputs.have-secrets == 'true'
        run: |
          set -euo pipefail
          gem install fastlane -NV
          fastlane --version

      - name: Decode App Store Connect API key
        if: steps.secrets.outputs.have-secrets == 'true'
        env:
          APPLE_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .ascapi
          printf '%s' "$APPLE_KEY" | base64 -d > .ascapi/AuthKey.p8
          chmod 600 .ascapi/AuthKey.p8

      - name: Download release notes
        if: steps.secrets.outputs.have-secrets == 'true'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-notes-${{ needs.prepare.outputs.version }}
          path: release-notes/

      - name: fastlane pilot — distribute External Testing groups
        id: promote
        if: steps.secrets.outputs.have-secrets == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          IOS_BUNDLE_ID: ${{ needs.prepare.outputs.ios_bundle_id }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          IOS_EXTERNAL_GROUPS: ${{ inputs.ios_external_groups }}
        run: |
          set -euo pipefail
          # `pilot distribute` adds the most recent build to the
          # named External Testing groups. The build MUST already
          # exist in App Store Connect — the W6 internal workflow
          # ran `pilot upload` to put it there.
          #
          # IMPORTANT: Apple requires App Review on the FIRST
          # External-Testing distribution of a NEW version. The
          # `distribute_external true` flag triggers that review;
          # `notify_external_testers true` emails the cohort once
          # review passes. Both are operator-driven decisions —
          # the workflow's job is just to invoke the API in the
          # documented shape.

          # Read release notes (TestFlight beta notes per build).
          NOTES=$(cat release-notes/external.txt)

          # Convert the comma-separated group list into the
          # fastlane `groups` array shape via a tiny ruby one-liner.
          GROUPS_ARRAY=$(ruby -e "puts ARGV[0].split(',').map(&:strip).map { |g| \"'#{g}'\" }.join(',')" -- "$IOS_EXTERNAL_GROUPS")

          # Generate a fastlane Fastfile-equivalent lane via the
          # `pilot` CLI directly. This is intentionally NOT a
          # checked-in Fastfile — keeping the Apple-side
          # configuration in the workflow file means the W7 doc +
          # the W7 commit are the single source of truth.
          fastlane pilot distribute \
            --api_key_path .ascapi/AuthKey.p8 \
            --api_key_id "$APPLE_API_KEY_ID" \
            --api_key_issuer_id "$APPLE_API_ISSUER_ID" \
            --app_identifier "$IOS_BUNDLE_ID" \
            --build_number latest \
            --distribute_external true \
            --notify_external_testers true \
            --groups "$IOS_EXTERNAL_GROUPS" \
            --changelog "$NOTES"
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Skip notice (no secrets)
        if: steps.secrets.outputs.have-secrets != 'true'
        run: |
          echo "TestFlight External promotion SKIPPED (missing APPLE_API_KEY_* secrets)" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Slack notification
    needs: [prepare, android-external, ios-external]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Slack
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_PROMOTED: ${{ needs.android-external.outputs.promoted || 'skipped' }}
          IOS_PROMOTED: ${{ needs.ios-external.outputs.promoted || 'skipped' }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$WEBHOOK" ]]; then
            echo "SLACK_WEBHOOK_URL missing — skipping notification" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Build payload via `jq -n` — safe, no f-string / shell
          # quoting hazards (the W6 Apone note on inline Python
          # edge cases — the W7 implementation uses jq instead).
          PAYLOAD=$(jq -nc \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            --arg android "$ANDROID_PROMOTED" \
            --arg ios "$IOS_PROMOTED" \
            --arg url "https://github.com/${REPO}/actions/runs/${RUN_ID}" \
            '{
              text: ("📱 *Mobile External Testing promoted* — `" + $tag + "`"),
              blocks: [
                {
                  type: "section",
                  text: { type: "mrkdwn", text: ("📱 *Mobile External Testing promoted* — `" + $tag + "`") }
                },
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: ("*Version*\n`" + $version + "`") },
                    { type: "mrkdwn", text: ("*Android (Closed)*\n" + $android) },
                    { type: "mrkdwn", text: ("*iOS (TestFlight Ext)*\n" + $ios) }
                  ]
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: { type: "plain_text", text: "View workflow run" },
                      url: $url
                    }
                  ]
                }
              ]
            }')
          curl -fsS -X POST -H 'Content-Type: application/json' \
              --data "$PAYLOAD" \
              "$WEBHOOK"
          echo "Slack notification posted." >> "$GITHUB_STEP_SUMMARY"
