# Phase K Wave 9 — Vasquez (QA).
#
# Nightly lane-discipline cron — runs the cross-lane bundling
# detector in --repo-mode against the entire reachable history of
# `main`, then emits a baseline-violation report. Expected
# post-W6 baseline is 0; non-zero counts are investigated within
# 24h.
#
# Hand-off from Wave 8: §3.5 of docs/agent-handoff-protocol.md
# advertised this cron pattern; Wave 9 lands the workflow itself.
#
# Owner: Vasquez (QA). See docs/agent-handoff-protocol.md §3.6.

name: lane-discipline-nightly

on:
  schedule:
    # 06:00 UTC daily.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Verbose output'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: Repo-mode cross-lane scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the repo-mode walk)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main

      - name: Verify lane-map.json is present and parseable
        run: |
          test -f tests/ci/lane-map.json \
            || (echo "lane-map.json missing — Vasquez QA gate"; exit 1)
          grep -q '"lanes"' tests/ci/lane-map.json
          echo "lane-map.json OK"

      - name: Run lane-discipline check (repo mode, full history)
        id: scan
        run: |
          chmod +x tests/ci/check-cross-lane-bundling.sh
          set +e
          OUTPUT="$(tests/ci/check-cross-lane-bundling.sh --repo-mode 2>&1)"
          ECODE=$?
          set -e
          echo "$OUTPUT"
          {
            echo "ecode=$ECODE"
            echo 'output<<EOF'
            echo "$OUTPUT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post baseline report to tracking issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Phase K Wave 15 — Apone (DevOps). Pipe the scan
          # step outputs in via `env:` so the `run:` body
          # never interleaves a `${{ }}` GitHub Actions
          # expression with a bash heredoc — see the W5
          # heredoc collision fixed in this step and
          # documented at docs/agent-handoff-protocol.md §5.10.
          SCAN_ECODE: ${{ steps.scan.outputs.ecode }}
          SCAN_OUTPUT: ${{ steps.scan.outputs.output }}
        run: |
          # Locate the tracking issue (idempotent — search by title).
          TITLE="[lane-discipline-nightly] baseline"
          ISSUE_NUMBER="$(gh issue list \
            --search "$TITLE in:title" \
            --state open \
            --json number \
            --jq '.[0].number' || true)"
          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_NUMBER="$(gh issue create \
              --title "[lane-discipline-nightly] baseline" \
              --label 'lane-discipline,bot' \
              --body 'Tracking issue for the nightly lane-discipline --repo-mode baseline scan. See workflow: lane-discipline-nightly.yml.' \
              --json number --jq '.number' || true)"
          fi
          if [ -n "$ISSUE_NUMBER" ]; then
            DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Phase K Wave 15 — Apone (DevOps). Heredoc tag is
            # single-quoted (`<<'EOF'`) so neither shell
            # variable expansion nor command substitution
            # fires inside the body — the previous unquoted
            # form (W5-era) collided with the YAML block
            # scalar's column-0 indent rule (actionlint:
            # "could not parse as YAML: yaml: line 87"). The
            # body is now indented at the YAML block scalar
            # base (10 cols) AND uses bash placeholder
            # substitution (`${BODY//__X__/$X}`) against the
            # env-piped values so neither the GH Actions
            # expression layer nor the bash expansion layer
            # touch the raw scan output. See
            # docs/agent-handoff-protocol.md §5.10 for the
            # convention.
            BODY="$(cat <<'EOF'
          [lane-discipline-nightly] **__DATE__** UTC

          Exit code: `__ECODE__`
          Expected post-W6 baseline: 0 violations.

          ```
          __OUTPUT__
          ```
          EOF
          )"
            BODY="${BODY//__DATE__/$DATE}"
            BODY="${BODY//__ECODE__/$SCAN_ECODE}"
            BODY="${BODY//__OUTPUT__/$SCAN_OUTPUT}"
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          fi
