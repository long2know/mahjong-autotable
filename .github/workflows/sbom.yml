# Phase J Wave 9 — Apone (DevOps). Wave-5 amendment: see below.
#
# Software-Bill-of-Materials (SBOM) + container image vulnerability scan.
# Runs on every push to main and on every PR that touches the Dockerfile,
# .csproj files, or this workflow itself, plus a weekly cron so a fresh
# CVE published mid-week against a pinned dep gets flagged within 7 days.
#
# Pipeline:
#   1. Build the production Docker image locally (load: true → no push).
#   2. Generate a CycloneDX SBOM from the image filesystem via Anchore's
#      `sbom-action` (the canonical CycloneDX producer for GitHub Actions
#      circa 2024). The SBOM is uploaded as a workflow artifact AND
#      attached to GitHub's Dependency-graph (`dependency-snapshot: true`).
#   3. Run Trivy against the image with `severity: CRITICAL,HIGH` and
#      `exit-code: 1` so the workflow goes RED on any CRITICAL or HIGH
#      finding. SARIF output is uploaded to GitHub's code-scanning panel
#      so dependabot-style triage works against image findings.
#   4. PR runs additionally post a compact summary as a PR comment so the
#      reviewer sees the scan result inline.
#
# `permissions:` are tightly scoped — `security-events: write` is the
# only elevated grant (required by `upload-sarif`). Everything else is
# strict-read.
#
# ## Phase K Wave 5 amendment — relationship to the unified SLSA predicate
#
# This workflow continues to OWN the PR-time CVE gate (Trivy
# CRITICAL,HIGH; SARIF → Code Scanning) and the per-PR SBOM that
# feeds GitHub's dependency-graph. It is the PR-blocking layer.
#
# The PUBLISHED, AUDITOR-VERIFIABLE SBOM for every release artefact
# now lives in `.github/workflows/slsa-provenance.yml` (Wave 5) as
# a multi-subject in-toto predicate (image digest + CycloneDX SBOM
# file digest, both Sigstore-signed under ONE DSSE envelope, attached
# to the OCI image as a sidecar attestation AND uploaded to the
# GitHub Release).
#
# The SBOM produced HERE (sbom.cyclonedx.json from the locally-built
# PR image) IS NOT signed and IS NOT a long-term audit artefact —
# it's the fastest possible CVE feedback for the reviewer. The
# Wave-5 unified predicate is the source of truth for "what was in
# the build that shipped". Do NOT cite this workflow's SBOM in
# `docs/sbom.md` for audit-chain purposes; cite the Release-attached
# `sbom.cyclonedx.json` next to `provenance-and-sbom.intoto.jsonl`.

name: sbom

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/backend/**/*.csproj"
      - "src/frontend/**/package*.json"
      - ".github/workflows/sbom.yml"
  schedule:
    # Weekly — every Monday 09:00 UTC (04:00 CDT, 05:00 EDT). Catches
    # new CVEs published against image deps that haven't otherwise been
    # touched in the past week.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  IMAGE_NAME: ghcr.io/long2know/mahjong-autotable
  IMAGE_TAG: sbom-${{ github.sha }}

jobs:
  sbom-and-scan:
    name: Build + SBOM + Trivy CRITICAL,HIGH
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      # Build the production image locally (no registry push). `load: true`
      # makes the image visible to subsequent steps via the local docker
      # daemon so trivy + sbom-action can scan it by name.
      - name: Build image (local, no push)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Generate a CycloneDX SBOM from the image filesystem. The
      # `anchore/sbom-action@v0` wraps Syft, which is the canonical SBOM
      # producer that Trivy + Grype both consume. Attaches to GitHub's
      # dependency-graph so Dependabot can correlate findings.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@fc46e51fd3cb168ffb36c6d1915723c47db58abb # v0.17.7
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          dependency-snapshot: true
          upload-artifact: true
          upload-artifact-retention: 30

      # Also export an SPDX SBOM — some downstream consumers (Microsoft
      # SBOM Tool, FOSSA, etc.) require SPDX 2.3 format. Both formats are
      # uploaded as workflow artifacts so release engineers can pick the
      # one their downstream tooling wants.
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@fc46e51fd3cb168ffb36c6d1915723c47db58abb # v0.17.7
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-artifact-retention: 30

      # Trivy image scan — gates the workflow on CRITICAL + HIGH.
      # `exit-code: '1'` fails the step on any matching finding so the
      # build goes RED and the PR is blocked until the finding is
      # remediated (or explicitly suppressed via .trivyignore).
      - name: Trivy image scan (CRITICAL,HIGH gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"

      # Re-run Trivy with SARIF output for GitHub code-scanning. Runs
      # `if: always()` so SARIF is uploaded even if the gating step
      # above already failed — that way the security tab still has the
      # findings record once the PR is unblocked.
      - name: Trivy SARIF output (no gate)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # On PR runs, post a compact summary comment so reviewers see
      # the scan result inline without digging into the workflow logs.
      - name: PR comment summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const status = '${{ job.status }}';
            const sha = '${{ github.sha }}'.slice(0, 7);
            const icon = status === 'success' ? '✅' : '🚨';
            const body = [
              `### ${icon} SBOM + Trivy (Phase J Wave 9)`,
              ``,
              `- Image: \`${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\` (${sha})`,
              `- Scanner: Trivy (CRITICAL,HIGH gate)`,
              `- SBOMs: \`sbom.cyclonedx.json\` + \`sbom.spdx.json\` (workflow artifacts)`,
              `- Result: **${status}**`,
              ``,
              `See [Workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for full SARIF + table output.`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
