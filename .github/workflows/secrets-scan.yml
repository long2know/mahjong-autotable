# Phase K Wave 4 — Apone (DevOps).
#
# Secrets-scanning gate. Runs `gitleaks` on every PR + every push to
# `main` + nightly cron. Fails on any HIGH-confidence detection.
# SARIF output is uploaded to GitHub Code Scanning so findings land
# in the Security tab alongside Trivy + CodeQL results.
#
# Why ANOTHER scanner on top of GitGuardian?
#
# README §security already recommends GitGuardian (an EXTERNAL,
# free-tier-friendly secrets monitor wired to the repo via app
# install). GitGuardian is a SaaS layer — it scans push events as
# they hit GitHub. `gitleaks` is the second, IN-REPO layer:
#
#   * Runs INSIDE CI on every PR (GitGuardian only scans pushed
#     branches; pre-merge gating requires running the scanner as a
#     workflow check).
#   * Pinned to a specific gitleaks release tag here, so the rules
#     engine cannot drift silently between PRs (GitGuardian's rule
#     set is vendor-controlled).
#   * SARIF → Code Scanning, so dependabot-style triage works.
#   * Defense-in-depth: a regression in either layer leaves the
#     other guarding the gate.
#
# Two layers, two failure modes — same `report and block` floor.
#
# Configuration: `.gitleaks.toml` at the repo root (if present)
# overrides the default rule set + allow-list. If absent, gitleaks
# uses its bundled default ruleset (~250 known secret shapes:
# AWS, GCP, Azure, GitHub, Stripe, OpenAI, Slack, etc.).

name: secrets-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly 03:00 UTC (22:00 CDT / 21:00 CST). Catches secrets that
    # might have been committed to long-lived branches not covered
    # by PR scans. Offset from container-scan.yml's 04:00 UTC so the
    # two security workflows don't pile on the same runner hour.
    - cron: "0 3 * * *"
  workflow_dispatch:

# Only one secrets-scan per ref at a time. PR refreshes cancel the
# prior in-flight scan — no stale-rerun queue.
concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required for upload-sarif → Code Scanning.
  security-events: write
  # Required to read the PR diff for the comment summary below.
  pull-requests: write

jobs:
  gitleaks:
    name: gitleaks scan (PR diff + full history on main)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan the entire commit graph
          # on main + cron runs. On PR runs it scans the diff range
          # only (gitleaks-action handles the range computation
          # automatically when given fetch-depth: 0).
          fetch-depth: 0

      - name: Run gitleaks
        # Pinned to a specific release tag. Bump as a coordinated
        # upgrade (review the changelog for new rules + any
        # behavioural shifts before bumping).
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Emit SARIF so the next step can upload to Code Scanning.
          # `GITLEAKS_ENABLE_COMMENTS=true` posts a PR review comment
          # on the leaking line for fast feedback.
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
          # No license key — gitleaks-action is free for public repos
          # and for orgs under 25 users. If we ever flip private +
          # >25 users, add `GITLEAKS_LICENSE` secret per the upstream
          # README. For now, the OSS path works.

      - name: Upload SARIF to GitHub Security
        # `if: always()` so SARIF lands even when gitleaks failed the
        # gate (action exits non-zero on finding). Reviewer can still
        # see what triggered the block via the Security tab.
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          # Distinct category so findings don't overlay Trivy's
          # `trivy-container-scan` / `trivy-image` in the Security tab.
          category: gitleaks

      - name: Step summary
        if: always()
        run: |
          {
            echo "## gitleaks secrets scan"
            echo ""
            echo "- Scanner: \`gitleaks-action@v2\` (HIGH-confidence default rule set)"
            echo "- SARIF: uploaded to Code Scanning under category \`gitleaks\`"
            echo "- Coexists with the README-recommended GitGuardian app (defense-in-depth)"
            echo ""
            echo "If a finding is a known false positive, add an entry to "
            echo "\`.gitleaks.toml\` \`[allowlist]\` (regex or commit-id) and re-push."
          } >> "$GITHUB_STEP_SUMMARY"
