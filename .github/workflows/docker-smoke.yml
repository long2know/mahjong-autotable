# Phase J Wave 4 — Apone (DevOps).
#
# Nightly Docker smoke test. Runs Vasquez's `tests/smoke/docker-build-smoke.sh`,
# which builds the multi-stage image from scratch, starts a container, polls
# `/health`, and asserts the four-field response shape (status / buildSha /
# uptime / version). Surfaces failures as build-log + container-log artifacts
# so the next person on rotation can pull the .log files instead of having to
# re-run the whole pipeline locally.
#
# Schedule rationale: 08:00 UTC = 03:00 CST (UTC-5, Stephen's typical TZ) /
# 04:00 CDT — early enough that a broken nightly is visible on his morning
# dashboard but late enough that any same-day main pushes have finished
# building.

name: docker-smoke

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Build + run + /health smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The smoke script is the canonical surface — same script Vasquez runs
      # locally, same one Apone runs as part of the Wave-3 release rehearsal.
      # We capture stdout + stderr to a file so the upload-artifact step has
      # something to attach when the step fails.
      - name: Run Docker build + /health smoke
        id: smoke
        run: |
          mkdir -p smoke-logs
          set -o pipefail
          tests/smoke/docker-build-smoke.sh 2>&1 | tee smoke-logs/smoke.log

      # Phase J Wave 8 (Apone) — exercise the anonymous identity surface
      # against the same image. The script can reuse the image built by
      # the first smoke step; since it cleans up after itself we let it
      # build a fresh one (its trap handles teardown).
      - name: Run auth-flow smoke
        id: auth-smoke
        run: |
          mkdir -p smoke-logs
          set -o pipefail
          tests/smoke/auth-flow-smoke.sh 2>&1 | tee smoke-logs/auth-smoke.log

      # Phase J Wave 9 (Apone) — chat round-trip smoke. Forward-compatible
      # against Bishop's POST /api/chat/send + GET /api/games/{id}/chat
      # surface: soft-passes (⏭) when the endpoints return 404, hardens
      # to a full assertion once both are live. See
      # tests/smoke/chat-flow-smoke.sh.
      - name: Run chat-flow smoke
        id: chat-smoke
        run: |
          mkdir -p smoke-logs
          set -o pipefail
          tests/smoke/chat-flow-smoke.sh 2>&1 | tee smoke-logs/chat-smoke.log

      # Phase J Wave 9 (Apone) — reconnect-token rotation smoke. Forward-
      # compatible against Bishop's /api/reconnect/* surface: soft-passes
      # (⏭) on 404, otherwise asserts mint → rotate → reuse-rejected.
      # See tests/smoke/token-rotation-smoke.sh.
      - name: Run token-rotation smoke
        id: token-smoke
        run: |
          mkdir -p smoke-logs
          set -o pipefail
          tests/smoke/token-rotation-smoke.sh 2>&1 | tee smoke-logs/token-smoke.log

      # Phase K Wave 3 (Apone) — JWT signing-key rotation smoke.
      # Asserts the fallback-key list behaviour documented in
      # docs/jwt-rotation.md (key0 active → rotate to key1 active +
      # key0 fallback → old token still validates, new tokens signed
      # by key1). Forward-compatible (soft-passes when Bishop's
      # /api/auth/{token,validate} surface returns 404 — Wave 4/5
      # lands the code-side binding). See
      # tests/smoke/jwt-rotation-smoke.sh.
      - name: Run jwt-rotation smoke
        id: jwt-rotation-smoke
        run: |
          mkdir -p smoke-logs
          set -o pipefail
          tests/smoke/jwt-rotation-smoke.sh 2>&1 | tee smoke-logs/jwt-rotation-smoke.log

      # Phase K Wave 3 (Apone) — PWA-asset presence gate. Builds the
      # production image once, then runs `ls` inside the image to
      # assert the three Wave-3 PWA artefacts (sw.js,
      # manifest.webmanifest, manifest-precache.json) all landed in
      # the runtime tree at /frontend/autotable/. This is a HARD
      # gate — if Hicks's Parcel post-build doesn't emit
      # manifest-precache.json, the smoke fails RED so the gap is
      # surfaced before publication rather than after a user reports
      # a broken offline experience. Coexists with pwa-smoke.yml
      # (which exercises the SW lifecycle in chromium); this gate
      # exists to catch the case where the SW JS shipped but the
      # precache manifest didn't (browser would silently install an
      # empty SW that controls no routes).
      - name: Build image for PWA-asset gate
        id: pwa-build
        run: |
          set -euo pipefail
          IMAGE_TAG="mahjong-pwa-asset-gate-${GITHUB_RUN_ID:-local}"
          docker build -t "$IMAGE_TAG" -q . >/dev/null
          echo "image=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: PWA-asset presence gate
        env:
          IMAGE: ${{ steps.pwa-build.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p smoke-logs
          docker run --rm --entrypoint sh "$IMAGE" -c \
              'ls -la /frontend/autotable/sw.js /frontend/autotable/manifest.webmanifest /frontend/autotable/manifest-precache.json' \
              2>&1 | tee smoke-logs/pwa-asset-gate.log || {
                  echo "❌ PWA assets missing in runtime image — Hicks's Parcel post-build is not emitting one of sw.js / manifest.webmanifest / manifest-precache.json into src/frontend/autotable/"
                  exit 1
              }
          echo "✅ PWA assets present in runtime image"

      # When the smoke fails, surface every log we have for triage: the
      # script's own combined output plus, if the script left a per-PID
      # `tests/smoke/.run-*` directory behind (it usually cleans up on
      # success but may not on hard fail), copy those in too.
      - name: Collect debug logs on failure
        if: failure()
        run: |
          mkdir -p smoke-logs
          cp -r tests/smoke/.run-* smoke-logs/ 2>/dev/null || true
          docker ps -a > smoke-logs/docker-ps.txt 2>&1 || true
          docker images > smoke-logs/docker-images.txt 2>&1 || true

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-failure-${{ github.run_id }}
          path: smoke-logs/
          if-no-files-found: warn
          retention-days: 14
