# Phase K Wave 2 — Apone (DevOps).
#
# PR-time multi-arch runtime gate. Builds the Docker image for BOTH
# linux/amd64 and linux/arm64, loads each into the local Docker daemon,
# runs the container with an explicit `--platform` pin, then curls
# `/health` and asserts a 200 + `"status":"healthy"` body shape.
#
# This is the PR-time companion to `multi-arch-smoke.yml` (which runs
# post-merge against the published image). Two workflows, two scopes:
#
#   - `multi-arch-runtime.yml` (THIS FILE) — runs on PRs, against an
#     image freshly built locally; catches arch-specific build /
#     runtime breakage BEFORE merge.
#   - `multi-arch-smoke.yml` (Wave 1) — runs on push to main, against
#     the published image at `ghcr.io/.../mahjong-autotable:main`;
#     catches publish-pipeline breakage.
#
# The PR comment is sticky (header: multi-arch-runtime) so reviewers
# see the matrix verdict directly in the PR conversation without
# clicking into Actions.

name: multi-arch-runtime

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "src/backend/**"
      - "src/frontend/autotable-src/**"
      - ".github/workflows/multi-arch-runtime.yml"
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "src/backend/**"
      - "src/frontend/autotable-src/**"
      - ".github/workflows/multi-arch-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: multi-arch-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-run:
    name: Build + run /health (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            host_port: 18091
            boot_timeout_s: 60
            arch_short: amd64
          - platform: linux/arm64
            host_port: 18092
            boot_timeout_s: 300
            arch_short: arm64
    outputs:
      result_amd64: ${{ steps.collect.outputs.result_amd64 }}
      result_arm64: ${{ steps.collect.outputs.result_arm64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image for ${{ matrix.platform }}
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch_short }}
        run: |
          set -euo pipefail
          # `--output type=docker` loads a single-platform image into the
          # local daemon so `docker run --platform=...` can launch it.
          # `--load` is intentionally NOT used — it errors out for
          # multi-platform builds; the explicit `type=docker` output is
          # the documented escape hatch and works per-arch.
          docker buildx build \
            --output type=docker \
            --platform "$PLATFORM" \
            --tag "mahjong-autotable:ci-${ARCH}" \
            .

      - name: Run container + curl /health for ${{ matrix.platform }}
        id: run
        env:
          PLATFORM: ${{ matrix.platform }}
          HOST_PORT: ${{ matrix.host_port }}
          BOOT_TIMEOUT_S: ${{ matrix.boot_timeout_s }}
          ARCH: ${{ matrix.arch_short }}
        run: |
          set -euo pipefail
          IMAGE="mahjong-autotable:ci-${ARCH}"
          CONTAINER="mahjong-autotable-runtime-${ARCH}"

          # The runtime image bakes ASPNETCORE_ENVIRONMENT=Production
          # (Dockerfile L101). Drake's Phase L prod-hardening
          # (JwtSigningKeyProvider.cs:121) aborts boot in Production
          # when Authentication:JwtSigningKeys[0] is empty. Mint a
          # per-run ephemeral HMAC key so the container actually starts.
          JWT_KEY="$(openssl rand -base64 48)"

          docker run -d --rm \
            --platform "$PLATFORM" \
            --name "$CONTAINER" \
            -p "${HOST_PORT}:8080" \
            -e Authentication__JwtSigningKeys__0="$JWT_KEY" \
            "$IMAGE"

          deadline=$(( $(date +%s) + BOOT_TIMEOUT_S ))
          status=""
          body=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if response=$(curl -fsS -m 5 "http://localhost:${HOST_PORT}/health" 2>/dev/null); then
              body="$response"
              status="ok"
              break
            fi
            sleep 2
          done

          docker logs "$CONTAINER" > "container-${ARCH}.log" 2>&1 || true
          docker stop "$CONTAINER" >/dev/null 2>&1 || true

          if [ "$status" != "ok" ]; then
            echo "::error::container for $PLATFORM did not return /health within ${BOOT_TIMEOUT_S}s"
            echo "result=FAIL (boot timeout)" >> "$GITHUB_OUTPUT"
            tail -n 40 "container-${ARCH}.log" >&2 || true
            exit 1
          fi

          if ! echo "$body" | grep -qE '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
            echo "::error::/health returned 200 but body did not match \"status\":\"healthy\""
            echo "got: $body"
            echo "result=FAIL (body mismatch)" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "✅ $PLATFORM /health OK (body: $body)"
          echo "result=PASS" >> "$GITHUB_OUTPUT"

      - name: Collect per-arch result for sticky comment
        id: collect
        if: always()
        env:
          ARCH: ${{ matrix.arch_short }}
          RESULT: ${{ steps.run.outputs.result }}
        run: |
          set -eu
          if [ -z "${RESULT:-}" ]; then
            RESULT="FAIL (build error)"
          fi
          echo "result_${ARCH}=${RESULT}" >> "$GITHUB_OUTPUT"

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: runtime-logs-${{ matrix.arch_short }}
          path: container-${{ matrix.arch_short }}.log
          if-no-files-found: ignore
          retention-days: 7

  comment:
    name: Sticky PR comment (matrix verdict)
    needs: build-and-run
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Compose comment body
        id: body
        env:
          RESULT_AMD64: ${{ needs.build-and-run.outputs.result_amd64 }}
          RESULT_ARM64: ${{ needs.build-and-run.outputs.result_arm64 }}
        run: |
          set -eu
          AMD="${RESULT_AMD64:-FAIL (job skipped)}"
          ARM="${RESULT_ARM64:-FAIL (job skipped)}"
          {
            echo "body<<EOF"
            echo "### Multi-arch runtime gate"
            echo
            echo "PR-time \`docker run --platform=… + curl /health\` verdict per architecture:"
            echo
            echo "| Architecture | Verdict |"
            echo "| --- | --- |"
            echo "| \`linux/amd64\` | ${AMD} |"
            echo "| \`linux/arm64\` | ${ARM} |"
            echo
            echo "_Workflow: \`.github/workflows/multi-arch-runtime.yml\`._"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post or update sticky comment
        uses: marocchino/sticky-pull-request-comment@331f8f5b4215f0445d3c07b4967662a32a2d3e31 # v2.9.0
        with:
          header: multi-arch-runtime
          message: ${{ steps.body.outputs.body }}
