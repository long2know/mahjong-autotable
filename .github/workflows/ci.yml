name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --force --detach FETCH_HEAD
      - name: Install .NET SDK (channel 10.0)
        run: |
          set -euo pipefail
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          "$HOME/.dotnet/dotnet" --info
      - name: Restore
        run: dotnet restore MahjongClaw.slnx
      - name: Build
        run: dotnet build MahjongClaw.slnx -c Release --no-restore
      - name: Rules correctness pass (Chinese Official)
        run: dotnet test MahjongClaw.slnx -c Release --no-build --verbosity normal --filter "FullyQualifiedName~MeldValidatorTests|FullyQualifiedName~RulesCorrectnessVectorsTests|FullyQualifiedName~ScoreCalculatorTests|FullyQualifiedName~RulesetHandAnalyzerTests"
      - name: Test
        run: dotnet test MahjongClaw.slnx -c Release --no-build --verbosity normal

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --force --detach FETCH_HEAD
      - name: Install .NET SDK (channel 10.0)
        run: |
          set -euo pipefail
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
      - name: Install Node.js 22
        run: |
          set -euo pipefail
          export NVM_DIR="$HOME/.nvm"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          source "$NVM_DIR/nvm.sh"
          nvm install 22
          nvm alias default 22
          NODE_BIN_DIR="$(dirname "$(nvm which 22)")"
          echo "$NODE_BIN_DIR" >> "$GITHUB_PATH"
          "$NODE_BIN_DIR/node" --version
          "$NODE_BIN_DIR/npm" --version
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run lobby-to-game smoke tests
        env:
          PLAYWRIGHT_SKIP_NPM_INSTALL: '1'
        run: ./scripts/run_playwright_smoke.sh
      - name: Dump smoke logs on failure
        if: failure()
        run: |
          set -euo pipefail
          if ls artifacts/playwright-smoke/*.log >/dev/null 2>&1; then
            for file in artifacts/playwright-smoke/*.log; do
              echo "===== ${file} ====="
              cat "${file}"
            done
          fi
          if [ -f playwright-report/index.html ]; then
            echo "Playwright report generated at playwright-report/index.html"
          fi
