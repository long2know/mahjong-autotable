name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true
      - name: Restore
        run: dotnet restore MahjongClaw.slnx
      - name: Build
        run: dotnet build MahjongClaw.slnx -c Release --no-restore
      - name: Rules correctness pass (Chinese Official)
        run: dotnet test MahjongClaw.slnx -c Release --no-build --verbosity normal --filter "FullyQualifiedName~MeldValidatorTests|FullyQualifiedName~RulesCorrectnessVectorsTests|FullyQualifiedName~ScoreCalculatorTests|FullyQualifiedName~RulesetHandAnalyzerTests"
      - name: Test
        run: dotnet test MahjongClaw.slnx -c Release --no-build --verbosity normal

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run lobby-to-game smoke tests
        env:
          PLAYWRIGHT_SKIP_NPM_INSTALL: '1'
        run: ./scripts/run_playwright_smoke.sh
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-smoke-logs
          path: artifacts/playwright-smoke/*.log
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
