name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MahjongClaw.slnx
      - name: Build
        run: dotnet build MahjongClaw.slnx -c Release --no-restore
      - name: Test
        run: dotnet test MahjongClaw.slnx -c Release --no-build --verbosity normal

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef
      - name: Run lobby-to-game smoke tests
        run: ./scripts/run_playwright_smoke.sh
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-logs
          path: artifacts/playwright-smoke/*.log
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
