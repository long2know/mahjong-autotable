# Phase J Wave 5 — Playwright E2E smoke against the production-style
# Docker image (Apone, DevOps). Pairs with .github/workflows/docker-build.yml
# (image publish) and .github/workflows/docker-smoke.yml (curl /health
# nightly). This workflow drives a real browser against the container so
# selector regressions in Hicks's lane surface before merge.
#
# Trigger matrix:
#   - push to main      → ensures main stays green
#   - pull_request → main → catches frontend / runtime regressions pre-merge
#   - workflow_dispatch → manual rerun for triage
#
# Selector contract: src/frontend/autotable-src/tests/selectors.md.
name: e2e-playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # General E2E runs single-worker (workers=1). Filtered topology:
    # 1026 discovered / 722 executed / 304 intentional project skips
    # (the 8 P0 real-UI tests are grep-inverted out here and pass
    # separately in playability-gate). Measured CI throughput is
    # ~10-12 executed tests/min (vs ~15.8 local), so a clean 722-test
    # run is ~60-72m of execution plus ~1m36 setup (~62-74m envelope).
    # At timeout-minutes=60, run 31576171218 canceled at ~573/722
    # (~79%) with zero headroom. Raised to 90 to clear the measured
    # envelope; the stateful tests must stay serial, so the fix is
    # budget, not parallelism.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/autotable-src/package-lock.json

      - name: Install Playwright + deps
        working-directory: src/frontend/autotable-src
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build Docker image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} -t mahjong-autotable:e2e .

      - name: Start container
        # The runtime image bakes ASPNETCORE_ENVIRONMENT=Production
        # (Dockerfile L101). Drake's Phase L prod-hardening
        # (JwtSigningKeyProvider.cs:121) refuses to boot in Production
        # when Authentication:JwtSigningKeys[0] is empty — without it
        # the .NET host crashes immediately, the port mapping tears
        # down, and `/health` becomes unreachable (see run 27174250123).
        # CI is the "operator" for ephemeral test containers, so we
        # mint a per-run random HMAC key. The key never leaves the
        # runner.
        run: |
          set -euo pipefail
          JWT_KEY="$(openssl rand -base64 48)"
          docker run -d --name mahjong-e2e -p 8080:8080 \
            -e BUILD_SHA=${{ github.sha }} \
            -e Authentication__JwtSigningKeys__0="$JWT_KEY" \
            mahjong-autotable:e2e

      - name: Wait for /health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "Health endpoint reachable after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Health endpoint never came up — dumping container logs"
          docker logs mahjong-e2e || true
          exit 1

      - name: Run Playwright smoke
        working-directory: src/frontend/autotable-src
        env:
          E2E_BASE_URL: http://localhost:8080/autotable/
        # The four P0 real-UI playability tests already run in the dedicated
        # `playability-gate` job (~12.6m); running them again here (x2 for
        # mobile-chrome) burns ~13m of this job's budget for no extra
        # coverage. Excluded by TITLE (not the `@playability-gate` tag,
        # which claim-key-collision.spec.ts also carries and must keep
        # running here).
        run: npm run e2e -- --grep-invert "P0 real-UI playability"

      - name: Tear down
        if: always()
        run: |
          docker logs mahjong-e2e || true
          docker stop mahjong-e2e || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-report
          path: src/frontend/autotable-src/playwright-report/
          retention-days: 14

  # ===========================================================================
  #  P0 REAL-UI PLAYABILITY GATE (#122, WP-F — Hudson)
  # ===========================================================================
  #  Drives a human-vs-bots Changsha game to real completion through actual
  #  DOM / canvas / pointer interactions and asserts the #game-complete-modal
  #  from a REAL Hu across 4 hands — NO WS backdoor (Lead C-8 contract;
  #  playtest-ws-backdoor SKILL:88-93). A content-hash PREFLIGHT enforces that
  #  the container serves the FRESHLY BUILT source bundle before any assertion.
  #
  #  REQUIRED CHECK: this is the playability acceptance keystone. It is
  #  SCAFFOLDED NOW and goes GREEN only after its dependencies land —
  #    #116 (per-hand manual deal ceremony),
  #    #119 (deterministic bundle-hash gate),
  #    #120 (P0 real-UI connect flow).
  #  Until then it FAILS HONESTLY at the first real blocker. Do NOT weaken the
  #  assertions or add test-only production bypasses to make HEAD pass; the PR
  #  stays a DRAFT until this is green after the dependencies merge.
  playability-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/autotable-src/package-lock.json

      - name: Install Playwright + deps
        working-directory: src/frontend/autotable-src
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Fresh source build → the on-disk src/frontend/autotable/ the preflight
      # diffs against. The Dockerfile rebuilds the SAME source with the SAME
      # node:20 + Vite, so the container serves byte-identical (content-hashed)
      # assets: preflight asserts served === freshly-built source.
      - name: Build frontend bundle (fresh source build for the hash preflight)
        working-directory: src/frontend/autotable-src
        run: npm run build

      - name: Build Docker image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} -t mahjong-autotable:playability .

      - name: Start container
        run: |
          set -euo pipefail
          JWT_KEY="$(openssl rand -base64 48)"
          docker run -d --name mahjong-playability -p 8080:8080 \
            -e BUILD_SHA=${{ github.sha }} \
            -e Authentication__JwtSigningKeys__0="$JWT_KEY" \
            mahjong-autotable:playability

      - name: Wait for /health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "Health endpoint reachable after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Health endpoint never came up — dumping container logs"
          docker logs mahjong-playability || true
          exit 1

      - name: Run P0 playability gate (real DOM/canvas only)
        working-directory: src/frontend/autotable-src
        env:
          E2E_BASE_URL: http://localhost:8080/autotable/
        run: npm run e2e -- --project=chromium playability-gate.spec.ts

      - name: Tear down
        if: always()
        run: |
          docker logs mahjong-playability || true
          docker stop mahjong-playability || true

      - name: Upload playability evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playability-gate-evidence
          path: |
            src/frontend/autotable-src/playwright-report/
            playtest-artifacts/playability-gate/
          retention-days: 14
