# Phase J Wave 5 — Playwright E2E smoke against the production-style
# Docker image (Apone, DevOps). Pairs with .github/workflows/docker-build.yml
# (image publish) and .github/workflows/docker-smoke.yml (curl /health
# nightly). This workflow drives a real browser against the container so
# selector regressions in Hicks's lane surface before merge.
#
# Trigger matrix:
#   - push to main      → ensures main stays green
#   - pull_request → main → catches frontend / runtime regressions pre-merge
#   - workflow_dispatch → manual rerun for triage
#
# Selector contract: src/frontend/autotable-src/tests/selectors.md.
name: e2e-playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # 474-test suite runs on a single worker; the legacy 30-min cap
    # was sized for a smaller suite and now hard-times out the run.
    # Bumped to 60 to give the smoke set headroom; tracked as a
    # standalone follow-up to investigate worker-parallelism.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/autotable-src/package-lock.json

      - name: Install Playwright + deps
        working-directory: src/frontend/autotable-src
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build Docker image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} -t mahjong-autotable:e2e .

      - name: Start container
        # The runtime image bakes ASPNETCORE_ENVIRONMENT=Production
        # (Dockerfile L101). Drake's Phase L prod-hardening
        # (JwtSigningKeyProvider.cs:121) refuses to boot in Production
        # when Authentication:JwtSigningKeys[0] is empty — without it
        # the .NET host crashes immediately, the port mapping tears
        # down, and `/health` becomes unreachable (see run 27174250123).
        # CI is the "operator" for ephemeral test containers, so we
        # mint a per-run random HMAC key. The key never leaves the
        # runner.
        run: |
          set -euo pipefail
          JWT_KEY="$(openssl rand -base64 48)"
          docker run -d --name mahjong-e2e -p 8080:8080 \
            -e BUILD_SHA=${{ github.sha }} \
            -e Authentication__JwtSigningKeys__0="$JWT_KEY" \
            mahjong-autotable:e2e

      - name: Wait for /health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "Health endpoint reachable after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Health endpoint never came up — dumping container logs"
          docker logs mahjong-e2e || true
          exit 1

      - name: Run Playwright smoke
        working-directory: src/frontend/autotable-src
        env:
          E2E_BASE_URL: http://localhost:8080/autotable/
        run: npm run e2e

      - name: Tear down
        if: always()
        run: |
          docker logs mahjong-e2e || true
          docker stop mahjong-e2e || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-report
          path: src/frontend/autotable-src/playwright-report/
          retention-days: 14
