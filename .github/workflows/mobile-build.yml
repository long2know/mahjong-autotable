# Phase K Wave 2 — Apone (DevOps).
#
# Capacitor mobile shell — iOS + Android CI build.
#
# Architecture:
#   1. `build-frontend-bundle` (shared) — rebuilds the web bundle the
#      Capacitor shell wraps. Single source of truth for the JS/CSS
#      that ends up inside both the .ipa and the .aab.
#   2. `android` (ubuntu) — `gradlew assembleRelease` + `bundleRelease`.
#      No signing identity in CI; produces UNSIGNED artefacts.
#   3. `ios`     (macos)  — `xcodebuild -configuration Release
#      -sdk iphoneos CODE_SIGNING_ALLOWED=NO`. Produces UNSIGNED .app.
#   4. `release` (push to main only) — creates a `mobile-<run_number>`
#      GitHub prerelease with both unsigned artefacts attached.
#
# Signing identities (operator-only): iOS distribution cert +
# provisioning profile in `secrets.IOS_*`; Android keystore +
# passwords in `secrets.ANDROID_*`. CI soft-fails to unsigned
# artefacts when secrets are absent. App-store submission (TestFlight,
# Play Internal) is manual operator action in Phase K — auto-promotion
# is a Phase L scope.

name: mobile-build

on:
  pull_request:
    paths:
      - "mobile/**"
      - "src/frontend/autotable-src/**"
      - ".github/workflows/mobile-build.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "src/frontend/autotable-src/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend-bundle:
    name: Build web bundle (wrapped by Capacitor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/autotable-src/package-lock.json

      - name: npm ci + build
        working-directory: src/frontend/autotable-src
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Upload bundle artefact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: web-bundle
          path: src/frontend/autotable/
          retention-days: 14

  android:
    name: Android (gradlew assembleRelease)
    needs: build-frontend-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Phase K Wave 17 — Apone (DevOps). Android signing groundwork.
    # The secret-presence test below toggles the build between
    # SIGNED-RELEASE and UNSIGNED-RELEASE paths. The four
    # ANDROID_* secrets are operator-provisioned per
    # `docs/mobile-android-signing.md`; PRs from forks (and any
    # main-push before Stephen lands the keystore) take the
    # legacy UNSIGNED-RELEASE path, exactly as W2 + W16. The
    # signed path is purely additive — when the secrets are
    # absent, the workflow's behaviour is byte-identical to W16.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download web bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: web-bundle
          path: src/frontend/autotable/

      - name: Set up JDK 17
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install Capacitor + add Android platform
        working-directory: mobile
        run: |
          set -euo pipefail
          npm install
          npx cap add android || echo "android platform may already exist"
          npx cap sync android

      # Phase K Wave 17 — Apone (DevOps). Decode keystore from
      # base64 secret (when present) into a runner-local file the
      # Gradle signing config can consume. The keystore is
      # written to ${RUNNER_TEMP} so it never lands in the
      # repo working-tree, and the file is deleted by GitHub at
      # job teardown when ${RUNNER_TEMP} is cleaned. We deliberately
      # do NOT print the keystore size / SHA — that would leak a
      # fingerprint of the operator's signing identity into the
      # job logs.
      - name: Decode Android keystore (when secret present)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ env.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/mahjong-autotable.keystore"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            chmod 0600 "$KEYSTORE_PATH"
            echo "keystore-present=true" >> "$GITHUB_OUTPUT"
            echo "keystore-path=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"
            echo "::notice::Android keystore decoded — SIGNED-RELEASE path will run"
          else
            echo "keystore-present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 absent — UNSIGNED-RELEASE path will run (W16 behaviour)"
          fi

      # SIGNED-RELEASE — gated on the four ANDROID_* secrets being
      # provisioned (the keystore base64 + its password + the key
      # alias + the key password). `assembleRelease` produces the
      # APK; `bundleRelease` produces the AAB the Play Store
      # consumes. Both artefacts are signed with the operator-
      # supplied identity per `docs/mobile-android-signing.md §3`.
      - name: Gradle assembleRelease + bundleRelease (SIGNED)
        if: steps.keystore.outputs.keystore-present == 'true'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore-path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            "-Pandroid.injected.signing.store.file=${ANDROID_KEYSTORE_PATH}" \
            "-Pandroid.injected.signing.store.password=${ANDROID_KEYSTORE_PASSWORD}" \
            "-Pandroid.injected.signing.key.alias=${ANDROID_KEY_ALIAS}" \
            "-Pandroid.injected.signing.key.password=${ANDROID_KEY_PASSWORD}" \
            -x lint

      # UNSIGNED-RELEASE — legacy path preserved for PRs from forks
      # and for any main-push before Stephen lands the keystore.
      # Byte-identical to the W2 + W16 build invocation.
      - name: Gradle assembleRelease + bundleRelease (UNSIGNED)
        if: steps.keystore.outputs.keystore-present != 'true'
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file= \
            -Pandroid.injected.signing.store.password= \
            -Pandroid.injected.signing.key.alias= \
            -Pandroid.injected.signing.key.password= \
            -x lint

      - name: Upload Android artefacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: android-artefacts
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

  # Phase K Wave 19 — Apone (DevOps). Android E2E smoke test
  # for the SIGNED-RELEASE branch. The W17 SIGNED groundwork +
  # the W18 iOS mirror established the signing surface; W19
  # adds an E2E smoke that boots an Android emulator via
  # `reactivecircus/android-emulator-runner`, installs the
  # SIGNED APK, launches the app, navigates to the home
  # screen, and captures a screenshot. The job is GATED on
  # the four ANDROID_* secrets being present — when the
  # SIGNED branch did not run (UNSIGNED legacy path), the
  # E2E job skips gracefully via the `needs.android.outputs.
  # signed-path-ran` gate the SIGNED step now surfaces.
  #
  # Why a separate job (not inline in the `android` job)?
  #
  #   * `reactivecircus/android-emulator-runner` requires
  #     hardware acceleration (KVM) and `runs-on: ubuntu-
  #     latest-large` for a reasonable boot time. Forcing
  #     the build job onto a large runner just to host the
  #     emulator would 4x the credit burn for every PR.
  #
  #   * The E2E job consumes the APK as an artefact, so it
  #     can run on a different runner class than the build
  #     job (the W7 docker-smoke pattern). The build job
  #     stays on `ubuntu-latest`; only the E2E hosts an
  #     emulator on the large runner.
  #
  #   * Graceful skip — when secrets are absent OR the
  #     android job skipped the SIGNED branch, the E2E job
  #     short-circuits via its first step (no emulator boot,
  #     no large-runner credit burn).
  #
  # Reference: docs/mobile-android-e2e.md.
  android-e2e:
    name: Android E2E smoke (SIGNED only)
    needs: [build-frontend-bundle, android]
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 45
    # Run on push-to-main and on workflow_dispatch only. PR
    # runs would 4x the credit burn per push; the SIGNED
    # branch only runs when the operator secrets are present
    # (typically only on main / workflow_dispatch).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Skip if SIGNED secrets absent
        id: gate
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 absent — E2E smoke skipped (UNSIGNED legacy path)"
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SIGNED branch detected — Android E2E smoke will run"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.should-run == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download SIGNED APK artefact
        if: steps.gate.outputs.should-run == 'true'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: android-artefacts
          path: artefacts/android/

      - name: Locate SIGNED APK
        id: apk
        if: steps.gate.outputs.should-run == 'true'
        run: |
          set -euo pipefail
          APK_PATH="$(find artefacts/android -name '*release*.apk' | head -1)"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No release APK found in artefacts/android/"
            exit 1
          fi
          echo "apk-path=${APK_PATH}" >> "$GITHUB_OUTPUT"
          echo "::notice::E2E target APK: ${APK_PATH}"

      - name: Enable KVM acceleration
        if: steps.gate.outputs.should-run == 'true'
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache key
        id: avd-cache-key
        if: steps.gate.outputs.should-run == 'true'
        run: |
          echo "key=avd-api-34-default-x86_64-v1" >> "$GITHUB_OUTPUT"

      - name: Cache AVD
        if: steps.gate.outputs.should-run == 'true'
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache-key.outputs.key }}

      - name: Create AVD + warm-boot snapshot
        if: steps.gate.outputs.should-run == 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD warm-boot snapshot created."

      - name: Boot emulator + run E2E smoke
        if: steps.gate.outputs.should-run == 'true'
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        env:
          APK_PATH: ${{ steps.apk.outputs.apk-path }}
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            echo "===== Pre-install device state ====="
            adb devices

            echo "===== Install SIGNED APK ====="
            adb install -r "$APK_PATH"

            echo "===== Resolve package id ====="
            PACKAGE_ID="$(aapt dump badging "$APK_PATH" | awk -F"'" '/^package: name=/ {print $2; exit}')"
            if [ -z "$PACKAGE_ID" ]; then
              echo "::error::Failed to resolve package id from APK"
              exit 1
            fi
            echo "Package: $PACKAGE_ID"

            echo "===== Launch app ====="
            adb shell monkey -p "$PACKAGE_ID" -c android.intent.category.LAUNCHER 1
            # Allow the Capacitor WebView + the autotable PWA
            # bundle to mount. The W7 PWA cold-start budget is
            # ~3 s; 15 s gives plenty of headroom for the
            # emulator's slower clock.
            sleep 15

            echo "===== Smoke: app process alive ====="
            ALIVE="$(adb shell pidof "$PACKAGE_ID" || echo '')"
            if [ -z "$ALIVE" ]; then
              echo "::error::App process not running after launch"
              adb logcat -d -t 200 | tail -200
              exit 1
            fi
            echo "App pid: $ALIVE"

            echo "===== Smoke: navigate via back-button + screenshot ====="
            adb shell input keyevent KEYCODE_BACK || true
            sleep 2
            mkdir -p e2e-output
            adb exec-out screencap -p > e2e-output/home-screen.png
            BYTES="$(wc -c < e2e-output/home-screen.png)"
            if [ "$BYTES" -lt 1024 ]; then
              echo "::error::Screenshot suspiciously small ($BYTES bytes) — emulator GPU likely failed"
              exit 1
            fi
            echo "Screenshot: $BYTES bytes captured"

            echo "===== Smoke: collect last 200 logcat lines ====="
            adb logcat -d -t 200 > e2e-output/logcat-tail.txt || true

            echo "===== E2E smoke PASSED ====="

      - name: Upload E2E artefacts
        if: steps.gate.outputs.should-run == 'true' && (success() || failure())
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: android-e2e-artefacts
          path: e2e-output/
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: iOS (xcodebuild Release)
    needs: build-frontend-bundle
    runs-on: macos-latest
    timeout-minutes: 45
    # Phase K Wave 18 — Apone (DevOps). iOS signing groundwork
    # mirrors the W17 Android pattern. The four `IOS_*` secrets
    # are operator-provisioned per `docs/mobile-ios-signing.md`
    # (Apple Developer enrolment runbook). CI soft-fails to
    # UNSIGNED .app when secrets are absent — preserves the
    # W2 → W17 behaviour for PRs from forks and for main-pushes
    # before Stephen lands the iOS distribution identity.
    env:
      IOS_DEV_CERT_BASE64: ${{ secrets.IOS_DEV_CERT_BASE64 }}
      IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download web bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: web-bundle
          path: src/frontend/autotable/

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install Capacitor + add iOS platform
        working-directory: mobile
        run: |
          set -euo pipefail
          npm install
          npx cap add ios || echo "ios platform may already exist"
          npx cap sync ios

      # Phase K Wave 18 — Apone (DevOps). Decode the operator's
      # Apple Developer distribution cert + provisioning profile
      # from base64 secrets (when present) into a temporary
      # keychain the xcodebuild signing flow consumes. The
      # keychain is created with a random per-job lock password,
      # added to the user's keychain search list, set as default,
      # and unlocked for the build's duration. The keychain file
      # itself lives under ${RUNNER_TEMP} so it is cleaned by
      # GitHub at job teardown; we deliberately do NOT print
      # the cert SHA / profile UUID — that would leak a finger-
      # print of the operator's signing identity into job logs.
      # See `docs/mobile-ios-signing.md §3` for the secret-
      # provisioning runbook.
      - name: Decode iOS signing identity (when secrets present)
        id: ios-keychain
        run: |
          set -euo pipefail
          if [ -n "${IOS_DEV_CERT_BASE64:-}" ] \
             && [ -n "${IOS_DEV_CERT_PASSWORD:-}" ] \
             && [ -n "${IOS_PROVISIONING_PROFILE_BASE64:-}" ] \
             && [ -n "${IOS_KEYCHAIN_PASSWORD:-}" ]; then
            CERT_PATH="${RUNNER_TEMP}/mahjong-autotable.p12"
            PROFILE_PATH="${RUNNER_TEMP}/mahjong-autotable.mobileprovision"
            KEYCHAIN_PATH="${RUNNER_TEMP}/mahjong-autotable-signing.keychain-db"

            echo "$IOS_DEV_CERT_BASE64" | base64 --decode > "$CERT_PATH"
            chmod 0600 "$CERT_PATH"
            echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
            chmod 0600 "$PROFILE_PATH"

            security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" \
              -P "$IOS_DEV_CERT_PASSWORD" \
              -A -t cert -f pkcs12 \
              -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | sed -e s/\"//g)
            security set-key-partition-list \
              -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" \
              "$KEYCHAIN_PATH" > /dev/null

            PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
            mkdir -p "$PROFILES_DIR"
            cp "$PROFILE_PATH" "$PROFILES_DIR/mahjong-autotable.mobileprovision"

            echo "keychain-present=true" >> "$GITHUB_OUTPUT"
            echo "keychain-path=${KEYCHAIN_PATH}" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS keychain decoded — SIGNED-RELEASE path will run"
          else
            echo "keychain-present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::One or more IOS_* secrets absent — UNSIGNED-RELEASE path will run (W17 behaviour)"
          fi

      # SIGNED-RELEASE — gated on the four IOS_* secrets being
      # provisioned (the .p12 base64 + its password + the
      # provisioning profile base64 + the keychain lock password).
      # The signing identity + profile are auto-detected from the
      # temporary keychain populated in the previous step.
      - name: xcodebuild Release (SIGNED)
        if: steps.ios-keychain.outputs.keychain-present == 'true'
        working-directory: mobile/ios/App
        run: |
          set -euo pipefail
          pod install --repo-update
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            ONLY_ACTIVE_ARCH=NO

      # UNSIGNED-RELEASE — legacy path preserved for PRs from
      # forks and for any main-push before Stephen lands the iOS
      # signing identity. Byte-identical to the W2 + W17 build
      # invocation.
      - name: xcodebuild Release (UNSIGNED)
        if: steps.ios-keychain.outputs.keychain-present != 'true'
        working-directory: mobile/ios/App
        run: |
          set -euo pipefail
          # Install pods (Capacitor 6 still uses CocoaPods for iOS).
          pod install --repo-update

          # Build for the device — `CODE_SIGNING_ALLOWED=NO` lets us
          # skip Apple Developer Program enrolment until the operator
          # provisions a real distribution identity.
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      # Phase K Wave 18 — Apone (DevOps). Delete the temporary
      # signing keychain at job teardown — this runs `if: always()`
      # so a build failure does NOT leak the cert into the runner's
      # next reused job (macOS runner state lifetime is per-job, but
      # the explicit delete is defensive). The provisioning profile
      # under $HOME/Library/MobileDevice/Provisioning Profiles is
      # cleaned by GitHub at job teardown alongside $RUNNER_TEMP.
      - name: Tear down iOS keychain
        if: always() && steps.ios-keychain.outputs.keychain-present == 'true'
        run: |
          set +e
          security delete-keychain "${{ steps.ios-keychain.outputs.keychain-path }}" || true
          rm -f "${RUNNER_TEMP}/mahjong-autotable.p12" || true
          rm -f "${RUNNER_TEMP}/mahjong-autotable.mobileprovision" || true

      - name: Upload iOS artefacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ios-artefacts
          path: mobile/ios/App/build/Build/Products/Release-iphoneos/App.app
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Mobile prerelease (main only)
    needs: [android, android-e2e, ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Android artefacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: android-artefacts
          path: artefacts/android/

      - name: Download iOS artefacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ios-artefacts
          path: artefacts/ios/

      - name: Bundle iOS .app for attach
        run: |
          set -euo pipefail
          cd artefacts/ios
          if [ -d App.app ]; then
            zip -r App-unsigned.zip App.app
            rm -rf App.app
          fi

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: mobile-${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --prerelease \
            --title "Mobile build $TAG (unsigned)" \
