# Phase K Wave 5 — Apone (DevOps).
#
# One-time / on-demand retroactive secrets-history sweep.
#
# `secrets-scan.yml` (Wave 4) scans the PR diff + the latest `main`
# commit on every PR / push / nightly cron. That covers FORWARD
# motion (a leak about to be merged) but does NOT cover the
# accumulated history of every commit ever pushed to this repo
# back to the autotable fork. A pre-existing leak that landed in
# 2024 and has been sitting in `git log` for two years would be
# completely invisible to the W4 workflow.
#
# This sweep workflow fills that gap. It runs `gitleaks detect`
# with `--no-git` disabled (full commit-graph scan), uploads the
# SARIF to GitHub Code Scanning under a SEPARATE category
# (`secrets-history-sweep`) so findings don't overlay the W4
# `gitleaks` category, and uploads the raw SARIF as a workflow
# artefact so an operator can grep through it offline.
#
# `workflow_dispatch` ONLY — this is deliberately NOT on `pull_request`
# / `push` / `schedule`. Rationale:
#
#   * The scan walks the FULL commit graph (`fetch-depth: 0` plus
#     no diff range) → minutes to tens of minutes runtime on a
#     mature repo. Running on every PR would burn runner minutes
#     re-scanning history that has not changed.
#   * Findings on historical commits typically require a
#     ROTATION-then-tag-purge response (see the runbook below) —
#     a non-trivial operator action that should ALWAYS be
#     intentional, never accidental.
#   * The W4 workflow already covers forward motion + nightly
#     drift detection. The sweep is a quarterly / post-incident
#     gate, not a per-PR gate.
#
# Operator runbook: `docs/secrets-scanning.md` §3.

name: secrets-history-sweep

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to scan from (default: full default-branch history)."
        required: false
        default: "main"
      severity-floor:
        description: "Minimum gitleaks severity to fail the workflow (HIGH only matches the W4 default)."
        required: false
        default: "HIGH"
        type: choice
        options:
          - HIGH
          - MEDIUM
          - LOW

permissions:
  contents: read
  # upload-sarif → Code Scanning.
  security-events: write

jobs:
  history-sweep:
    name: Retroactive gitleaks scan over full commit graph
    runs-on: ubuntu-latest
    # Long timeout — the scan is necessarily linear in commit count.
    # If the run hits this ceiling, switch to a per-year shard
    # by passing a tag / SHA to the `ref:` input.
    timeout-minutes: 120
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Full commit graph. Required so gitleaks can scan every
          # ancestor commit, not just the tip.
          fetch-depth: 0
          # We need objects, not just refs; no shallow clone here.
          filter: ""

      - name: Install gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks detect over full history
        # `--no-git` is NOT set — gitleaks walks the commit graph.
        # `--source .` scans the working tree + history.
        # `--report-format sarif` aligns with the Code Scanning
        # upload step below.
        # `--exit-code 0` means we DO NOT fail this job on findings
        # — the SARIF upload to Code Scanning IS the signal. A
        # failing exit would block the workflow_dispatch run AND
        # the post-step SARIF upload (which runs only if-always
        # but better to keep the run green so operators can re-run
        # without first acknowledging stale findings).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gitleaks detect \
              --source . \
              --report-format sarif \
              --report-path gitleaks-history.sarif \
              --no-banner \
              --exit-code 0 \
              --verbose | tee gitleaks-history.log
          echo "---"
          echo "SARIF results summary:"
          jq '[.runs[].results | length] | add // 0' gitleaks-history.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-history.sarif
          # Distinct category so findings don't overlay W4's
          # `gitleaks` category in the Security tab. Operators
          # can filter by category in the GH UI.
          category: secrets-history-sweep

      - name: Upload SARIF + log as workflow artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-sweep-${{ github.run_id }}
          path: |
            gitleaks-history.sarif
            gitleaks-history.log
          retention-days: 90
          if-no-files-found: warn

      - name: Step summary
        if: always()
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          count=$(jq '[.runs[].results | length] | add // 0' gitleaks-history.sarif 2>/dev/null || echo 0)
          {
            echo "## gitleaks history sweep"
            echo ""
            echo "- Scanned ref: \`${REF}\`"
            echo "- Findings: **${count}**"
            echo "- SARIF: uploaded to Code Scanning under category \`secrets-history-sweep\`"
            echo "- Artefact: \`gitleaks-history-sweep-${{ github.run_id }}\` (SARIF + log, 90-day retention)"
            echo ""
            if [ "${count}" != "0" ]; then
              echo "**Findings present.** Open the Security tab → Code Scanning →"
              echo "filter by category \`secrets-history-sweep\`. Follow the"
              echo "remediation runbook in \`docs/secrets-scanning.md\` §3"
              echo "(rotate the secret FIRST, then force-push the cleanup tag —"
              echo "never the other order)."
            else
              echo "No HIGH-confidence historical leaks detected. Re-run"
              echo "quarterly or after any cross-organisation merge."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
