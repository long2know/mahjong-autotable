# Phase K Wave 5 — Apone (DevOps).
#
# HSTS preload-submission readiness gate.
#
# `infra/k8s/overlays/prod/hsts-patch.yaml` (Wave 4) ships the
# preload-eligible `Strict-Transport-Security` header at the
# Ingress layer. `docs/hsts-preload.md` (Wave 4) documents the
# manual operator submission procedure at https://hstspreload.org/.
#
# Wave-5 closes the remaining gap: an automated daily probe that
# CONFIRMS the production origin is STILL emitting a preload-
# eligible header. The probe is what catches a regression BEFORE
# Stephen submits to the chromium list (during the 14-day
# pre-submission dry-run) AND after submission (so a future
# refactor that weakens the header is alerted within 24 hours,
# not after the next user complaint).
#
# Pipeline shape:
#
#   1. `curl -I https://mahjong.example.com/` against the prod origin.
#   2. Assert the response includes exactly:
#        Strict-Transport-Security: max-age=63072000; includeSubDomains; preload
#      (the hstspreload.org-recommended floor; matches the Ingress
#      annotation in `overlays/prod/hsts-patch.yaml`).
#   3. On failure, open / update a sticky issue with the failing
#      header value + the run URL so the regression is visible
#      in the issue tracker, not just buried in workflow logs.
#   4. On pass, close the sticky issue (if open) so the dashboard
#      reads "all clear".
#
# Triggers:
#
#   * `schedule:` daily at 13:00 UTC (08:00 CDT / 09:00 EDT). Lands
#     just before North-American working hours so the on-call
#     sees the result before the day starts.
#   * `workflow_dispatch:` for on-demand probes (e.g. after an
#     Ingress edit, before submitting to https://hstspreload.org/).
#
# Operator runbook: `docs/hsts-preload.md` §3.

name: hsts-readiness-check

on:
  schedule:
    # Daily 13:00 UTC. Offset from secrets-scan (03:00 UTC) +
    # container-scan (04:00 UTC) + sbom (Mon 09:00 UTC) so the
    # daily-cadence security workflows don't bunch on the same
    # runner hour.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "URL to probe (defaults to repo variable HSTS_PROBE_URL or https://mahjong.example.com)"
        required: false
        default: ""
      open-issue-on-failure:
        description: "Open/update a sticky issue on failure (default true)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  # Open / update / close the sticky issue.
  issues: write

# Only one probe at a time. The cron + a manual workflow_dispatch
# trying to fire simultaneously would race on issue updates.
concurrency:
  group: hsts-readiness-check
  cancel-in-progress: false

env:
  # The header value the prod ingress emits (must match
  # `overlays/prod/hsts-patch.yaml`). Pinned EXACTLY — even a
  # whitespace-difference between Ingress emission and the asserted
  # value is a header regression worth flagging (some upstream
  # proxies normalise whitespace; we want to know if that changes).
  EXPECTED_HSTS: "max-age=63072000; includeSubDomains; preload"
  # Sticky-issue title — match exactly so subsequent runs find +
  # update the same issue rather than opening duplicates.
  ISSUE_TITLE: "HSTS readiness: production header missing the preload directive"

jobs:
  probe:
    name: Probe prod origin + assert HSTS preload header
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.assert.outputs.status }}
      url: ${{ steps.resolve.outputs.url }}
      header: ${{ steps.probe.outputs.header }}
    steps:
      - name: Resolve probe URL
        id: resolve
        env:
          INPUT_URL: ${{ inputs.url }}
          VAR_URL: ${{ vars.HSTS_PROBE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_URL}" ]; then
            url="${INPUT_URL}"
          elif [ -n "${VAR_URL}" ]; then
            url="${VAR_URL}"
          else
            url="https://mahjong.example.com/"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Probing: ${url}"

      - name: HEAD request + extract Strict-Transport-Security header
        id: probe
        env:
          URL: ${{ steps.resolve.outputs.url }}
        run: |
          set -euo pipefail
          # `--silent` suppresses progress; `--show-error` re-enables
          # error output on failure; `-I` does a HEAD request; `--max-time 30`
          # avoids the workflow hanging on a stuck origin.
          headers=$(curl --silent --show-error --max-time 30 \
                        --location \
                        -I "${URL}" 2>&1 || true)
          echo "${headers}" | tee curl-response.txt

          # Header names are case-insensitive per RFC 7230 § 3.2;
          # match with `-i`. `awk` extracts the value side; `tr` strips
          # CR (Windows line endings from some upstreams).
          hsts=$(echo "${headers}" | grep -i '^strict-transport-security:' | head -n1 | \
                  awk -F': *' '{ print $2 }' | tr -d '\r')

          {
            echo "header<<EOF"
            echo "${hsts}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -z "${hsts}" ]; then
            echo "::warning::No Strict-Transport-Security header in response"
          else
            echo "Observed: Strict-Transport-Security: ${hsts}"
          fi

      - name: Assert header matches expected preload value
        id: assert
        env:
          OBSERVED: ${{ steps.probe.outputs.header }}
          EXPECTED: ${{ env.EXPECTED_HSTS }}
        run: |
          set -euo pipefail
          if [ "${OBSERVED}" = "${EXPECTED}" ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "::notice::HSTS header matches preload-eligible value exactly"
            exit 0
          fi
          echo "status=fail" >> "$GITHUB_OUTPUT"
          echo "::error::HSTS header MISMATCH"
          echo "::error::Expected: ${EXPECTED}"
          echo "::error::Observed: ${OBSERVED:-<missing>}"
          # Don't exit non-zero here — we still want the sticky-issue
          # job below to run. The final job re-asserts and fails the
          # workflow if the status output is `fail`.

      - name: Step summary
        if: always()
        env:
          STATUS: ${{ steps.assert.outputs.status }}
          URL: ${{ steps.resolve.outputs.url }}
          OBSERVED: ${{ steps.probe.outputs.header }}
          EXPECTED: ${{ env.EXPECTED_HSTS }}
        run: |
          icon="❌"
          [ "${STATUS}" = "pass" ] && icon="✅"
          {
            echo "## ${icon} HSTS readiness check"
            echo ""
            echo "- URL: \`${URL}\`"
            echo "- Expected: \`${EXPECTED}\`"
            echo "- Observed: \`${OBSERVED:-<missing>}\`"
            echo "- Result: **${STATUS}**"
            echo ""
            echo "Operator runbook: [\`docs/hsts-preload.md\`](../blob/main/docs/hsts-preload.md) §3."
          } >> "$GITHUB_STEP_SUMMARY"

  update-sticky-issue:
    name: Open / update / close sticky issue
    needs: probe
    if: always() && inputs.open-issue-on-failure != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open / update / close sticky issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          STATUS: ${{ needs.probe.outputs.status }}
          URL: ${{ needs.probe.outputs.url }}
          OBSERVED: ${{ needs.probe.outputs.header }}
          EXPECTED: ${{ env.EXPECTED_HSTS }}
          ISSUE_TITLE: ${{ env.ISSUE_TITLE }}
        with:
          script: |
            const { STATUS, URL, OBSERVED, EXPECTED, ISSUE_TITLE } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Find any existing sticky issue (open or closed).
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${ISSUE_TITLE}"`,
            });
            const sticky = existing.data.items.find(i => i.title === ISSUE_TITLE);

            if (STATUS === 'pass') {
              if (sticky && sticky.state === 'open') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: sticky.number,
                  body: `✅ HSTS readiness recovered. URL: \`${URL}\`. Observed header matches expected: \`${EXPECTED}\`. Run: ${runUrl}. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: sticky.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`Closed sticky issue #${sticky.number}`);
              } else {
                core.info('No open sticky issue; pass is the steady state — nothing to do.');
              }
              return;
            }

            // STATUS === 'fail'. Open a new issue or update existing.
            const body = [
              `🚨 The production HSTS readiness probe failed.`,
              ``,
              `- **URL probed:** \`${URL}\``,
              `- **Expected header:** \`Strict-Transport-Security: ${EXPECTED}\``,
              `- **Observed header:** \`${OBSERVED ? `Strict-Transport-Security: ${OBSERVED}` : '<missing>'}\``,
              `- **Workflow run:** ${runUrl}`,
              ``,
              `## Why this matters`,
              ``,
              `The header drift could mean:`,
              ``,
              `1. **Ingress regression** — \`infra/k8s/overlays/prod/hsts-patch.yaml\` may have been edited; the \`configuration-snippet\` annotation may have lost the \`preload\` directive or shortened \`max-age\`.`,
              `2. **nginx-ingress controller bug** — a controller upgrade may have changed how \`configuration-snippet\` annotations compose with other HSTS-emitting middleware.`,
              `3. **Upstream proxy injection** — a Cloudflare / Fastly / similar layer in front of the ingress may be rewriting or stripping the header.`,
              `4. **Pre-submission** — if Stephen has NOT yet submitted to https://hstspreload.org/, this is a blocker for submission. See [\`docs/hsts-preload.md\` §3](../blob/main/docs/hsts-preload.md).`,
              `5. **Post-submission** — if the domain IS on the chromium preload list, this is a 6-week-to-undo problem. ESCALATE — the in-process header is the backstop while the preload-list removal request goes through.`,
              ``,
              `## Triage steps`,
              ``,
              `1. \`curl -I ${URL}\` from your laptop to confirm the failure is reproducible.`,
              `2. Check the most recent edits to \`infra/k8s/overlays/prod/hsts-patch.yaml\` (\`git log -p\`).`,
              `3. Check the nginx-ingress controller logs in \`kube-system\` for any HSTS-related warnings.`,
              `4. If the prod ingress is healthy but Cloudflare is in front: check Cloudflare's "Security → SSL/TLS → Edge Certificates" — HSTS settings there will OVERRIDE the origin's header.`,
              `5. Once the regression is identified + fixed, re-run \`hsts-readiness-check\` via \`workflow_dispatch\`; this issue will auto-close.`,
              ``,
              `## Sticky issue convention`,
              ``,
              `This issue is updated by the workflow rather than re-opened so the issue number is stable across failures. New failures during an ongoing incident append comments below; recovery closes the issue automatically.`,
            ].join('\n');

            if (sticky) {
              if (sticky.state !== 'open') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: sticky.number,
                  state: 'open',
                });
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sticky.number,
                body,
              });
              core.info(`Updated sticky issue #${sticky.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: ISSUE_TITLE,
                body,
                labels: ['ops', 'security', 'hsts'],
              });
              core.info(`Opened sticky issue #${created.data.number}`);
            }

  fail-if-mismatch:
    name: Fail workflow on header mismatch
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Assert pass
        env:
          STATUS: ${{ needs.probe.outputs.status }}
        run: |
          if [ "${STATUS}" != "pass" ]; then
            echo "::error::HSTS readiness probe FAILED (status=${STATUS:-unknown})"
            exit 1
          fi
          echo "HSTS readiness probe PASSED"
