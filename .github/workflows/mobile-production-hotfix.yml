# Phase K Wave 9 — Apone (DevOps).
#
# Mobile PRODUCTION HOTFIX track — Internal → Production bypass.
#
# The W8 promotion ladder enforces Internal → External → Production
# (`mobile-internal-testing.yml` → `mobile-external-testing.yml` →
# `mobile-production-release.yml`). External-Testing is a 24-h+
# soak with real beta users — appropriate for routine releases,
# unacceptable for a P0 security or stability hotfix.
#
# This workflow is the EXPRESS path: Internal → Production
# directly, with a STRICTER env gate (`release-channel:
# production-hotfix`) requiring TWO reviewers (vs ONE on the
# routine `release-channel: production` env).
#
# Trigger:
#
#   * Tag push: `mobile-hotfix-v*.*.*` (disjoint from `mobile-v*`
#     internal + `mobile-prod-v*` routine production)
#   * `workflow_dispatch` for re-runs against an existing tag
#
# Tag space (now four disjoint prefixes — see
# `docs/mobile-release.md §7.1` "Tag space"):
#
#   | Prefix              | Workflow                            |
#   |---------------------|-------------------------------------|
#   | mobile-v*           | mobile-internal-testing.yml         |
#   | (no tag, dispatch)  | mobile-external-testing.yml         |
#   | mobile-prod-v*      | mobile-production-release.yml       |
#   | mobile-hotfix-v*    | mobile-production-hotfix.yml (THIS) |
#
# Audit trail:
#
#   The workflow logs a PROMINENT warning that External-Testing
#   was skipped + the reviewer who approved the env gate. Every
#   hotfix release is therefore traceable to a named reviewer
#   sign-off in the workflow log + the GitHub Environment audit
#   log.
#
# Operator runbook: `docs/mobile-release.md §7.2` "Hotfix path".

name: mobile-production-hotfix

on:
  push:
    tags:
      - "mobile-hotfix-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Hotfix tag to promote (mobile-hotfix-vMAJOR.MINOR.PATCH). MUST already exist."
        required: true
      internal_tag:
        description: "The Internal-Testing tag the hotfix is being promoted from (mobile-vMAJOR.MINOR.PATCH). MUST already exist."
        required: true
      hotfix_reason:
        description: "Why External-Testing was skipped (security CVE / P0 crash / data-loss bug / etc.) — recorded in the workflow log + Slack notification for audit."
        required: true
      release_notes:
        description: "Release notes for end-users (max ~4000 chars; user-facing copy)."
        required: true
      android_rollout_fraction:
        description: "Initial rollout fraction for Play Production (0.0–1.0). 0.1 = 10% staged; 1.0 = full release. Hotfixes default to 1.0 (full, not staged)."
        required: false
        default: "1.0"
      android_release_status:
        description: "Play release_status — 'inProgress' (staged via rollout fraction), 'completed' (immediate 100%), or 'draft' (operator gates the click). Hotfixes default to 'completed'."
        required: false
        default: "completed"
        type: choice
        options:
          - draft
          - inProgress
          - completed
      ios_automatic_release:
        description: "iOS: flip release to 'Released' automatically once Apple App Review (Expedited) passes."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write

# Hotfix promotion is single-track; never let two hotfix pushes
# race. `cancel-in-progress: false` because Apple's App Review
# (even Expedited) cannot be cancelled mid-flight.
concurrency:
  group: mobile-production-hotfix
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve tags + capture hotfix inputs
    runs-on: ubuntu-latest
    # STRICTER env gate than routine production: requires TWO
    # reviewers (configured in repo Settings → Environments →
    # release-channel-production-hotfix → Required reviewers).
    environment:
      name: release-channel-production-hotfix
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      internal_tag: ${{ steps.tag.outputs.internal_tag }}
      package_name: ${{ steps.tag.outputs.package_name }}
      ios_bundle_id: ${{ steps.tag.outputs.ios_bundle_id }}
      hotfix_reason: ${{ steps.tag.outputs.hotfix_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve + validate tags
        id: tag
        env:
          PUSH_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_INTERNAL_TAG: ${{ inputs.internal_tag }}
          INPUT_HOTFIX_REASON: ${{ inputs.hotfix_reason }}
        run: |
          set -euo pipefail
          # Prefer workflow_dispatch input; fall back to the push tag.
          if [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="$INPUT_TAG"
          else
            # PUSH_REF looks like refs/tags/mobile-hotfix-vX.Y.Z
            TAG="${PUSH_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^mobile-hotfix-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' does not match mobile-hotfix-vMAJOR.MINOR.PATCH"
            exit 1
          fi
          VERSION="${TAG#mobile-hotfix-v}"

          # Internal-tag input is REQUIRED — hotfixes promote from
          # an existing Internal-Testing build. No External step
          # is run, but the Internal tag MUST exist so the build
          # has been smoke-tested at least once.
          if [[ -n "${INPUT_INTERNAL_TAG:-}" ]]; then
            INTERNAL_TAG="$INPUT_INTERNAL_TAG"
          else
            INTERNAL_TAG="mobile-v${VERSION}"
          fi
          if [[ ! "$INTERNAL_TAG" =~ ^mobile-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::internal_tag '$INTERNAL_TAG' does not match mobile-vMAJOR.MINOR.PATCH"
            exit 1
          fi

          # Hotfix reason is REQUIRED — recorded in step summary +
          # Slack + audit log. Empty reason = workflow fails.
          HOTFIX_REASON="${INPUT_HOTFIX_REASON:-}"
          if [[ -z "$HOTFIX_REASON" && "${INPUT_TAG:-}" != "" ]]; then
            echo "::error::hotfix_reason input is required for workflow_dispatch invocation"
            exit 1
          fi
          # On `push`-triggered hotfix, the reason defaults to a
          # placeholder. The operator should supplement via the
          # release notes + post-merge audit comment.
          if [[ -z "$HOTFIX_REASON" ]]; then
            HOTFIX_REASON="(push-triggered; see release notes for justification)"
          fi

          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag '$TAG' does not exist in the repository"
            exit 1
          fi
          if ! git rev-parse "refs/tags/$INTERNAL_TAG" >/dev/null 2>&1; then
            echo "::error::internal_tag '$INTERNAL_TAG' does not exist — Internal-Testing build is the only required pre-flight for a hotfix"
            exit 1
          fi

          PACKAGE_NAME="com.long2know.mahjong"
          IOS_BUNDLE_ID="com.long2know.mahjong"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "internal_tag=$INTERNAL_TAG"
            echo "package_name=$PACKAGE_NAME"
            echo "ios_bundle_id=$IOS_BUNDLE_ID"
            echo "hotfix_reason=$HOTFIX_REASON"
          } >> "$GITHUB_OUTPUT"

          # PROMINENT warning that External-Testing was bypassed.
          # Reviewers see this in the step summary + the workflow
          # log header. The audit trail is the env-approval click
          # plus this banner.
          {
            echo "## ⚠️  MOBILE PRODUCTION HOTFIX — External-Testing SKIPPED"
            echo ""
            echo "**Tag:** \`$TAG\`"
            echo "**Promoting Internal tag:** \`$INTERNAL_TAG\` (no External-Testing soak)"
            echo "**Hotfix reason:** $HOTFIX_REASON"
            echo "**Env-gate reviewers:** \`release-channel-production-hotfix\` (2 required)"
            echo ""
            echo "Routine releases ship through:"
            echo ""
            echo "    Internal (mobile-internal-testing.yml)"
            echo "    → External (mobile-external-testing.yml — 24h+ beta soak)"
            echo "    → Production (mobile-production-release.yml)"
            echo ""
            echo "This workflow SKIPS the External-Testing soak. Used"
            echo "only for security CVEs / P0 stability bugs / data-loss"
            echo "fixes where the External soak window is unacceptable."
            echo ""
            echo "Post-release: log a follow-up External-Testing build for"
            echo "the NEXT routine cut so the bypass does not become normalised."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning::MOBILE PRODUCTION HOTFIX — External-Testing SKIPPED. Tag=$TAG. Internal=$INTERNAL_TAG. Reason=$HOTFIX_REASON"
          echo "Promoting hotfix to Production (External SKIPPED): tag=$TAG version=$VERSION internal=$INTERNAL_TAG reason=$HOTFIX_REASON"

      - name: Write release-notes payload (artefact)
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          mkdir -p release-notes
          if [[ -z "${NOTES:-}" ]]; then
            echo "::error::release_notes input is required for hotfix promotion"
            exit 1
          fi
          CHARS=${#NOTES}
          if (( CHARS > 4000 )); then
            echo "::error::release_notes is $CHARS chars; max 4000"
            exit 1
          fi
          printf '%s\n' "$NOTES" > release-notes/hotfix.txt
          echo "Wrote release-notes/hotfix.txt ($CHARS chars)"

      - name: Upload release-notes artefact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-notes-${{ steps.tag.outputs.version }}-hotfix
          path: release-notes/
          retention-days: 90

  android-hotfix:
    name: Android — promote Internal → Production (Hotfix)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Detect Play credentials
        id: secrets
        env:
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${PLAY_SA:-}" ]]; then
            echo "have-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON missing — skipping Play Production hotfix promotion"
          else
            echo "have-secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby (fastlane)
        if: steps.secrets.outputs.have-secrets == 'true'
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install fastlane
        if: steps.secrets.outputs.have-secrets == 'true'
        run: |
          set -euo pipefail
          gem install fastlane -NV
          fastlane --version

      - name: Download release notes
        if: steps.secrets.outputs.have-secrets == 'true'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-notes-${{ needs.prepare.outputs.version }}-hotfix
          path: release-notes/

      - name: fastlane supply — promote Internal → Production (hotfix)
        id: promote
        if: steps.secrets.outputs.have-secrets == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          ROLLOUT: ${{ inputs.android_rollout_fraction || '1.0' }}
          RELEASE_STATUS: ${{ inputs.android_release_status || 'completed' }}
          HOTFIX_REASON: ${{ needs.prepare.outputs.hotfix_reason }}
        run: |
          set -euo pipefail
          mkdir -p fastlane
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | base64 -d > fastlane/play-sa.json
          chmod 600 fastlane/play-sa.json

          mkdir -p fastlane/metadata/android/en-US/changelogs
          cp release-notes/hotfix.txt fastlane/metadata/android/en-US/changelogs/default.txt

          # HOTFIX PATH — promotes the Internal-Testing build
          # directly to Production. `--track internal` is the
          # source; `track_promote_to production` is the
          # cross-track promotion (no AAB re-upload).
          #
          # Default ROLLOUT = 1.0 (full release, not staged) +
          # RELEASE_STATUS = completed — hotfixes are usually
          # urgent enough that staged rollout is the wrong
          # default. Operator can override via workflow_dispatch
          # inputs if the hotfix is risky enough to want staging.
          SUPPLY_ARGS=(
            --json_key fastlane/play-sa.json
            --package_name "$PACKAGE_NAME"
            --track internal
            --track_promote_to production
            --release_status "$RELEASE_STATUS"
            --skip_upload_apk true
            --skip_upload_aab true
            --skip_upload_metadata true
            --skip_upload_images true
            --skip_upload_screenshots true
            --metadata_path fastlane/metadata/android/
          )
          if [[ "$RELEASE_STATUS" == "inProgress" ]]; then
            SUPPLY_ARGS+=(--rollout "$ROLLOUT")
          fi

          echo "::warning::HOTFIX promotion — Internal → Production direct (skipping External). Reason: $HOTFIX_REASON"
          fastlane supply "${SUPPLY_ARGS[@]}"
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Skip notice (no secrets)
        if: steps.secrets.outputs.have-secrets != 'true'
        run: |
          echo "Android Production HOTFIX promotion SKIPPED (missing PLAY_SERVICE_ACCOUNT_JSON)" >> "$GITHUB_STEP_SUMMARY"

  ios-hotfix:
    name: iOS — submit TestFlight Internal → App Store Production (Hotfix)
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Detect App Store Connect API key
        id: secrets
        env:
          APPLE_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_KEY:-}" || -z "${APPLE_KEY_ID:-}" || -z "${APPLE_ISSUER:-}" ]]; then
            echo "have-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_API_KEY_BASE64 / APPLE_API_KEY_ID / APPLE_API_ISSUER_ID missing — skipping App Store Production hotfix"
          else
            echo "have-secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby (fastlane)
        if: steps.secrets.outputs.have-secrets == 'true'
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install fastlane
        if: steps.secrets.outputs.have-secrets == 'true'
        run: |
          set -euo pipefail
          gem install fastlane -NV
          fastlane --version

      - name: Decode App Store Connect API key
        if: steps.secrets.outputs.have-secrets == 'true'
        env:
          APPLE_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .ascapi
          printf '%s' "$APPLE_KEY" | base64 -d > .ascapi/AuthKey.p8
          chmod 600 .ascapi/AuthKey.p8

      - name: Download release notes
        if: steps.secrets.outputs.have-secrets == 'true'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-notes-${{ needs.prepare.outputs.version }}-hotfix
          path: release-notes/

      - name: fastlane deliver — submit App Store hotfix (Expedited Review)
        id: promote
        if: steps.secrets.outputs.have-secrets == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          IOS_BUNDLE_ID: ${{ needs.prepare.outputs.ios_bundle_id }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          AUTOMATIC_RELEASE: ${{ inputs.ios_automatic_release || 'true' }}
          HOTFIX_REASON: ${{ needs.prepare.outputs.hotfix_reason }}
        run: |
          set -euo pipefail
          # Apple Expedited Review is requested out-of-band via
          # App Store Connect after this submission lands. The
          # operator clicks "Request Expedited Review" in the
          # release page; Apple typically responds within hours
          # (vs 24h+ for standard review).
          #
          # The workflow log will print the App Store version
          # URL — paste into the Expedited Review request.

          NOTES_FILE=release-notes/hotfix.txt
          mkdir -p fastlane/metadata/en-US
          cp "$NOTES_FILE" fastlane/metadata/en-US/release_notes.txt

          echo "::warning::HOTFIX iOS submission — Internal → App Store direct (External SKIPPED). Reason: $HOTFIX_REASON. Operator MUST request Expedited Review in App Store Connect."

          fastlane deliver \
            --api_key_path .ascapi/AuthKey.p8 \
            --api_key_id "$APPLE_API_KEY_ID" \
            --api_key_issuer_id "$APPLE_API_ISSUER_ID" \
            --app_identifier "$IOS_BUNDLE_ID" \
            --app_version "$RELEASE_VERSION" \
            --build_number latest \
            --submit_for_review true \
            --automatic_release "$AUTOMATIC_RELEASE" \
            --skip_binary_upload true \
            --skip_screenshots true \
            --skip_metadata false \
            --metadata_path fastlane/metadata/ \
            --force true
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Skip notice (no secrets)
        if: steps.secrets.outputs.have-secrets != 'true'
        run: |
          echo "App Store Production HOTFIX SKIPPED (missing APPLE_API_KEY_* secrets)" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Slack notification (hotfix)
    needs: [prepare, android-hotfix, ios-hotfix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Slack
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          INTERNAL_TAG: ${{ needs.prepare.outputs.internal_tag }}
          HOTFIX_REASON: ${{ needs.prepare.outputs.hotfix_reason }}
          ANDROID_PROMOTED: ${{ needs.android-hotfix.outputs.promoted || 'skipped' }}
          IOS_PROMOTED: ${{ needs.ios-hotfix.outputs.promoted || 'skipped' }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${WEBHOOK:-}" ]]; then
            echo "SLACK_WEBHOOK_URL missing — skipping notification" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PAYLOAD=$(jq -nc \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            --arg internal "$INTERNAL_TAG" \
            --arg reason "$HOTFIX_REASON" \
            --arg android "$ANDROID_PROMOTED" \
            --arg ios "$IOS_PROMOTED" \
            --arg url "https://github.com/${REPO}/actions/runs/${RUN_ID}" \
            '{
              text: ("🚨 *Mobile HOTFIX submitted* — `" + $tag + "` (External-Testing SKIPPED)"),
              blocks: [
                {
                  type: "section",
                  text: { type: "mrkdwn", text: ("🚨 *Mobile PRODUCTION HOTFIX* — `" + $tag + "`\n_External-Testing soak was SKIPPED._") }
                },
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: ("*Version*\n`" + $version + "`") },
                    { type: "mrkdwn", text: ("*Promoted from*\n`" + $internal + "` (Internal)") },
                    { type: "mrkdwn", text: ("*Reason*\n" + $reason) },
                    { type: "mrkdwn", text: ("*Android (Production)*\n" + $android) },
                    { type: "mrkdwn", text: ("*iOS (App Store)*\n" + $ios) }
                  ]
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: { type: "plain_text", text: "View workflow run" },
                      url: $url
                    }
                  ]
                }
              ]
            }')
          curl -fsS -X POST -H 'Content-Type: application/json' \
              --data "$PAYLOAD" \
              "$WEBHOOK"
          echo "Slack hotfix notification posted." >> "$GITHUB_STEP_SUMMARY"
