# Phase J Wave 4 — Apone (DevOps).
#
# Builds the single-image multi-stage `Dockerfile` at the repo root and
# publishes it to GitHub Container Registry (ghcr.io) on every push to
# `main`, on version tag pushes, and on manual workflow_dispatch runs.
#
# Phase J Wave 10 — Apone (DevOps).
#
# The build is now MULTI-ARCH. We publish a single manifest list for
# `linux/amd64` + `linux/arm64`, so Stephen's Linux server (potentially
# an arm64 Raspberry-Pi-class box or AWS Graviton VM) can pull
# `ghcr.io/long2know/mahjong-autotable:latest` and Docker picks the
# matching arch transparently. Buildx + QEMU-action provides cross-arch
# emulation in CI; the Dockerfile is arch-agnostic (uses official
# mcr.microsoft.com/dotnet base images which are themselves multi-arch).
#
# Tag scheme:
#   - `latest`             — every successful main build
#   - `sha-<commit-sha>`   — every successful build (can move on a rebuild)
#   - `<git-tag-name>`     — only on `refs/tags/*` pushes (e.g. `v1.2.3`)
# Main builds also get a build-<run-id>-<build-attempt> GitHub prerelease.
# Only the image digest is an immutable image reference; build records do
# not replace the separately gated v*.*.* production releases.
#
# Authentication uses the workflow's auto-provisioned `GITHUB_TOKEN`;
# pushes to `ghcr.io/<owner>/<repo>` from the same repository require no PAT.
#
# The `/health` endpoint reads the commit SHA from the `BUILD_SHA` env var
# (Program.cs Phase J Wave 3). We pass it as a build-arg so the runtime
# layer bakes the actual commit SHA — `docker run … && curl /health` on a
# published image will return the SHA, not "dev".

name: docker-build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: long2know/mahjong-autotable
  # Phase J Wave 10 — both architectures Stephen's deploy targets need.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    name: Build + push multi-arch (amd64, arm64) to ghcr.io
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
      build-attempt: ${{ steps.publication.outputs.build-attempt }}
    steps:
      - name: Checkout
        # Phase K Wave 16 — Apone (DevOps). SLSA-3 W16 hardening:
        # action SHAs hard-pinned per docs/slsa-provenance.md §7c.
        # Comment after the SHA documents the human-readable version
        # the SHA maps to; cosmetic only, the SHA is the source of
        # truth at admission/CI time.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check build-release contracts (mocked APIs only)
        run: python3 -B tests/ci/test-build-release.py

      # Phase J Wave 10 — QEMU enables linux/arm64 cross-build on the
      # amd64 GitHub-hosted runner. Without this, buildx would fail with
      # "no match for platform" when targeting arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds the `latest`, `sha-<commit>`, and optional `<tag>` tag list
      # dynamically. The PR / branch-context conditionals keep things tidy
      # on workflow_dispatch from a non-main branch.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=tag

      - name: Build and push (multi-arch manifest list)
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: true
          sbom: false  # SBOM emitted by dedicated sbom.yml workflow
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        id: publication
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Preserve the BUILD attempt when only the release job is rerun.
          printf 'build-attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          {
            echo "### Published image tags"
            echo '```'
            printf '%s\n' "$IMAGE_TAGS"
            echo '```'
            echo "Platforms: \`$PLATFORMS\`"
            echo "Manifest digest: \`$IMAGE_DIGEST\`"
            echo "BUILD_SHA baked in: \`$BUILD_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release-record:
    name: Record published main build
    needs: build-and-push
    if: >-
      needs.build-and-push.result == 'success' &&
      github.repository == 'long2know/mahjong-autotable' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout the built commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create or verify the build release record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          BUILD_RUN_ATTEMPT: ${{ needs.build-and-push.outputs.build-attempt }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image-digest }}
          IMAGE_TAGS: ${{ needs.build-and-push.outputs.image-tags }}
        run: python3 -B scripts/publish_build_release.py --publish
