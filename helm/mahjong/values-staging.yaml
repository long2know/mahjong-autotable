# Phase K Wave 7 — Apone (DevOps).
# Phase K Wave 9 — Apone (DevOps). YAML-anchor refactor.
#
# Staging overrides for the mahjong umbrella chart. Mirrors
# `infra/k8s/overlays/staging/kustomization.yaml`.
#
# Apply:
#   helm upgrade --install mahjong helm/mahjong \
#       -n mahjong-staging --create-namespace \
#       -f helm/mahjong/values-staging.yaml
#
# Parity with the Kustomize overlay (see docs/helm-charts.md §parity-matrix):
#
#   * single replica (cheap soak)
#   * staging.mahjong.example.com host
#   * staging-named JWT-keys ExternalSecret
#   * ASPNETCORE_ENVIRONMENT=Staging
#   * optional in-cluster Postgres (disabled by default; flip on
#     when the cost of an RDS staging instance is unjustified)
#
# Wave 9 convention: cross-reference to other docs/chart sections
# uses symbolic anchor names (§parity-matrix, §canary-analysis,
# §yaml-anchor-pattern) NOT numeric section IDs — see
# `docs/helm-charts.md §yaml-anchor-pattern`.

# ── Anchor library (Phase K Wave 9 — Apone) ──────────────────────
#
# Lock-step values shared between sub-blocks live as YAML anchors
# at the top of the file. Helm ignores `x-*` top-level keys; the
# anchors propagate via `*name` references below. When a value
# changes, the anchor changes and every consumer updates atomically.
x-anchors:
  staging-host: &staging-host "staging.mahjong.example.com"
  staging-tls-secret: &staging-tls-secret "mahjong-autotable-staging-tls"
  staging-env-name: &staging-env-name "Staging"
  staging-cors-origin: &staging-cors-origin "https://staging.mahjong.example.com"

api:
  replicaCount: 1

  ingress:
    host: *staging-host
    tlsSecretName: *staging-tls-secret

  hsts:
    enabled: false  # staging does NOT preload (test surface)

  hpa:
    enabled: false  # single-replica soak

  configMap:
    extra:
      ASPNETCORE_ENVIRONMENT: *staging-env-name
      Cors__AllowedOrigins__0: *staging-cors-origin

  externalSecrets:
    - name: mahjong-autotable
      optional: true
    - name: mahjong-jwt-keys-staging
      optional: true
    - name: mahjong-jwt-rsa-keys-staging
      optional: true

  resources:
    requests:
      cpu: "100m"
      memory: "192Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

coturn:
  # Staging may or may not have a TURN server depending on whether
  # the operator wants WebRTC voice in soak. Default OFF in
  # staging — flip on when needed.
  enabled: false
  realm: *staging-host

postgresSidecar:
  enabled: false  # operator-driven flip when in-cluster PG is preferred
