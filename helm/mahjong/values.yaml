# Phase K Wave 7 — Apone (DevOps).
#
# Umbrella values for the mahjong chart-of-charts. Each subchart
# reads its own subtree (`api.*`, `coturn.*`, `postgresSidecar.*`).
# Overlays land in `values-staging.yaml` + `values-prod.yaml` and
# merge on top of these defaults via `helm upgrade -f`.
#
# Convention: any value that maps onto a Kustomize patch in
# `infra/k8s/overlays/<env>/kustomization.yaml` is exposed as a
# values key here, named to mirror the underlying field path
# (camelCase Helm-side, snake_case ConfigMap-side). The parity
# matrix is documented in `docs/helm-charts.md` §3.

# ── Top-level namespace + naming ──────────────────────────────────
#
# Namespace is set by `helm install -n <ns>` — NOT by a values key.
# Helm's standard. Don't move the namespace into values; that
# breaks the standard `helm -n` flag.

# ── Subchart toggles ──────────────────────────────────────────────
#
# Each subchart can be enabled/disabled independently. The
# matching `condition:` in Chart.yaml's `dependencies` block
# triggers conditional rendering.
api:
  enabled: true

  # Container image. The umbrella's `appVersion` is the canonical
  # tag this chart was validated against; overlays bump.
  image:
    registry: ghcr.io
    repository: long2know/mahjong-autotable
    tag: ""  # falls back to .Chart.AppVersion when empty
    pullPolicy: IfNotPresent
    pullSecrets:
      - name: ghcr-pull

  # Replica count. Overlays patch to env-appropriate floors
  # (staging=1, prod=3).
  replicaCount: 2

  # Pod-level affinity / topology spread. The default empty stanza
  # leaves placement to the scheduler; overlays add
  # podAntiAffinity for prod (matches the W6 coturn pattern).
  affinity: {}
  topologySpreadConstraints: []
  nodeSelector: {}
  tolerations: []

  # Container resource pin. Sized for a small-game footprint;
  # overlays patch for prod (cpu 250m-1000m / memory 384Mi-1Gi
  # per the W7 prod values).
  resources:
    requests:
      cpu: "100m"
      memory: "192Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  service:
    type: ClusterIP
    port: 80
    targetPort: http
    annotations: {}

  ingress:
    enabled: true
    className: nginx
    host: mahjong.example.com
    tlsSecretName: mahjong-autotable-tls
    # nginx-ingress annotations from infra/k8s/base/ingress.yaml.
    # Sticky-session cookie annotations are MANDATORY — SignalR
    # negotiate → connect → reconnect fails without affinity.
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "1m"
      nginx.ingress.kubernetes.io/affinity: "cookie"
      nginx.ingress.kubernetes.io/affinity-mode: "persistent"
      nginx.ingress.kubernetes.io/session-cookie-name: "mahjong_aff"
      nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"
      nginx.ingress.kubernetes.io/session-cookie-expires: "86400"

  # HSTS preload header — applied via configuration-snippet
  # annotation when `hsts.enabled: true`. Mirrors the W4
  # overlay-prod hsts-patch.yaml shape; prod overlay flips on.
  hsts:
    enabled: false
    maxAgeSeconds: 63072000  # 2 years (the preload-eligible floor)
    includeSubDomains: true
    preload: true

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    cpuUtilization: 70
    memoryUtilization: 80

  # Health probes — both hit /health per Phase J Wave 3 contract.
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

  # Non-secret env defaults — mirrors infra/k8s/base/configmap.yaml.
  # Overlays patch via configMap.extra entries (merged).
  configMap:
    persistenceProvider: "Sqlite"
    sqliteConnectionString: "Data Source=/data/mahjong-autotable.db"
    rateLimitingEnabled: "true"
    extra: {}  # additional env vars (string→string) merged into the ConfigMap

  # PVC for the SQLite case. Disabled when persistenceProvider is
  # Postgres or SqlServer (in-cluster Postgres ships via the
  # `postgresSidecar` subchart, not this PVC).
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClassName: ""  # cluster default

  # External secret references the deployment envFrom-mounts.
  # Defaults match the W4/W5/W6 ESO surface; the secret objects
  # themselves are NOT created by this chart — they're materialised
  # out-of-band by ExternalSecretsOperator from SSM.
  externalSecrets:
    - name: mahjong-autotable
      optional: true
    - name: mahjong-jwt-keys
      optional: true
    # W7: RSA JWT keys (RS256) — mounted alongside the W4/W5
    # HS256 keys. Optional so a fresh cluster without the
    # ESO bootstrap still starts.
    - name: mahjong-jwt-rsa-keys
      optional: true

  # Pre-rollout migration Job (Phase J Wave 9). Disabled for
  # SQLite (the file-backed DB self-migrates on container start);
  # enable for Postgres/SqlServer where schema migration is
  # owner-managed.
  migrationJob:
    enabled: false
    image: ""  # defaults to the api image when empty
    args:
      - migrate
      - --provider
      - Postgres

  # Pod security baseline — matches the deployment.yaml defaults.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false  # /data is the writable volume
    capabilities:
      drop: ["ALL"]

# ── Coturn subchart ───────────────────────────────────────────────
#
# Mirrors the W6 production manifests
# (`infra/k8s/base/coturn-*.yaml`).
coturn:
  enabled: true

  image:
    repository: coturn/coturn
    tag: "4.6"
    pullPolicy: IfNotPresent

  replicaCount: 2

  # Realm + external IP MUST be set per-env. Defaults work for the
  # default values; overlays patch.
  realm: "mahjong.example.com"
  externalIp: ""  # populated post-NLB provisioning

  ports:
    listening: 3478
    tls: 5349
    minRelay: 49152
    maxRelay: 65535

  # ExternalSecret materialising the HMAC auth secret from SSM
  # — `/mahjong/<env>/turn/auth_secret`. Bishop's `/api/turn`
  # endpoint shares the same key; one rotation rolls both sides.
  externalSecret:
    enabled: true
    name: coturn-static-auth-secret
    refreshInterval: 15m
    secretStoreName: "aws-secrets-manager"  # env override required
    ssmKey: "/mahjong/<env>/turn/auth_secret"  # env override required

  # NetworkPolicy gating UDP 49152-65535 (IANA ephemeral) +
  # 3478 UDP/TCP + 5349 TCP. Egress wide-open (TURN job is to
  # NAT-traverse to arbitrary peers).
  networkPolicy:
    enabled: true

  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 998
    runAsGroup: 998
    fsGroup: 998
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  # AZ-spread (W6 invariant).
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: mahjong-coturn

# ── Postgres sidecar (optional, staging-only) ─────────────────────
#
# DISABLED BY DEFAULT. Prod uses RDS via the Terraform
# `infra/terraform/` stack — this subchart is for the cheapest
# possible staging soak (no AWS-tab spend).
postgresSidecar:
  enabled: false

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  # Connection-info exposed for the API subchart to consume.
  # The chart-of-charts writes these into the api ConfigMap via
  # template logic in charts/mahjong-api/templates/configmap.yaml
  # ONLY when postgresSidecar.enabled is true.
  database: "mahjong"
  username: "mahjong"
  # Password is NOT in values — it lands in the existing
  # `mahjong-autotable` omnibus secret under the
  # `ConnectionStrings__Postgres` key (the W5 ESO shape).
  port: 5432

  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# ── Canary deployment strategy (Phase K Wave 8 — Apone) ───────────
#
# When `canary.enabled = true`, the umbrella's
# `templates/canary-deployment.yaml` renders an Argo Rollouts
# `Rollout` resource (replacing the static api Deployment from the
# `mahjong-api` subchart) that progressively shifts traffic from
# the stable to the canary ReplicaSet through the configured steps.
#
# Cluster prerequisites:
#   * Argo Rollouts controller installed in the `argo-rollouts`
#     namespace (see docs/helm-charts.md §3).
#   * (optional) Prometheus reachable at `canary.metricEndpoint`
#     for automated success-rate gating; otherwise the analysis
#     block is suppressed and the steps fire on duration-only.
#
# Co-existence guard:
#   The Rollout's selector matches the SAME labels as the
#   subchart Deployment. Helm errors loudly on render when both
#   `api.enabled` and `canary.enabled` are true (the guard lives
#   in `templates/canary-deployment.yaml`). To enable canary,
#   either set `api.enabled = false` (the canary path supersedes
#   the subchart's static Deployment) or set
#   `canary.coexistWithDeployment = true` (advanced — for staging
#   where you want the static surface AND the canary surface
#   exercised in parallel).
canary:
  enabled: false

  # Set true ONLY for advanced staging-soak scenarios where the
  # static Deployment AND the Rollout-managed canary should
  # coexist (e.g. comparing two image variants in parallel).
  # Production MUST keep this false — two controllers on the same
  # selector is a known foot-gun.
  coexistWithDeployment: false

  # Argo Rollouts retains this many old ReplicaSets for rollback
  # via `kubectl argo rollouts undo`. Higher in prod (4 = last 4
  # promotions are revertable); lower in staging.
  revisionHistoryLimit: 3

  # Delay before scaling down the OLD stable ReplicaSet after a
  # successful promotion. 30s lets in-flight requests drain before
  # the old pods are terminated.
  scaleDownDelaySeconds: 30

  # Canary steps — the W8 baseline progression. Each entry is one
  # of:
  #   { setWeight: <0-100> }       — set canary traffic %
  #   { setWeight: <%>, pause: { duration: "<go-duration>" } }
  #                                — set + pause for the duration
  #   { setWeight: <%>, pause: {} } — set + pause indefinitely
  #                                  until operator runs
  #                                  `kubectl argo rollouts promote`
  #   { setWeight: <%>, analysis: true } — set + run the success-
  #                                  rate AnalysisTemplate; abort
  #                                  on failure
  #
  # W8 baseline progression: 5% → 20% → 50% → 100% with success-
  # rate analysis at every weight. Adjust per-environment in
  # values-staging.yaml / values-prod.yaml.
  steps:
    - setWeight: 5
    - pause:
        duration: "2m"
    - analysis: true
    - setWeight: 20
    - pause:
        duration: "5m"
    - analysis: true
    - setWeight: 50
    - pause:
        duration: "10m"
    - analysis: true
    - setWeight: 100

  # Prometheus query URL the AnalysisTemplate hits. Set to empty
  # string to disable analysis (steps become duration-only).
  # Example: "http://prometheus.monitoring.svc.cluster.local:9090"
  # Phase K Wave 9: prod overlay (`values-prod.yaml`) points this
  # at the actual prod Prometheus.
  metricEndpoint: ""

  # ── AnalysisTemplate set (Phase K Wave 9 — Apone) ───────────────
  #
  # W9 retargets the W8 single-metric gate at THREE Prometheus
  # gates that must ALL pass for the canary step to advance:
  #
  #   1. success-rate   — >99% non-5xx responses over 5m
  #   2. p99-latency    — <500ms p99 over 5m
  #   3. error-budget   — burn-rate < 14.4× over 5m
  #                       (Google SRE 2%/1h fast-burn alert)
  #
  # Argo Rollouts evaluates the templates in parallel; if ANY
  # template's `failureLimit` polls fall short, the rollout aborts
  # and Argo Rollouts rolls back to stable. If ALL templates'
  # `count` polls succeed, the step advances.
  #
  # Each template can be independently disabled via
  # `.enabled: false` (the chart skips rendering AND skips
  # referencing it in the Rollout's analysis step).
  #
  # See `docs/helm-charts.md §canary-analysis` for the per-template
  # PromQL + interpretation.
  analyses:
    successRate:
      enabled: true
      interval: "30s"
      count: 10                  # 30s × 10 = 5m rolling window
      successThreshold: 0.99     # >99% pass
      failureLimit: 1
    p99Latency:
      enabled: true
      interval: "30s"
      count: 10
      thresholdMillis: 500       # <500ms p99
      failureLimit: 1
      # Override if the histogram is published under a different
      # name (e.g. `request_duration_seconds_bucket` from an older
      # OTEL exporter). Default matches the .NET 10 + OTEL
      # `http_request_duration_seconds_bucket` shape.
      metric: "http_request_duration_seconds_bucket"
    errorBudget:
      enabled: true
      interval: "30s"
      count: 10
      # 14.4 × the steady-state error rate consumes 2% of a monthly
      # error budget in 1h — Google SRE 2%/1h fast-burn alert.
      burnRateThreshold: 14.4
      # SLO error rate (denominator of the burn-rate ratio). 0.01
      # corresponds to a 99% success SLO. Lower = tighter SLO =
      # more sensitive gate.
      sloErrorRate: 0.01
      failureLimit: 1

  # ── Legacy single-metric tuning (Phase K Wave 8 — superseded) ──
  #
  # W8 shipped a single `analysis:` block tuning the
  # `mahjong-autotable-success-rate` template. W9 split the
  # analysis surface into the three-template `analyses:` block
  # above. The legacy block stays for one wave of carry-forward;
  # values are IGNORED by the W9 template (the chart reads
  # `analyses.*` only). Remove after W10 retro.
  analysis:
    interval: "30s"
    count: 5
    successThreshold: 0.95
    failureLimit: 1
