{{/*
Phase K Wave 7 — Apone (DevOps).

Coturn ConfigMap holding `turnserver.conf`. Mirrors the W6
production `infra/k8s/base/coturn-configmap.yaml`.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mahjong-coturn.fullname" . }}
  labels:
    {{- include "mahjong-coturn.labels" . | nindent 4 }}
data:
  turnserver.conf: |
    # Generated by helm/mahjong/charts/mahjong-coturn — DO NOT edit
    # in-cluster (changes will be lost on `helm upgrade`).
    listening-port={{ .Values.ports.listening }}
    tls-listening-port={{ .Values.ports.tls }}
    fingerprint
    lt-cred-mech
    use-auth-secret
    realm={{ .Values.realm }}
    {{- if .Values.externalIp }}
    external-ip={{ .Values.externalIp }}
    {{- end }}
    min-port={{ .Values.ports.minRelay }}
    max-port={{ .Values.ports.maxRelay }}
    no-cli
    no-loopback-peers
    no-multicast-peers
    total-quota=1080
    pidfile=/var/tmp/turnserver.pid
    cli-password=__unused__
    log-file=stdout
    syslog
    no-stdout-log
