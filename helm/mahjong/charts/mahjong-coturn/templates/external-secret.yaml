{{- if .Values.externalSecret.enabled -}}
{{/*
Phase K Wave 7 — Apone (DevOps). Coturn HMAC auth ExternalSecret.

NOTE: rendered ONLY when ExternalSecretsOperator is installed in
the cluster. The Deployment's `secretKeyRef` marks the secret
`optional: true` so a fresh cluster without ESO still starts;
the operator backfills as soon as ESO syncs the SSM parameter
into a kubernetes Secret.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name }}
  labels:
    {{- include "mahjong-coturn.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStoreName | quote }}
  target:
    name: {{ .Values.externalSecret.name }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: static_auth_secret
      remoteRef:
        key: {{ .Values.externalSecret.ssmKey | quote }}
{{- end }}
