{{- if .Values.networkPolicy.enabled -}}
{{/*
Phase K Wave 7 — Apone (DevOps). Coturn NetworkPolicy.

Mirrors W6 production NetworkPolicy: admit ephemeral relay range
(49152-65535 UDP) + control-plane ports (3478 UDP+TCP, 5349 TCP).
Egress wide-open — TURN's job is to NAT-traverse to arbitrary peers.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mahjong-coturn.fullname" . }}-relay-ports
  labels:
    {{- include "mahjong-coturn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mahjong-coturn.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - protocol: UDP
          port: {{ .Values.ports.listening }}
        - protocol: TCP
          port: {{ .Values.ports.listening }}
        - protocol: TCP
          port: {{ .Values.ports.tls }}
        - protocol: UDP
          port: {{ .Values.ports.minRelay }}
          endPort: {{ .Values.ports.maxRelay }}
  egress:
    - {}
{{- end }}
