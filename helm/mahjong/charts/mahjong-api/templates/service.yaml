{{/* Phase K Wave 7 — Apone (DevOps). API Service. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mahjong-api.fullname" . }}
  labels:
    {{- include "mahjong-api.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mahjong-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
