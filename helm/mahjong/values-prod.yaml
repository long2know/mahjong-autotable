# Phase K Wave 7 — Apone (DevOps).
#
# Production overrides for the mahjong umbrella chart. Mirrors
# `infra/k8s/overlays/prod/kustomization.yaml` + W6 production
# coturn shape.
#
# Apply:
#   helm upgrade --install mahjong helm/mahjong \
#       -n mahjong-prod --create-namespace \
#       -f helm/mahjong/values-prod.yaml
#
# Parity with the Kustomize overlay (see docs/helm-charts.md §5).
# Any change here MUST track the matching Kustomize patch — the
# two stay in lock-step until the operator picks a single path.

api:
  replicaCount: 3

  image:
    pullPolicy: IfNotPresent

  ingress:
    host: mahjong.example.com
    tlsSecretName: mahjong-autotable-tls

  hsts:
    enabled: true
    maxAgeSeconds: 63072000
    includeSubDomains: true
    preload: true

  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    cpuUtilization: 70
    memoryUtilization: 80

  resources:
    requests:
      cpu: "250m"
      memory: "384Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  configMap:
    persistenceProvider: "Postgres"
    extra:
      ASPNETCORE_ENVIRONMENT: "Production"
      Cors__AllowedOrigins__0: "https://mahjong.example.com"

  # In prod, /data is NOT a PVC — Postgres lives on RDS via
  # `infra/terraform/` stack. Disable the SQLite PVC.
  persistence:
    enabled: false

  externalSecrets:
    - name: mahjong-autotable
      optional: false  # MUST be present in prod
    - name: mahjong-jwt-keys
      optional: true   # ESO bootstrap may lag; envFrom-optional
    - name: mahjong-jwt-rsa-keys
      optional: true   # W7 RS256 fallback

  migrationJob:
    enabled: true
    args:
      - migrate
      - --provider
      - Postgres

  # PodAntiAffinity — keep replicas on distinct AZs. Mirrors the
  # W6 coturn pattern.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: topology.kubernetes.io/zone
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: mahjong-autotable

coturn:
  enabled: true
  realm: "mahjong.example.com"
  externalIp: ""  # operator must set post-NLB provisioning
  replicaCount: 2

  externalSecret:
    enabled: true
    name: coturn-static-auth-secret
    refreshInterval: 15m
    secretStoreName: "aws-secrets-manager-prod"
    ssmKey: "/mahjong/prod/turn/auth_secret"

  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

postgresSidecar:
  # PROD NEVER uses the in-cluster sidecar — RDS only. Documented
  # in docs/helm-charts.md §6 as a chart-level invariant: do NOT
  # enable in prod.
  enabled: false
