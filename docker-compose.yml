# Mahjong Autotable — local-dev compose file.
#
# Builds the single image defined in ./Dockerfile and exposes it on host
# port 8080. SQLite persistence lives on the `mahjong-data` named volume so
# data survives `docker compose down` (use `docker compose down -v` to wipe).
#
# Quickstart (first run provisions a stable JWT key into a gitignored .env):
#   ./scripts/compose-bootstrap.sh        # idempotent — safe to re-run
#   docker compose up -d --build
#   open http://localhost:8080/autotable/
#
# WHY the bootstrap step: the image bakes ASPNETCORE_ENVIRONMENT=Production, and
# the API refuses to boot without a stable HMAC signing key (a per-process
# random key would silently invalidate every JWT on restart — see
# JwtSigningKeyProvider.cs / docs/jwt-rotation.md §7). `JWT_SIGNING_KEY` is
# injected below as `Authentication__JwtSigningKeys__0`. It is REQUIRED — if
# unset/empty, `docker compose up` fails fast with an actionable message
# instead of crash-looping under `restart: unless-stopped`. scripts/compose-
# bootstrap.sh writes/keeps the key in your local `.env` (gitignored +
# .dockerignored); no secret is ever committed, and the key stays stable across
# restarts. Manual alternative:
#   cp .env.example .env && echo "JWT_SIGNING_KEY=$(openssl rand -base64 48)" >> .env
#
# Phase J Wave 3 — Apone (DevOps). Phase L WP-G (#121) — .env JWT wiring.
services:
  mahjong:
    build:
      context: .
      dockerfile: Dockerfile
    image: mahjong-autotable:local
    container_name: mahjong-autotable
    ports:
      - "8080:8080"
    volumes:
      - mahjong-data:/data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      BUILD_SHA: ${BUILD_SHA:-local}
      # Required base64 HMAC signing key — sourced from your local .env.
      # `:?` makes compose abort with this message when it is unset/empty,
      # converting a silent Production crash-loop into a one-time setup fix.
      Authentication__JwtSigningKeys__0: "${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env before compose up - copy .env.example then append a key from openssl rand -base64 48}"
    restart: unless-stopped

volumes:
  mahjong-data:
